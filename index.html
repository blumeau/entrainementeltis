s à imprimer, et un risque de collision.", "B": "Mauvaise réponse. Le lever du soleil n'est pas mentionné. Le prof explique que midi variait d'une ville à l'autre (le soleil au plus haut), mais le problème pour les trains, c'était les horaires impossibles à imprimer et le risque que deux trains se retrouvent sur la même voie. Réponse A.", "C": "Mauvaise réponse. Les montres des passagers ne sont jamais évoquées. Le problème venait des équipages (« crews ») qui utilisaient des horloges différentes, pas des voyageurs. Réponse A."}}, {"n": 16, "q": "What happened in 1883?", "options": {"A": "Congress passed a law about time zones.", "B": "The railroads divided the country into four time zones.", "C": "Every town started using the sun to set its clocks."}, "answer": "B", "feedback": {"A": "Mauvaise réponse. Attention aux dates : la loi du Congrès date de 1918 (« in 1918 Congress made it official law »). En 1883, ce sont les compagnies de chemin de fer, pas le gouvernement, qui ont créé les quatre zones. Réponse B.", "B": "Bonne réponse. « In 1883, the major railroad companies got together and divided the country into four zones. » Le 18 novembre, les villes ont remis leurs horloges à l'heure, « the day of two noons ».", "C": "Mauvaise réponse. Régler les horloges sur le soleil, c'était justement l'ancien système, celui d'avant 1883 (« noon was whenever the sun was highest in the sky over your town »). 1883 marque la fin de ce système, avec la création des quatre zones par les chemins de fer. Réponse B."}}], "transcript": ["Student: Mr. Delgado, why does the United States have four different time zones? Wouldn't it be simpler if everyone used the same time?", "Teacher: Well, for most of history, every town actually had its own time. Noon was whenever the sun was highest in the sky over your town. So noon in Boston was about twelve minutes earlier than noon in New York.", "Student: Twelve minutes? That doesn't sound like a big deal.", "Teacher: It wasn't, until the railroads came along. Imagine you're running a train that goes through fifty towns, and every town has a slightly different time. Printing a schedule was a nightmare, and worse, two trains could end up on the same track because their crews were using different clocks.", "Student: So the railroads fixed it?", "Teacher: They did. In 1883, the major railroad companies got together and divided the country into four zones. Inside each zone, every clock showed the same time. On November 18th, towns across the country reset their clocks at noon. People called it the day of two noons.", "Student: Did everyone just accept that?", "Teacher: Not at first. Some towns refused for years. But it was so convenient that it stuck, and in 1918 Congress made it official law."]}, {"id": "P4_17-19", "part": 4, "audio": "audio/tb2/P4_dialogue3_Q17-19.mp3", "instruction": "You will hear a conversation in a classroom, followed by three questions. The questions and answer choices are shown on the screen while they are read. Press play when you are ready: you can listen only once.", "intro": "Listen to this conversation. You will hear two students talking in an English classroom. Listen carefully.", "questions": [{"n": 17, "q": "What is the discussion mainly about?", "options": {"A": "How to write a good essay introduction.", "B": "The difference between two kinds of narrators.", "C": "The plot of the novel the class is reading."}, "answer": "B", "feedback": {"A": "Mauvaise réponse. La fille parle d'une question de dissertation (« essay question »), mais le garçon ne donne aucun conseil sur l'introduction ou la rédaction. Il explique la différence entre narrateur à la première personne et à la troisième personne. Réponse B.", "B": "Bonne réponse. Dès le début : « whether the novel is written in first person or third person, and I always mix them up ». Tout le dialogue explique ces deux types de narrateur avec des exemples (« I walked into the room » / « Sarah walked into the room »).", "C": "Mauvaise réponse. L'intrigue du roman n'est jamais racontée. La seule chose qu'on apprend sur le roman, c'est que sa narratrice dit « I » et raconte des choses qu'elle n'a pas vues. C'est un exemple pour la discussion sur les narrateurs, pas le sujet. Réponse B."}}, {"n": 18, "q": "According to the boy, what is the main limit of a first-person narrator?", "options": {"A": "The reader only knows what one character knows.", "B": "The narrator cannot use the word I.", "C": "The story cannot take place in several cities."}, "answer": "A", "feedback": {"A": "Bonne réponse. « You only know what that one character knows. If she doesn't see something, you don't see it either. That's the big limit of first person. »", "B": "Mauvaise réponse. C'est l'inverse : le narrateur à la première personne dit justement « I, me, my ». C'est sa marque, pas sa limite. La limite, c'est que le lecteur ne sait que ce que ce personnage sait. Réponse A.", "C": "Mauvaise réponse. Les autres villes sont citées à propos du narrateur à la troisième personne qui sait tout (« even things that happen in other cities »). Le garçon ne dit pas qu'une histoire à la première personne doit se passer dans un seul lieu. La limite qu'il nomme, c'est le point de vue unique : réponse A."}}, {"n": 19, "q": "What does Mr. Hale call a first-person narrator who tells the story after finding out what happened?", "options": {"A": "A third-person narrator.", "B": "An outside narrator.", "C": "A retrospective narrator."}, "answer": "C", "feedback": {"A": "Mauvaise réponse. Le garçon répond clairement « Yes, it's still first person » : la narratrice dit « I », donc elle reste à la première personne, même si elle sait des choses qu'elle n'a pas vues. Le terme de Mr. Hale est « retrospective narrator » : réponse C.", "B": "Mauvaise réponse. « Outside the story » est l'expression utilisée pour décrire le narrateur à la troisième personne, pas celui du roman. Le mot que Mr. Hale utilise, et que le garçon conseille de mettre dans la dissertation, c'est « retrospective narrator » : réponse C.", "C": "Bonne réponse. « She's just telling the story later, after she found out what happened. Mr. Hale said that's called a retrospective narrator. » Rétrospectif = qui regarde en arrière."}}], "transcript": ["Girl: Can you help me with the essay question? We're supposed to say whether the novel is written in first person or third person, and I always mix them up.", "Boy: Okay, it's actually simple. Who is telling the story? If the narrator is a character inside the story and says I, me, my, that's first person.", "Girl: Like, I walked into the room and I saw the letter on the table.", "Boy: Exactly. You only know what that one character knows. If she doesn't see something, you don't see it either. That's the big limit of first person.", "Girl: And third person?", "Boy: The narrator is outside the story and talks about the characters as he, she, they. Sarah walked into the room and saw the letter. And sometimes a third-person narrator knows everything, what every character is thinking, even things that happen in other cities.", "Girl: So for our novel, the narrator keeps saying I, but she also tells us things she couldn't have seen. Is that still first person?", "Boy: Yes, it's still first person. She's just telling the story later, after she found out what happened. Mr. Hale said that's called a retrospective narrator. You should definitely put that word in your essay.", "Girl: Retrospective narrator. Okay, now I actually have something to write."]}, {"id": "P5_20-23", "part": 5, "audio": "audio/tb2/P5_expose1_Q20-23.mp3", "instruction": "You will hear a teacher talking to a class, followed by four questions. The questions and answer choices are shown on the screen while they are read. Press play when you are ready: you can listen only once.", "intro": "Listen to this passage. You will hear a science teacher talking. Listen carefully.", "questions": [{"n": 20, "q": "What is the talk mainly about?", "options": {"A": "How bees make honey from nectar.", "B": "How bees tell each other where flowers are.", "C": "Why bees need the sun to fly."}, "answer": "B", "feedback": {"A": "Mauvaise réponse. Le nectar est mentionné une fois (« she doesn't just drop off the nectar »), mais la fabrication du miel n'est jamais expliquée. La prof annonce son sujet dès la première phrase : « how honeybees give each other directions ». Réponse B.", "B": "Bonne réponse. Annoncé dès le début (« how honeybees give each other directions ») et développé tout du long : la danse frétillante indique la direction et la distance des fleurs.", "C": "Mauvaise réponse. Le soleil sert de repère dans la danse (« compared to the position of the sun »), mais la prof ne dit jamais que les abeilles ont besoin du soleil pour voler. C'est un détail du mécanisme, pas le sujet. Réponse B."}}, {"n": 21, "q": "What does the direction of the straight line in the dance tell the other bees?", "options": {"A": "How far away the flowers are.", "B": "Which way to fly, compared to the sun.", "C": "How much nectar the flowers contain."}, "answer": "B", "feedback": {"A": "Mauvaise réponse. C'est le piège de la question : la distance est bien codée dans la danse, mais par la durée du frétillement (« the length of the waggle tells them how far »), pas par la direction de la ligne. La direction, elle, indique où aller par rapport au soleil. Réponse B.", "B": "Bonne réponse. « The direction of the straight line tells the other bees which way to fly, compared to the position of the sun. » Tout droit vers le haut = vers le soleil ; en biais = à cet angle du soleil.", "C": "Mauvaise réponse. La quantité de nectar n'est jamais codée dans la danse selon la prof. La ligne droite indique la direction par rapport au soleil, et la durée du frétillement indique la distance. Réponse B."}}, {"n": 22, "q": "According to the teacher, what does a longer waggle mean?", "options": {"A": "The flowers are farther away.", "B": "The flowers are closer to the hive.", "C": "There are more flowers."}, "answer": "A", "feedback": {"A": "Bonne réponse. « A longer waggle means the flowers are farther away. One second of waggling is roughly one kilometer. » Plus long = plus loin.", "B": "Mauvaise réponse. C'est l'inverse : plus le frétillement dure, plus les fleurs sont loin (« farther away »). Un frétillement court signifierait des fleurs proches. Réponse A.", "C": "Mauvaise réponse. Le nombre de fleurs n'est pas codé dans la danse d'après la prof. La durée du frétillement indique uniquement la distance : « one second of waggling is roughly one kilometer ». Réponse A."}}, {"n": 23, "q": "Why does the teacher mention Karl von Frisch?", "options": {"A": "He was the first beekeeper in Europe.", "B": "He discovered how the dance works and won a Nobel Prize.", "C": "He invented a machine that imitates the dance."}, "answer": "B", "feedback": {"A": "Mauvaise réponse. Rien n'est dit sur l'apiculture ni sur l'Europe. Karl von Frisch est cité comme le scientifique qui a compris le fonctionnement de la danse : « A scientist named Karl von Frisch figured this out, and he won a Nobel Prize for it in 1973 ». Réponse B.", "B": "Bonne réponse. « A scientist named Karl von Frisch figured this out, and he won a Nobel Prize for it in 1973. » Il est cité comme le découvreur du mécanisme.", "C": "Mauvaise réponse. Aucune machine n'est mentionnée dans l'exposé. Von Frisch a « figured this out », c'est-à-dire compris et expliqué la danse, ce qui lui a valu un prix Nobel. Réponse B."}}], "transcript": ["Okay, today I want to tell you about one of the strangest things in the animal world: how honeybees give each other directions. When a worker bee finds a good patch of flowers, she flies back to the hive, and she doesn't just drop off the nectar. She dances. Seriously. She walks in a straight line while shaking her body, then circles back and does it again. Scientists call it the waggle dance. Now, here's the amazing part. The dance is a map. The direction of the straight line tells the other bees which way to fly, compared to the position of the sun. If she walks straight up the honeycomb, that means fly toward the sun. If she walks at an angle, fly at that angle from the sun. And the length of the waggle tells them how far. A longer waggle means the flowers are farther away. One second of waggling is roughly one kilometer. The other bees crowd around her, feel the vibrations in the dark, and then they fly out, and most of them land right on those flowers. A scientist named Karl von Frisch figured this out, and he won a Nobel Prize for it in 1973. So next time you see a bee, remember: she might be on her way to give a dance lesson."]}, {"id": "P5_24-27", "part": 5, "audio": "audio/tb2/P5_expose2_Q24-27.mp3", "instruction": "You will hear a teacher talking to a class, followed by four questions. The questions and answer choices are shown on the screen while they are read. Press play when you are ready: you can listen only once.", "intro": "Listen to this passage. You will hear a social studies teacher talking. Listen carefully.", "questions": [{"n": 24, "q": "What is the talk mainly about?", "options": {"A": "The life of Johannes Gutenberg.", "B": "How the printing press changed the world.", "C": "How monks copied books by hand."}, "answer": "B", "feedback": {"A": "Mauvaise réponse. Gutenberg est cité pour son invention (« put a few existing ideas together », les caractères réutilisables), mais le prof ne raconte pas sa vie. Le sujet est annoncé dès le début : « a machine that changed the world… the printing press ». Réponse B.", "B": "Bonne réponse. Première phrase : « a machine that changed the world more than the computer did… the printing press », et conclusion sur ses effets : « who got to know things changed ».", "C": "Mauvaise réponse. La copie à la main par les moines décrit la situation d'avant 1450, pour montrer à quel point les livres étaient rares. C'est le point de départ, pas le sujet. Le sujet, c'est ce que l'imprimerie a changé. Réponse B."}}, {"n": 25, "q": "According to the teacher, what was the key to Gutenberg's invention?", "options": {"A": "Metal letters that could be taken apart and reused.", "B": "A new kind of paper that was cheaper.", "C": "A library with a few hundred books."}, "answer": "A", "feedback": {"A": "Bonne réponse. « He made small metal letters that could be arranged into a page… and then taken apart and reused for the next page. That reusable type was the key. »", "B": "Mauvaise réponse. Le papier est mentionné (« pressed onto paper »), mais le prof ne dit rien sur un papier nouveau ou moins cher. Ce qu'il désigne comme la clé, c'est le caractère réutilisable : « That reusable type was the key ». Réponse A.", "C": "Mauvaise réponse. La bibliothèque de quelques centaines de livres décrit la rareté des livres avant l'imprimerie (« A good library might have a few hundred of them »). Ce n'est pas l'invention de Gutenberg. La clé, ce sont les lettres en métal réutilisables : réponse A."}}, {"n": 26, "q": "What does the teacher say happened within fifty years of the invention?", "options": {"A": "Every person in Europe owned a Bible.", "B": "Around twenty million books had been printed.", "C": "Monks stopped living in monasteries."}, "answer": "B", "feedback": {"A": "Mauvaise réponse. Le prof ne dit jamais que chacun possédait une Bible. Il donne deux chiffres pour les cinquante premières années : des presses dans plus de deux cents villes, et environ vingt millions de livres imprimés. Réponse B.", "B": "Bonne réponse. « Within fifty years, there were presses in over two hundred European cities, and historians estimate they had printed around twenty million books. »", "C": "Mauvaise réponse. Les moines sont cités au début comme copistes, mais rien n'est dit sur leur départ des monastères. Les chiffres donnés pour les cinquante années suivantes concernent les presses et les livres imprimés. Réponse B."}}, {"n": 27, "q": "What does the teacher mean when he says the printing press changed the world?", "options": {"A": "Books became cheaper to buy.", "B": "Horses were no longer needed to carry messages.", "C": "Knowledge was no longer controlled by a few powerful groups."}, "answer": "C", "feedback": {"A": "Mauvaise réponse. Le prof écarte lui-même cette interprétation dans sa conclusion : « I don't mean books got cheaper ». Ce qu'il veut dire, c'est que les gouvernements et les églises « suddenly couldn't » contrôler ce que les gens savaient : « who got to know things changed ». Réponse C.", "B": "Mauvaise réponse. Le cheval est une image (« Ideas that used to travel at the speed of a horse ») pour dire que les idées circulaient lentement. Le prof ne parle pas de transport. Sa conclusion porte sur l'accès au savoir : « who got to know things changed ». Réponse C.", "C": "Bonne réponse. « Governments and churches, which used to control what people knew, suddenly couldn't… I mean who got to know things changed. » Le changement, c'est que le savoir a échappé aux groupes qui le contrôlaient."}}], "transcript": ["Alright, let's talk about a machine that changed the world more than the computer did, at least so far: the printing press. Before about 1450, if you wanted a book in Europe, somebody had to copy it by hand, word by word, usually a monk in a monastery. One Bible could take a single person three years. So books were incredibly rare and incredibly expensive. A good library might have a few hundred of them, and most people never touched a book in their lives. Then a German goldsmith named Johannes Gutenberg put a few existing ideas together. He made small metal letters that could be arranged into a page, inked, pressed onto paper, and then taken apart and reused for the next page. That reusable type was the key. Suddenly a workshop could print hundreds of copies of a page in a day. Within fifty years, there were presses in over two hundred European cities, and historians estimate they had printed around twenty million books. Think about what that does. Ideas that used to travel at the speed of a horse now spread everywhere at once. People started learning to read, because now there was something to read. Scientists could compare their results. And governments and churches, which used to control what people knew, suddenly couldn't. So when I say it changed the world, I don't mean books got cheaper. I mean who got to know things changed."]}], "mode": "listening"}, {"id": "tb1r", "mode": "reading", "label": "Test blanc 1 · Reading", "desc": "Compréhension écrite : 35 questions, 3 parties.", "parts": [{"part": 1, "title": "Academic vocabulary", "questions": "1-16"}, {"part": 2, "title": "Grammar and sentence structure", "questions": "17-23"}, {"part": 3, "title": "Reading comprehension", "questions": "24-35"}], "exercises": [{"id": "R1_1", "part": 1, "questions": [{"n": 1, "q": "The results of the experiment ___ our hypothesis, so we included them in the report.", "options": {"A": "ignored", "B": "confirmed", "C": "measured", "D": "invented"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. « Ignored » = ont ignoré. Des résultats ne peuvent pas ignorer une hypothèse ; ce sont des données, pas des personnes. Réponse B, « confirmed ».", "B": "Bonne réponse. « Confirmed » = ont confirmé. Les résultats ont confirmé notre hypothèse, donc on les a mis dans le rapport.", "C": "Mauvaise réponse. « Measured » = ont mesuré. On mesure une longueur ou une température, pas une hypothèse. Réponse B, « confirmed ».", "D": "Mauvaise réponse. « Invented » = ont inventé. Des résultats n'inventent pas une hypothèse ; l'hypothèse existe avant l'expérience. Ils la confirment ou la contredisent. Réponse B."}}]}, {"id": "R1_2", "part": 1, "questions": [{"n": 2, "q": "The principal ___ the new schedule to all the students in an email on Monday.", "options": {"A": "postponed", "B": "announced", "C": "compared", "D": "collected"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. « Postponed » = a reporté. On ne reporte pas un emploi du temps « aux élèves dans un mail ». Réponse B, « announced ».", "B": "Bonne réponse. « Announced » = a annoncé. Le proviseur a annoncé le nouvel emploi du temps à tous les élèves par mail.", "C": "Mauvaise réponse. « Compared » = a comparé. On compare une chose avec une autre (« compared to »), pas « aux élèves ». Réponse B, « announced ».", "D": "Mauvaise réponse. « Collected » = a collecté, ramassé. On ne ramasse pas un emploi du temps auprès des élèves ; on le leur annonce. Réponse B."}}]}, {"id": "R1_3", "part": 1, "questions": [{"n": 3, "q": "Although she was nervous, Lena gave a ___ speech in front of the whole school.", "options": {"A": "confident", "B": "careless", "C": "hesitant", "D": "lengthy"}, "answer": "A", "feedback": {"A": "Bonne réponse. « Confident » = assuré, sûr de soi. Bien qu'elle fût nerveuse, Lena a fait un discours assuré. Le piège, c'est « although » : il faut un mot qui s'oppose à « nervous ».", "B": "Mauvaise réponse. « Careless » = négligent. Ce n'est pas le contraire de « nervous » que la phrase attend. Réponse A, « confident ».", "C": "Mauvaise réponse. « Hesitant » = hésitant. Le mot « although » (bien que) annonce un contraste avec « nervous » : malgré sa nervosité, son discours était assuré. « Hesitant » irait dans le même sens que « nervous », pas en contraste. Réponse A, « confident ».", "D": "Mauvaise réponse. « Lengthy » = long. Rien dans la phrase ne parle de durée ; « although she was nervous » appelle un contraste avec la nervosité. Réponse A, « confident »."}}]}, {"id": "R1_4", "part": 1, "questions": [{"n": 4, "q": "The castle was built on a hill so that the guards could ___ enemies from far away.", "options": {"A": "spot", "B": "hide", "C": "forgive", "D": "welcome"}, "answer": "A", "feedback": {"A": "Bonne réponse. « Spot » = repérer, apercevoir. Depuis la colline, les gardes pouvaient repérer les ennemis de loin.", "B": "Mauvaise réponse. « Hide » = cacher. On ne construit pas un château sur une colline pour cacher les ennemis. Réponse A, « spot ».", "C": "Mauvaise réponse. « Forgive » = pardonner. Aucun rapport avec une colline et des gardes. Réponse A, « spot ».", "D": "Mauvaise réponse. « Welcome » = accueillir. On n'accueille pas des ennemis. La hauteur sert à les voir arriver : « spot ». Réponse A."}}]}, {"id": "R1_5", "part": 1, "questions": [{"n": 5, "q": "In geometry, the ___ of a circle is the distance around it.", "options": {"A": "radius", "B": "diameter", "C": "area", "D": "circumference"}, "answer": "D", "feedback": {"A": "Mauvaise réponse. « Radius » = le rayon : la distance du centre au bord, pas le tour du cercle. Réponse D, « circumference ».", "B": "Mauvaise réponse. « Diameter » = le diamètre : la ligne qui traverse le cercle en passant par le centre. Ce n'est pas la distance « autour ». Réponse D, « circumference ».", "C": "Mauvaise réponse. « Area » = l'aire, la surface à l'intérieur du cercle, pas la longueur de son contour. Réponse D, « circumference ».", "D": "Bonne réponse. « Circumference » = la circonférence, la longueur du tour du cercle. Les quatre mots sont du cours de maths ; il faut connaître la différence entre rayon, diamètre, aire et circonférence."}}]}, {"id": "R1_6", "part": 1, "questions": [{"n": 6, "q": "The coach's ___ for the team never changed, even after five defeats in a row.", "options": {"A": "criticism", "B": "absence", "C": "suspicion", "D": "enthusiasm"}, "answer": "D", "feedback": {"A": "Mauvaise réponse. « Criticism » = critique. Le sens de la phrase, c'est que le coach a continué à soutenir l'équipe malgré les défaites ; une critique qui ne change pas n'aurait pas ce sens positif. Réponse D, « enthusiasm ».", "B": "Mauvaise réponse. « Absence » = absence. « The coach's absence for the team » n'a pas de sens. Réponse D, « enthusiasm ».", "C": "Mauvaise réponse. « Suspicion » = méfiance, soupçon. On n'a pas de « soupçon pour une équipe ». Réponse D, « enthusiasm ».", "D": "Bonne réponse. « Enthusiasm » = enthousiasme. L'enthousiasme du coach pour l'équipe n'a jamais changé, même après cinq défaites de suite."}}]}, {"id": "R1_7", "part": 1, "questions": [{"n": 7, "q": "Historians ___ that the city was destroyed by an earthquake, but they have no proof.", "options": {"A": "deny", "B": "suspect", "C": "celebrate", "D": "refuse"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. « Deny » = nier. S'ils niaient, ils ne diraient pas que la ville a été détruite par un séisme. Et « but they have no proof » montre qu'il s'agit d'une supposition. Réponse B, « suspect ».", "B": "Bonne réponse. « Suspect » = soupçonner, supposer. Les historiens pensent que la ville a été détruite par un tremblement de terre, mais ils n'en ont pas la preuve : c'est une supposition.", "C": "Mauvaise réponse. « Celebrate » = fêter. On ne fête pas « que la ville a été détruite ». Réponse B, « suspect ».", "D": "Mauvaise réponse. « Refuse » = refuser. « Refuse that… » n'est pas une construction possible ; on refuse de faire quelque chose. Réponse B, « suspect »."}}]}, {"id": "R1_8", "part": 1, "questions": [{"n": 8, "q": "The new student adapted so ___ to American school life that she had friends within a week.", "options": {"A": "reluctantly", "B": "quickly", "C": "rarely", "D": "barely"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. « Reluctantly » = à contrecœur. Quelqu'un qui s'adapte à contrecœur ne se fait pas des amis en une semaine. Réponse B, « quickly ».", "B": "Bonne réponse. « Quickly » = rapidement. Elle s'est adaptée si vite qu'elle avait des amis au bout d'une semaine.", "C": "Mauvaise réponse. « Rarely » = rarement. On ne s'adapte pas « rarement » à une école. Réponse B, « quickly ».", "D": "Mauvaise réponse. « Barely » = à peine. Si elle s'était à peine adaptée, elle n'aurait pas eu d'amis en une semaine. Réponse B, « quickly »."}}]}, {"id": "R1_9", "part": 1, "questions": [{"n": 9, "q": "After three days of heavy rain, the river ___ its banks and flooded the town.", "options": {"A": "absorbed", "B": "shrank", "C": "froze", "D": "overflowed"}, "answer": "D", "feedback": {"A": "Mauvaise réponse. « Absorbed » = a absorbé. Une rivière n'absorbe pas ses rives. Réponse D, « overflowed ».", "B": "Mauvaise réponse. « Shrank » = a rétréci. C'est le contraire : avec la pluie, la rivière monte et déborde. Réponse D, « overflowed ».", "C": "Mauvaise réponse. « Froze » = a gelé. Après trois jours de pluie, une rivière ne gèle pas ; elle déborde. Réponse D, « overflowed ».", "D": "Bonne réponse. « Overflowed » = a débordé. La rivière a débordé de ses rives (« banks ») et a inondé la ville."}}]}, {"id": "R1_10", "part": 1, "questions": [{"n": 10, "q": "Our estimate of the cost was ___ by nearly two hundred dollars.", "options": {"A": "behind", "B": "in", "C": "off", "D": "out"}, "answer": "C", "feedback": {"A": "Mauvaise réponse. « Behind by » se dit d'un retard ou d'un score (« behind by two points »), pas d'une erreur d'estimation. Réponse C, « off by ».", "B": "Mauvaise réponse. « In by » n'existe pas dans ce sens. Réponse C, « off by ».", "C": "Bonne réponse. « To be off by X » = se tromper de X. Notre estimation était fausse de presque 200 dollars. Expression courante aux États-Unis : « the clock is off by five minutes », « the results were off by ten percent ».", "D": "Mauvaise réponse. « Out by » existe en anglais britannique, mais en anglais américain on dit « off by ». Réponse C."}}]}, {"id": "R1_11", "part": 1, "questions": [{"n": 11, "q": "Doctors recommend regular exercise to ___ the risk of heart disease.", "options": {"A": "reduce", "B": "ignore", "C": "expand", "D": "measure"}, "answer": "A", "feedback": {"A": "Bonne réponse. « Reduce » = réduire. Les médecins recommandent l'exercice pour réduire le risque de maladie cardiaque.", "B": "Mauvaise réponse. « Ignore » = ignorer. L'exercice ne sert pas à ignorer un risque mais à le diminuer. Réponse A, « reduce ».", "C": "Mauvaise réponse. « Expand » = augmenter, élargir. Les médecins ne recommandent pas d'augmenter un risque. Réponse A, « reduce ».", "D": "Mauvaise réponse. « Measure » = mesurer. L'exercice ne mesure pas un risque. Réponse A, « reduce »."}}]}, {"id": "R1_12", "part": 1, "questions": [{"n": 12, "q": "The two witnesses gave ___ accounts of the accident, so the police did not know whom to believe.", "options": {"A": "identical", "B": "detailed", "C": "written", "D": "contradictory"}, "answer": "D", "feedback": {"A": "Mauvaise réponse. « Identical » = identiques. Si les deux récits étaient identiques, la police saurait qui croire. La fin de la phrase indique le contraire. Réponse D, « contradictory ».", "B": "Mauvaise réponse. « Detailed » = détaillés. Des récits détaillés n'empêchent pas de savoir qui croire ; des récits qui se contredisent, si. Réponse D, « contradictory ».", "C": "Mauvaise réponse. « Written » = écrits. Que les récits soient écrits ou oraux ne change rien à la question de savoir qui croire. Réponse D, « contradictory ».", "D": "Bonne réponse. « Contradictory » = contradictoires. Les deux témoins ont donné des versions qui se contredisent, donc la police ne savait pas qui croire. Il faut lire la fin de la phrase pour trouver le mot."}}]}, {"id": "R1_13", "part": 1, "questions": [{"n": 13, "q": "Last year, the library ___ its collection with two hundred new books.", "options": {"A": "damaged", "B": "expanded", "C": "translated", "D": "closed"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. « Damaged » = a abîmé. On n'abîme pas une collection avec de nouveaux livres. Réponse B, « expanded ».", "B": "Bonne réponse. « Expanded » = a agrandi, élargi. La bibliothèque a élargi sa collection avec deux cents nouveaux livres.", "C": "Mauvaise réponse. « Translated » = a traduit. On ne traduit pas une collection « avec deux cents livres ». Réponse B, « expanded ».", "D": "Mauvaise réponse. « Closed » = a fermé. Ajouter des livres, ce n'est pas fermer. Réponse B, « expanded »."}}]}, {"id": "R1_14", "part": 1, "questions": [{"n": 14, "q": "The students showed great ___ by finishing the project even after the power went out.", "options": {"A": "confusion", "B": "hesitation", "C": "determination", "D": "amusement"}, "answer": "C", "feedback": {"A": "Mauvaise réponse. « Confusion » = confusion. Finir un projet malgré une panne d'électricité ne montre pas de la confusion, mais de la volonté. Réponse C, « determination ».", "B": "Mauvaise réponse. « Hesitation » = hésitation. C'est presque le contraire de ce que décrit la phrase. Réponse C, « determination ».", "C": "Bonne réponse. « Determination » = détermination. Les élèves ont montré une grande détermination en finissant le projet malgré la coupure de courant.", "D": "Mauvaise réponse. « Amusement » = amusement. Une panne de courant pendant un projet n'est pas amusante ; ce qu'ils montrent, c'est leur détermination. Réponse C."}}]}, {"id": "R1_15", "part": 1, "questions": [{"n": 15, "q": "The ___ coats were hanging by the door, still wet from the rain.", "options": {"A": "children's", "B": "childrens'", "C": "childrens", "D": "children"}, "answer": "A", "feedback": {"A": "Bonne réponse. « Children's coats » = les manteaux des enfants. « Children » est un pluriel irrégulier, le possessif prend 's comme un singulier (« men's », « women's », « people's »).", "B": "Mauvaise réponse. « Children » est déjà un pluriel irrégulier (pas de -s). Son possessif se forme donc avec 's : « children's ». « Childrens' » n'existe pas. Réponse A.", "C": "Mauvaise réponse. « Childrens » n'existe pas : le pluriel de « child » est « children », sans -s. Réponse A, « children's ».", "D": "Mauvaise réponse. « The children coats » n'est pas correct : il faut le possessif pour dire « les manteaux des enfants ». Réponse A, « children's »."}}]}, {"id": "R1_16", "part": 1, "questions": [{"n": 16, "q": "Of all the explanations we heard, hers was ___.", "options": {"A": "the most convincing", "B": "the more convincing", "C": "more convincing", "D": "most convincingly"}, "answer": "A", "feedback": {"A": "Bonne réponse. Superlatif d'un adjectif long : « the most convincing » = la plus convaincante. « Of all… » appelle toujours un superlatif.", "B": "Mauvaise réponse. « The more convincing » s'emploie seulement pour comparer deux éléments. Avec « all the explanations », c'est le superlatif « the most convincing ». Réponse A.", "C": "Mauvaise réponse. « More convincing » est un comparatif (plus convaincante que…). Ici on compare avec toutes les explications (« of all ») : il faut le superlatif « the most convincing ». Réponse A.", "D": "Mauvaise réponse. « Convincingly » est un adverbe ; après « was », il faut un adjectif. Réponse A, « the most convincing »."}}]}, {"id": "R1_17", "part": 2, "questions": [{"n": 17, "q": "___ the museum open on Sundays?", "options": {"A": "Were", "B": "Is", "C": "Do", "D": "Are"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. « Were » est au passé et au pluriel. La question est au présent (« on Sundays », une habitude) et le sujet est singulier → « Is ». Réponse B.", "B": "Bonne réponse. « The museum » est singulier et « open » est ici un adjectif (ouvert) : « Is the museum open? » = Le musée est-il ouvert ?", "C": "Mauvaise réponse. « Do » servirait avec un verbe (« Does the museum open at nine? »). Ici « open » est un adjectif (ouvert), donc on utilise le verbe être : « Is the museum open? ». Réponse B.", "D": "Mauvaise réponse. « Are » va avec un pluriel ou « you ». « The museum » est singulier → « Is ». Réponse B."}}]}, {"id": "R1_18", "part": 2, "questions": [{"n": 18, "q": "___ is the capital of Australia?", "options": {"A": "Who", "B": "How", "C": "What", "D": "When"}, "answer": "C", "feedback": {"A": "Mauvaise réponse. « Who » = qui, pour une personne. Une capitale est une ville, pas une personne → « What ». Réponse C.", "B": "Mauvaise réponse. « How » = comment. « How is the capital » demanderait comment elle va, ce qui n'a pas de sens ici. Réponse C, « What ».", "C": "Bonne réponse. « What is the capital of Australia? » = Quelle est la capitale de l'Australie ? (C'est Canberra, pas Sydney.)", "D": "Mauvaise réponse. « When » = quand. On ne demande pas un moment, on demande quelle ville est la capitale → « What ». Réponse C."}}]}, {"id": "R1_19", "part": 2, "questions": [{"n": 19, "q": "My cousin and ___ built a model volcano for the science fair.", "options": {"A": "me", "B": "mine", "C": "my", "D": "I"}, "answer": "D", "feedback": {"A": "Mauvaise réponse. « Me » est un pronom complément (« She helped my cousin and me »). Ici « my cousin and ___ » est le sujet de « built » → pronom sujet « I ». Astuce : enlève « my cousin and » : « I built », pas « me built ». Réponse D.", "B": "Mauvaise réponse. « Mine » = le mien. « My cousin and mine built… » voudrait dire « mon cousin et le mien », ce qui n'a pas de sens. Réponse D, « I ».", "C": "Mauvaise réponse. « My » est un adjectif possessif, il doit être suivi d'un nom (« my brother »). Tout seul devant un verbe, il est impossible. Réponse D, « I ».", "D": "Bonne réponse. Le groupe « My cousin and I » est le sujet du verbe « built », donc on utilise le pronom sujet « I »."}}]}, {"id": "R1_20", "part": 2, "questions": [{"n": 20, "q": "Each of the students ___ a locker in the hallway.", "options": {"A": "has", "B": "having", "C": "are having", "D": "have"}, "answer": "A", "feedback": {"A": "Bonne réponse. « Each » = chacun, toujours singulier → « has ». « Each of the students has a locker » = chaque élève a un casier.", "B": "Mauvaise réponse. « Having » tout seul n'est pas un verbe conjugué ; la phrase n'aurait pas de verbe principal. Réponse A, « has ».", "C": "Mauvaise réponse. « Are having » est au pluriel et au présent continu ; « have » au sens de posséder ne se met pas au continu, et le sujet « Each » est singulier. Réponse A, « has ».", "D": "Mauvaise réponse. Le sujet est « Each » (chacun), qui est singulier, même s'il est suivi de « of the students ». Singulier → « has ». Réponse A."}}]}, {"id": "R1_21", "part": 2, "questions": [{"n": 21, "q": "If we had left the house earlier, we ___ the bus.", "options": {"A": "were catching", "B": "had caught", "C": "would have caught", "D": "would catch"}, "answer": "C", "feedback": {"A": "Mauvaise réponse. « Were catching » (passé continu) ne marche pas avec un « if » au plus-que-parfait. Réponse C, « would have caught ».", "B": "Mauvaise réponse. « Had caught » est la forme utilisée dans la partie « if » (« If we had left »), pas dans la conséquence. La conséquence du 3e conditionnel, c'est « would have caught ». Réponse C.", "C": "Bonne réponse. 3e conditionnel : « If + had + participe passé, … would have + participe passé ». Si nous étions partis plus tôt, nous aurions eu le bus.", "D": "Mauvaise réponse. « If we had left » est un plus-que-parfait (3e conditionnel, situation passée qui ne s'est pas produite). La suite doit être « would have + participe passé » → « would have caught ». « Would catch » irait avec « If we left ». Réponse C."}}]}, {"id": "R1_22", "part": 2, "questions": [{"n": 22, "q": "The committee ___ to meet every Thursday after school.", "options": {"A": "plans", "B": "plan", "C": "planning", "D": "to plan"}, "answer": "A", "feedback": {"A": "Bonne réponse. « The committee plans to meet » = le comité prévoit de se réunir. Sujet singulier à la 3e personne → « plans ».", "B": "Mauvaise réponse. « The committee » (le comité) est un nom singulier en anglais américain → le verbe prend un -s : « plans ». Réponse A.", "C": "Mauvaise réponse. « Planning » seul n'est pas conjugué ; il faudrait « is planning ». Tel quel, la phrase n'a pas de verbe. Réponse A, « plans ».", "D": "Mauvaise réponse. « To plan » est un infinitif ; il ne peut pas être le verbe principal de la phrase. Réponse A, « plans »."}}]}, {"id": "R1_23", "part": 2, "questions": [{"n": 23, "q": "Mrs. Lee suggested ___ the essay before Friday.", "options": {"A": "finish", "B": "to finish", "C": "finishing", "D": "finished"}, "answer": "C", "feedback": {"A": "Mauvaise réponse. Après « suggest », on ne met pas la base verbale directement. « Suggest » est suivi d'un verbe en -ing : « suggested finishing ». Réponse C.", "B": "Mauvaise réponse. C'est le piège classique : « suggest » n'est jamais suivi de « to + verbe ». On dit « suggest doing something ». Réponse C, « finishing ».", "C": "Bonne réponse. « Suggest » + verbe en -ing : « Mrs. Lee suggested finishing the essay before Friday » = elle a suggéré de finir la rédaction avant vendredi. Autres verbes du même type : enjoy, miss, avoid, finish, keep, mind.", "D": "Mauvaise réponse. « Finished » est un participe passé ; « suggested finished the essay » n'est pas une construction possible. Réponse C, « finishing »."}}]}, {"id": "R1_24", "part": 3, "passage": ["The last bell had barely stopped ringing when Leo pushed open the heavy door and stepped into the afternoon heat. The air above the parking lot shimmered, and the handlebars of his bike were almost too hot to touch. He wrapped the sleeve of his sweatshirt around his hand, unlocked the chain, and pedaled toward Maple Street as fast as his tired legs would go.", "The public library closed at five on Fridays. Leo had checked twice. His history project was due Monday, and the only book that explained the construction of the Erie Canal in detail was on the second floor, behind the glass doors of the reference section, where nothing could be checked out. He would have to read it there, take notes, and leave before the lights went off.", "At the corner, he waited for the light with his shirt sticking to his back. A sprinkler on a neighbor's lawn sent a fine mist across the sidewalk, and for a second he thought about stopping to stand in it. Instead he counted the seconds until the light changed and pushed off again.", "The library's doors slid open with a sigh of cold air. Leo locked his bike, took the stairs two at a time, and found the book exactly where the online catalog had said it would be. He spread his notebook on the long wooden table, uncapped his pen, and looked up at the clock above the librarian's desk. Four twenty-two. Thirty-eight minutes.", "He wrote faster than he had ever written in class, copying dates and names, sketching the locks that lifted boats from one level of water to the next. When the librarian began switching off the lamps in the far corner, he closed the book, slipped it back onto its shelf, and let out a long breath. Outside, the heat was still waiting for him, but it didn't seem to matter anymore. He had everything he needed."], "questions": [{"n": 24, "q": "What is the main idea of this story?", "options": {"A": "A boy spends a hot afternoon riding his bike around town.", "B": "A boy learns how the locks of a canal work.", "C": "A boy forgets to do his history project.", "D": "A boy hurries to finish his research before the library closes."}, "answer": "D", "feedback": {"A": "Mauvaise réponse. Le vélo et la chaleur sont le décor, pas le sujet. Leo ne se promène pas : il fonce vers la bibliothèque parce qu'elle ferme à cinq heures et qu'il doit lire un livre qu'on ne peut pas emprunter. Réponse D.", "B": "Mauvaise réponse. Les écluses (« the locks ») sont juste un détail de ce qu'il recopie dans ses notes. L'histoire ne raconte pas comment elles fonctionnent ; elle raconte sa course pour finir avant la fermeture. Réponse D.", "C": "Mauvaise réponse. C'est l'inverse : Leo n'oublie rien, il sait que son projet est pour lundi (« due Monday ») et il fait tout pour le préparer à temps. Réponse D.", "D": "Bonne réponse. Toute l'histoire tourne autour de la course contre la montre : la bibliothèque ferme à cinq heures (« closed at five on Fridays »), le livre ne sort pas de la salle de référence, il lui reste « thirty-eight minutes ». Il se dépêche de finir ses recherches avant la fermeture."}}, {"n": 25, "q": "How does the reader know that it was very hot outside?", "options": {"A": "because the library was about to close", "B": "because Leo took the stairs two at a time", "C": "because the handlebars of his bike were almost too hot to touch", "D": "because Leo waited for the light to change"}, "answer": "C", "feedback": {"A": "Mauvaise réponse. L'heure de fermeture n'a rien à voir avec la température. La chaleur est montrée par des détails physiques : le guidon brûlant, l'air qui « shimmered », la chemise collée au dos. Réponse C.", "B": "Mauvaise réponse. Monter les escaliers deux par deux montre qu'il est pressé, pas qu'il fait chaud. Réponse C : le guidon « almost too hot to touch ».", "C": "Bonne réponse. « The handlebars of his bike were almost too hot to touch » : un guidon qu'on ne peut presque pas toucher, c'est le signe d'une forte chaleur. Le texte le confirme avec l'air qui tremble (« shimmered ») et la chemise collée (« shirt sticking to his back »).", "D": "Mauvaise réponse. Attendre le feu, tout le monde le fait, chaud ou pas. Le détail qui prouve la chaleur, c'est que le guidon est « almost too hot to touch » (presque trop chaud pour le toucher). Réponse C."}}, {"n": 26, "q": "How does Leo feel when he leaves the library?", "options": {"A": "relieved because he has what he needs", "B": "worried about the heat on the way home", "C": "disappointed that the book was missing", "D": "angry at the librarian for closing early"}, "answer": "A", "feedback": {"A": "Bonne réponse. « He let out a long breath » (il souffle), la chaleur « didn't seem to matter anymore », et la dernière phrase : « He had everything he needed ». Il est soulagé : il a ce qu'il lui faut.", "B": "Mauvaise réponse. Le texte dit le contraire : la chaleur l'attend dehors « but it didn't seem to matter anymore » (ça n'avait plus d'importance). Réponse A.", "C": "Mauvaise réponse. Le livre n'était pas manquant : il l'a trouvé « exactly where the online catalog had said it would be ». Réponse A, il est soulagé.", "D": "Mauvaise réponse. La bibliothécaire ne ferme pas en avance : elle éteint les lampes à l'heure prévue, et rien n'indique de la colère chez Leo. Réponse A."}}, {"n": 27, "q": "Why does the author mention the clock above the librarian's desk?", "options": {"A": "to tell readers that Leo liked the library", "B": "to explain why Leo was tired", "C": "to show that the library was very old", "D": "to show how little time Leo had left"}, "answer": "D", "feedback": {"A": "Mauvaise réponse. Le texte ne dit pas ce que Leo pense de la bibliothèque. L'horloge est là pour compter le temps qu'il lui reste. Réponse D.", "B": "Mauvaise réponse. Sa fatigue vient du vélo sous la chaleur, pas de l'horloge. L'horloge montre le temps qui reste avant la fermeture. Réponse D.", "C": "Mauvaise réponse. Rien n'est dit sur l'âge de l'horloge ou de la bibliothèque. L'horloge sert à donner l'heure : « Four twenty-two. Thirty-eight minutes. » Réponse D.", "D": "Bonne réponse. Juste après l'horloge, l'auteur écrit « Four twenty-two. Thirty-eight minutes. » : il reste 38 minutes avant cinq heures. L'horloge sert à faire sentir l'urgence."}}]}, {"id": "R1_28", "part": 3, "passage": ["Every athlete, every musician, and every scientist has one thing in common: they have all failed. A basketball player misses more shots than she makes. A pianist plays a wrong note in front of a crowd. A chemist watches an experiment produce nothing at all. For most people, these moments feel like the end of something. In fact, they are usually the beginning.", "Consider a student who gets a low grade on a math test. One choice is to hide the test in a backpack and hope the next unit is easier. Another choice is to look at every mistake, one by one, and ask, \"What did I not understand?\" The second student is doing something that researchers call <u>productive<\/u> failure. The error becomes a map that shows exactly where to go next.", "Denise Walker, who coached young swimmers for thirty years, kept a sign above the pool that said:", {"quote": ["A missed turn", "is a lesson with a stopwatch.", "A perfect race", "teaches nothing new."]}, "Her swimmers did not like the sign at first. Nobody enjoys missing a turn. But over time, they understood what she meant. A race that goes perfectly is pleasant, but it does not reveal anything. A race with a mistake shows the swimmer precisely what to practice tomorrow. The athletes who improved the most were not the ones who never made mistakes. They were the ones who examined their mistakes most carefully."], "questions": [{"n": 28, "q": "What is the main purpose of the passage?", "options": {"A": "to describe the career of a swimming coach", "B": "to explain why mistakes can help people improve", "C": "to encourage students to study harder for math tests", "D": "to compare athletes and musicians"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. La coach n'apparaît qu'au troisième paragraphe, comme exemple. Le texte parle des erreurs en général : athlètes, musiciens, scientifiques, élèves. Réponse B.", "B": "Bonne réponse. Dès le premier paragraphe : les échecs « are usually the beginning ». Puis l'erreur devient « a map that shows exactly where to go next », et la conclusion : ceux qui progressent le plus sont ceux qui examinent leurs erreurs. Le but est d'expliquer pourquoi les erreurs font progresser.", "C": "Mauvaise réponse. Le test de maths n'est qu'un exemple au deuxième paragraphe. Le message n'est pas « travaille plus », c'est « regarde tes erreurs ». Réponse B.", "D": "Mauvaise réponse. Athlètes et musiciens sont cités ensemble au début, mais pour montrer qu'ils ont un point commun (ils échouent tous), pas pour les comparer. Réponse B."}}, {"n": 29, "q": "In this passage, what does a map symbolize?", "options": {"A": "a plan for a long trip", "B": "a guide that shows what to work on next", "C": "a way to hide a bad grade", "D": "a reward for hard work"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. Il n'y a aucun voyage dans le texte. « Map » est une image : la carte, c'est l'erreur qui montre « where to go next », quoi travailler. Réponse B.", "B": "Bonne réponse. « The error becomes a map that shows exactly where to go next » : l'erreur devient une carte qui indique exactement où aller ensuite, c'est-à-dire quoi travailler.", "C": "Mauvaise réponse. Cacher le test dans le sac, c'est le premier choix, le mauvais. La carte représente le second choix : examiner les erreurs pour savoir où aller. Réponse B.", "D": "Mauvaise réponse. Une carte ne récompense rien ; elle guide. L'erreur « shows exactly where to go next ». Réponse B."}}, {"n": 30, "q": "In the second paragraph, what does the underlined word <u>productive<\/u> mean?", "options": {"A": "useful", "B": "painful", "C": "expensive", "D": "rare"}, "answer": "A", "feedback": {"A": "Bonne réponse. « Productive » = productif, utile, qui produit quelque chose. Un échec productif, c'est un échec dont on tire quelque chose : la carte de ce qu'il faut travailler.", "B": "Mauvaise réponse. « Painful » = douloureux. Un échec peut être douloureux, mais « productive failure » insiste sur ce que l'échec apporte (« where to go next »), pas sur la douleur. Réponse A, « useful ».", "C": "Mauvaise réponse. « Expensive » = cher. Rien à voir avec l'argent. « Productive » signifie « qui produit un résultat utile ». Réponse A.", "D": "Mauvaise réponse. « Rare » = rare. Le texte dit au contraire que tout le monde échoue (« they have all failed »). « Productive » = utile. Réponse A."}}, {"n": 31, "q": "The author uses Coach Walker's sign to help explain what happens if ___.", "options": {"A": "a swimmer trains for thirty years", "B": "a student hides a test", "C": "a race goes perfectly", "D": "a swimmer stops practicing"}, "answer": "C", "feedback": {"A": "Mauvaise réponse. Les trente ans, c'est la carrière de la coach, pas le sujet du panneau. Le panneau dit qu'une course parfaite « teaches nothing new ». Réponse C.", "B": "Mauvaise réponse. L'élève qui cache son test est dans le deuxième paragraphe, avant le panneau. Le panneau parle de natation : course ratée contre course parfaite. Réponse C.", "C": "Bonne réponse. Le panneau dit : « A perfect race teaches nothing new », et le dernier paragraphe l'explique : « A race that goes perfectly is pleasant, but it does not reveal anything ». Le panneau sert à expliquer ce qui arrive quand une course se passe parfaitement : on n'apprend rien.", "D": "Mauvaise réponse. Le panneau ne parle pas d'arrêter de s'entraîner, mais de ce qu'on apprend d'une course ratée par rapport à une course parfaite. Réponse C."}}]}, {"id": "R1_32", "part": 3, "passage": ["Today, museums around the world display the skeletons of creatures that lived millions of years ago. Many people do not know that some of the most important early discoveries were made by a young woman with no formal education. Mary Anning was born in 1799 in Lyme Regis, a small town on the southern coast of England. Her father was a cabinetmaker who collected fossils from the cliffs along the beach and sold them to tourists. When he died in 1810, the family was left with very little money, and Mary and her brother Joseph continued to search the cliffs to help their mother pay the bills.", "In 1811, Joseph found the skull of a strange animal in the rocks. Over the following months, Mary, who was only twelve, carefully dug out the rest of the skeleton. It was an ichthyosaur, a sea reptile that scientists had never seen before. Over the next twenty years, Mary found the first complete plesiosaur, another sea reptile with a very long neck, and the first flying reptile ever discovered in England. Fossil hunting was dangerous work. The cliffs were unstable, especially in winter, when storms washed away the rock and uncovered new fossils. In 1833, a landslide nearly killed her and did kill her dog, who went everywhere with her. Still, she returned to the beach the next day.", "Although scientists from across Europe bought her fossils and visited her shop, Mary <u>received little credit<\/u>. At that time, the Geological Society of London did not admit women, and many articles described her discoveries without mentioning her name. She taught herself anatomy and geology by reading scientific papers and copying them by hand. Today, her fossils are still displayed in the Natural History Museum in London, and scientists recognize her as one of the founders of modern paleontology."], "questions": [{"n": 32, "q": "What is this text mainly about?", "options": {"A": "the history of museums in London", "B": "the life of sea reptiles", "C": "a self-taught fossil hunter", "D": "the dangers of the English coast"}, "answer": "C", "feedback": {"A": "Mauvaise réponse. Les musées sont mentionnés au début et à la fin, mais le texte ne raconte pas leur histoire. Il raconte celle de Mary Anning. Réponse C.", "B": "Mauvaise réponse. Les reptiles marins sont ce qu'elle a trouvé, pas le sujet du texte. On ne décrit pas leur vie, on décrit la sienne. Réponse C.", "C": "Bonne réponse. Le texte raconte la vie de Mary Anning : « a young woman with no formal education », ses découvertes (ichtyosaure, plésiosaure, reptile volant), le fait qu'elle « taught herself anatomy and geology », et le manque de reconnaissance. C'est le portrait d'une chasseuse de fossiles autodidacte.", "D": "Mauvaise réponse. Les dangers des falaises (« unstable », « landslide ») ne sont qu'un passage du texte. Le sujet, c'est la personne : Mary Anning, ses découvertes et ses obstacles. Réponse C."}}, {"n": 33, "q": "Why did Mary and her brother search the cliffs after their father died?", "options": {"A": "Their mother wanted them to become scientists.", "B": "The family needed money.", "C": "The Geological Society asked them to.", "D": "They wanted to find their father's lost tools."}, "answer": "B", "feedback": {"A": "Mauvaise réponse. Le texte ne dit rien d'un souhait de la mère. Il dit : « the family was left with very little money… to help their mother pay the bills ». Réponse B.", "B": "Bonne réponse. « When he died in 1810, the family was left with very little money, and Mary and her brother Joseph continued to search the cliffs to help their mother pay the bills. » Ils cherchaient des fossiles pour les vendre et aider leur mère.", "C": "Mauvaise réponse. La Geological Society apparaît seulement à la fin, et pour dire qu'elle « did not admit women ». Elle n'a rien demandé. Réponse B.", "D": "Mauvaise réponse. Aucun outil perdu dans le texte. Ils cherchaient des fossiles pour l'argent : « to help their mother pay the bills ». Réponse B."}}, {"n": 34, "q": "In paragraph 3, what does the underlined phrase <u>received little credit<\/u> mean?", "options": {"A": "earned very little money", "B": "had few customers in her shop", "C": "could not borrow money from the bank", "D": "was rarely given recognition for her work"}, "answer": "D", "feedback": {"A": "Mauvaise réponse. « Credit » ici ne parle pas d'argent : la phrase suivante explique que les articles décrivaient ses découvertes « without mentioning her name ». Il s'agit de reconnaissance. Réponse D.", "B": "Mauvaise réponse. Au contraire, « scientists from across Europe bought her fossils and visited her shop » : elle avait des clients. Ce qui manquait, c'était la reconnaissance. Réponse D.", "C": "Mauvaise réponse. « Credit » peut vouloir dire crédit bancaire, mais pas ici : la suite parle de la Geological Society et d'articles qui ne mentionnent pas son nom. Réponse D, le manque de reconnaissance.", "D": "Bonne réponse. « To receive credit » = être reconnu, recevoir le mérite. Le contexte le confirme : la société savante n'acceptait pas les femmes et les articles ne citaient pas son nom. Elle recevait peu de reconnaissance."}}, {"n": 35, "q": "According to the text, what challenge did Mary face as a scientist?", "options": {"A": "She was not allowed to sell her fossils.", "B": "She could not read scientific papers.", "C": "Women were not admitted to the scientific society.", "D": "The museum refused to display her discoveries."}, "answer": "C", "feedback": {"A": "Mauvaise réponse. Elle vendait bien ses fossiles : « scientists from across Europe bought her fossils ». Réponse C.", "B": "Mauvaise réponse. Le texte dit le contraire : « She taught herself anatomy and geology by reading scientific papers and copying them by hand ». Réponse C.", "C": "Bonne réponse. « At that time, the Geological Society of London did not admit women » : la société scientifique n'acceptait pas les femmes, et les articles ne citaient pas son nom.", "D": "Mauvaise réponse. C'est l'inverse : « her fossils are still displayed in the Natural History Museum in London ». Réponse C."}}]}]}, {"id": "tb2r", "mode": "reading", "label": "Test blanc 2 · Reading", "desc": "Compréhension écrite : 35 questions, 3 parties.", "parts": [{"part": 1, "title": "Academic vocabulary", "questions": "1-16"}, {"part": 2, "title": "Grammar and sentence structure", "questions": "17-23"}, {"part": 3, "title": "Reading comprehension", "questions": "24-35"}], "exercises": [{"id": "R2_1", "part": 1, "questions": [{"n": 1, "q": "The teacher asked us to ___ the main causes of the war in a single paragraph.", "options": {"A": "postpone", "B": "avoid", "C": "describe", "D": "decorate"}, "answer": "C", "feedback": {"A": "Mauvaise réponse. « Postpone » = reporter. On reporte un rendez-vous, pas les causes d'une guerre. Réponse C, « describe ».", "B": "Mauvaise réponse. « Avoid » = éviter. Un prof ne demande pas d'éviter les causes d'une guerre dans un paragraphe. Réponse C, « describe ».", "C": "Bonne réponse. « Describe » = décrire. Décrire les principales causes de la guerre en un seul paragraphe : consigne classique en cours d'histoire.", "D": "Mauvaise réponse. « Decorate » = décorer. Aucun sens ici. Réponse C, « describe »."}}]}, {"id": "R2_2", "part": 1, "questions": [{"n": 2, "q": "Because the weather was so ___, the picnic was moved indoors at the last minute.", "options": {"A": "pleasant", "B": "mild", "C": "sunny", "D": "unpredictable"}, "answer": "D", "feedback": {"A": "Mauvaise réponse. « Pleasant » = agréable. Si le temps était agréable, on n'aurait pas déplacé le pique-nique à l'intérieur. Réponse D, « unpredictable ».", "B": "Mauvaise réponse. « Mild » = doux. Un temps doux n'oblige pas à rentrer. Réponse D, « unpredictable ».", "C": "Mauvaise réponse. « Sunny » = ensoleillé. Avec du soleil, le pique-nique serait resté dehors. Réponse D, « unpredictable ».", "D": "Bonne réponse. « Unpredictable » = imprévisible. Le temps était si imprévisible qu'on a déplacé le pique-nique à l'intérieur au dernier moment. Les trois autres adjectifs décrivent du beau temps, ce qui contredit la fin de la phrase."}}]}, {"id": "R2_3", "part": 1, "questions": [{"n": 3, "q": "The two sides ___ over the final decision for hours before reaching an agreement.", "options": {"A": "agreed", "B": "celebrated", "C": "argued", "D": "departed"}, "answer": "C", "feedback": {"A": "Mauvaise réponse. « Agreed » = étaient d'accord. S'ils étaient d'accord, ils n'auraient pas mis des heures à trouver un accord. Réponse C, « argued ».", "B": "Mauvaise réponse. « Celebrated » = ont fêté. On ne fête pas une décision « pendant des heures avant de trouver un accord ». Réponse C, « argued ».", "C": "Bonne réponse. « Argued » = se sont disputés, ont débattu. Les deux camps ont débattu pendant des heures avant de parvenir à un accord.", "D": "Mauvaise réponse. « Departed » = sont partis. « Departed over the decision » n'a pas de sens. Réponse C, « argued »."}}]}, {"id": "R2_4", "part": 1, "questions": [{"n": 4, "q": "The ancient ruins were ___ by a team of archaeologists in 1920.", "options": {"A": "defended", "B": "discovered", "C": "designed", "D": "delivered"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. « Defended » = défendues. Des archéologues ne défendent pas des ruines, ils les découvrent et les étudient. Réponse B, « discovered ».", "B": "Bonne réponse. « Discovered » = découvertes. Les ruines antiques ont été découvertes par une équipe d'archéologues en 1920.", "C": "Mauvaise réponse. « Designed » = conçues. Des ruines antiques n'ont pas été conçues en 1920. Réponse B, « discovered ».", "D": "Mauvaise réponse. « Delivered » = livrées. On ne livre pas des ruines. Réponse B, « discovered »."}}]}, {"id": "R2_5", "part": 1, "questions": [{"n": 5, "q": "In economics, ___ is a general rise in prices over a period of time.", "options": {"A": "budget", "B": "inflation", "C": "profit", "D": "currency"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. « Budget » = budget : ce qu'on prévoit de dépenser. Ce n'est pas une hausse des prix. Réponse B, « inflation ».", "B": "Bonne réponse. « Inflation » = l'inflation, la hausse générale des prix sur une période. Vocabulaire du cours d'économie.", "C": "Mauvaise réponse. « Profit » = bénéfice. Ce n'est pas une hausse générale des prix. Réponse B, « inflation ».", "D": "Mauvaise réponse. « Currency » = monnaie (le dollar, l'euro). La monnaie n'est pas une hausse des prix. Réponse B, « inflation »."}}]}, {"id": "R2_6", "part": 1, "questions": [{"n": 6, "q": "Thanks to the ___ of local volunteers, the animal shelter stayed open all winter.", "options": {"A": "curiosity", "B": "absence", "C": "generosity", "D": "laziness"}, "answer": "C", "feedback": {"A": "Mauvaise réponse. « Curiosity » = curiosité. Ce n'est pas la curiosité des bénévoles qui fait vivre un refuge. Réponse C, « generosity ».", "B": "Mauvaise réponse. « Absence » = absence. On ne remercie pas (« thanks to ») l'absence des bénévoles. Réponse C, « generosity ».", "C": "Bonne réponse. « Generosity » = générosité. Grâce à la générosité des bénévoles, le refuge est resté ouvert tout l'hiver.", "D": "Mauvaise réponse. « Laziness » = paresse. C'est le contraire de ce qui permet à un refuge de rester ouvert. Réponse C, « generosity »."}}]}, {"id": "R2_7", "part": 1, "questions": [{"n": 7, "q": "The journalist ___ the mayor about the missing money, but he refused to answer.", "options": {"A": "thanked", "B": "congratulated", "C": "questioned", "D": "described"}, "answer": "C", "feedback": {"A": "Mauvaise réponse. « Thanked » = a remercié. On ne remercie pas quelqu'un « à propos d'argent disparu », et il n'y aurait rien à « répondre ». Réponse C, « questioned ».", "B": "Mauvaise réponse. « Congratulated » = a félicité. On ne félicite pas un maire pour de l'argent disparu. Réponse C, « questioned ».", "C": "Bonne réponse. « Questioned » = a interrogé. Le journaliste a interrogé le maire sur l'argent disparu, mais celui-ci a refusé de répondre. La fin de la phrase (« refused to answer ») donne l'indice.", "D": "Mauvaise réponse. « Described » = a décrit. On ne décrit pas une personne « à propos de » quelque chose. Réponse C, « questioned »."}}]}, {"id": "R2_8", "part": 1, "questions": [{"n": 8, "q": "The instructions were written so ___ that even the youngest students could follow them.", "options": {"A": "rarely", "B": "secretly", "C": "loudly", "D": "clearly"}, "answer": "D", "feedback": {"A": "Mauvaise réponse. « Rarely » = rarement. Des consignes ne sont pas écrites « rarement ». Réponse D, « clearly ».", "B": "Mauvaise réponse. « Secretly » = en secret. Des consignes secrètes ne seraient pas suivies par les élèves. Réponse D, « clearly ».", "C": "Mauvaise réponse. « Loudly » = fort, bruyamment. On ne peut pas écrire « fort ». Réponse D, « clearly ».", "D": "Bonne réponse. « Clearly » = clairement. Les consignes étaient écrites si clairement que même les plus jeunes pouvaient les suivre."}}]}, {"id": "R2_9", "part": 1, "questions": [{"n": 9, "q": "The trail ___ through the forest for two miles and ends at the lake.", "options": {"A": "floats", "B": "sinks", "C": "winds", "D": "melts"}, "answer": "C", "feedback": {"A": "Mauvaise réponse. « Floats » = flotte. Un sentier ne flotte pas. Réponse C, « winds ».", "B": "Mauvaise réponse. « Sinks » = coule, s'enfonce. Un sentier ne coule pas à travers une forêt. Réponse C, « winds ».", "C": "Bonne réponse. « Winds » (prononcé « waïndz ») = serpente, fait des détours. Le sentier serpente à travers la forêt sur deux miles et finit au lac. Attention : ce n'est pas « wind » (le vent), c'est le verbe « to wind ».", "D": "Mauvaise réponse. « Melts » = fond. Aucun sens pour un sentier. Réponse C, « winds »."}}]}, {"id": "R2_10", "part": 1, "questions": [{"n": 10, "q": "We ran ___ time before we could finish the last question.", "options": {"A": "off", "B": "behind", "C": "over", "D": "out of"}, "answer": "D", "feedback": {"A": "Mauvaise réponse. « Run off » = s'enfuir, ou faire couler. « Ran off time » n'existe pas. Réponse D, « ran out of time ».", "B": "Mauvaise réponse. « Behind time » n'est pas une expression courante en américain ; on dit « behind schedule ». Ici, c'est « ran out of time ». Réponse D.", "C": "Mauvaise réponse. « Run over » = écraser (avec une voiture) ou dépasser (une durée). « Ran over time » voudrait dire « a dépassé le temps », mais la suite (« before we could finish ») indique qu'on a manqué de temps. Réponse D.", "D": "Bonne réponse. « To run out of time » = ne plus avoir de temps. Nous avons manqué de temps avant de pouvoir finir la dernière question. Même construction que « run out of money », « run out of ideas »."}}]}, {"id": "R2_11", "part": 1, "questions": [{"n": 11, "q": "The lawyer presented strong ___ that her client was innocent.", "options": {"A": "evidence", "B": "opinions", "C": "rumors", "D": "traditions"}, "answer": "A", "feedback": {"A": "Bonne réponse. « Evidence » = preuves (mot toujours au singulier en anglais). L'avocate a présenté des preuves solides de l'innocence de sa cliente.", "B": "Mauvaise réponse. « Opinions » = opinions. Devant un tribunal, un avocat présente des preuves, pas des opinions. Réponse A, « evidence ».", "C": "Mauvaise réponse. « Rumors » = rumeurs. Des rumeurs ne prouvent rien ; on ne les qualifie pas de « strong ». Réponse A, « evidence ».", "D": "Mauvaise réponse. « Traditions » = traditions. Aucun rapport avec un procès. Réponse A, « evidence »."}}]}, {"id": "R2_12", "part": 1, "questions": [{"n": 12, "q": "The ___ villages in the mountains have no roads and receive mail only once a week.", "options": {"A": "crowded", "B": "isolated", "C": "modern", "D": "coastal"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. « Crowded » = bondé, plein de monde. Des villages sans routes ne sont pas bondés. Réponse B, « isolated ».", "B": "Bonne réponse. « Isolated » = isolé. Les villages isolés de la montagne n'ont pas de routes et reçoivent le courrier une fois par semaine. Les détails (pas de routes, courrier rare) décrivent l'isolement.", "C": "Mauvaise réponse. « Modern » = moderne. Un village moderne a des routes. Réponse B, « isolated ».", "D": "Mauvaise réponse. « Coastal » = côtier, au bord de la mer. Or les villages sont dans la montagne. Réponse B, « isolated »."}}]}, {"id": "R2_13", "part": 1, "questions": [{"n": 13, "q": "Last spring, the government ___ a new law to protect the forests.", "options": {"A": "passed", "B": "obeyed", "C": "broke", "D": "forgot"}, "answer": "A", "feedback": {"A": "Bonne réponse. « Passed a law » = a adopté, a voté une loi. Expression à connaître : on dit « pass a law », pas « vote a law ».", "B": "Mauvaise réponse. « Obeyed » = a obéi à. Un gouvernement ne « obéit » pas à une nouvelle loi ; il la vote. Réponse A, « passed ».", "C": "Mauvaise réponse. « Broke » = a enfreint. On enfreint une loi existante ; ici il s'agit d'une « new law » pour protéger les forêts. Réponse A, « passed ».", "D": "Mauvaise réponse. « Forgot » = a oublié. Oublier une loi ne protège pas les forêts. Réponse A, « passed »."}}]}, {"id": "R2_14", "part": 1, "questions": [{"n": 14, "q": "Students who read a lot usually have a larger ___ than those who do not.", "options": {"A": "schedule", "B": "vocabulary", "C": "classroom", "D": "appetite"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. « Schedule » = emploi du temps. Lire beaucoup ne donne pas un plus grand emploi du temps. Réponse B, « vocabulary ».", "B": "Bonne réponse. « Vocabulary » = vocabulaire. Les élèves qui lisent beaucoup ont généralement un vocabulaire plus riche.", "C": "Mauvaise réponse. « Classroom » = salle de classe. Lire n'agrandit pas la salle de classe. Réponse B, « vocabulary ».", "D": "Mauvaise réponse. « Appetite » = appétit. Aucun rapport avec la lecture. Réponse B, « vocabulary »."}}]}, {"id": "R2_15", "part": 1, "questions": [{"n": 15, "q": "The two ___ bicycles were left outside in the rain all night.", "options": {"A": "boy's", "B": "boys'", "C": "boys", "D": "boys's"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. « Boy's » est le possessif d'un seul garçon. Ici il y en a deux (« the two ») → « boys' ». Réponse B.", "B": "Bonne réponse. « The two boys' bicycles » = les vélos des deux garçons. Possessif d'un pluriel régulier : apostrophe après le -s.", "C": "Mauvaise réponse. « The two boys bicycles » n'est pas correct : il manque le possessif pour dire « les vélos des garçons ». Réponse B, « boys' ».", "D": "Mauvaise réponse. « Boys's » n'existe pas : pour un pluriel en -s, on ajoute seulement l'apostrophe. Réponse B, « boys' »."}}]}, {"id": "R2_16", "part": 1, "questions": [{"n": 16, "q": "Her second essay was ___ than her first.", "options": {"A": "more good", "B": "more better", "C": "the best", "D": "far better"}, "answer": "D", "feedback": {"A": "Mauvaise réponse. « More good » n'existe pas : le comparatif de « good » est irrégulier, c'est « better ». Réponse D, « far better ».", "B": "Mauvaise réponse. « More better » est un double comparatif : « better » veut déjà dire « plus bon ». Réponse D, « far better ».", "C": "Mauvaise réponse. « The best » est un superlatif, incompatible avec « than ». Réponse D, « far better ».", "D": "Bonne réponse. « Better » est le comparatif irrégulier de « good » ; « far better than » = bien meilleur que."}}]}, {"id": "R2_17", "part": 2, "questions": [{"n": 17, "q": "___ you ever been to Chicago?", "options": {"A": "Have", "B": "Did", "C": "Has", "D": "Do"}, "answer": "A", "feedback": {"A": "Bonne réponse. « Have you ever been to…? » = Es-tu déjà allé à… ? Present perfect : have + participe passé (« been »). Avec « ever », c'est la question classique sur l'expérience.", "B": "Mauvaise réponse. « Did you ever been » est impossible : « been » est un participe passé, il demande « have ». Réponse A, « Have you ever been ».", "C": "Mauvaise réponse. « Has » va avec he / she / it. Avec « you », c'est « have ». Réponse A.", "D": "Mauvaise réponse. « Do you ever been » n'existe pas : « been » exige l'auxiliaire « have ». Réponse A, « Have »."}}]}, {"id": "R2_18", "part": 2, "questions": [{"n": 18, "q": "___ long does the flight from New York to Boston take?", "options": {"A": "Why", "B": "What", "C": "How", "D": "When"}, "answer": "C", "feedback": {"A": "Mauvaise réponse. « Why long » n'a pas de sens. « How long does it take? » = combien de temps ça prend ? Réponse C.", "B": "Mauvaise réponse. « What long » n'existe pas. Pour demander une durée, on dit « How long » (combien de temps). Réponse C.", "C": "Bonne réponse. « How long does the flight take? » = Combien de temps dure le vol ? « How » + adjectif (long, far, often, much) sert à poser une question de quantité ou de durée.", "D": "Mauvaise réponse. « When » = quand, mais « when long » n'existe pas. Réponse C, « How long »."}}]}, {"id": "R2_19", "part": 2, "questions": [{"n": 19, "q": "The teacher gave Sam and ___ extra time to finish the test.", "options": {"A": "I", "B": "my", "C": "mine", "D": "me"}, "answer": "D", "feedback": {"A": "Mauvaise réponse. Ici « Sam and ___ » est le complément de « gave » (à qui le prof a donné du temps), pas le sujet. Complément → « me ». Astuce : enlève « Sam and » : « The teacher gave me extra time », pas « gave I ». Réponse D.", "B": "Mauvaise réponse. « My » est un possessif, il doit être suivi d'un nom (« my sister »). Réponse D, « me ».", "C": "Mauvaise réponse. « Mine » = le mien. « Gave Sam and mine extra time » n'a pas de sens. Réponse D, « me ».", "D": "Bonne réponse. « Sam and me » est complément du verbe « gave » → pronom complément « me »."}}]}, {"id": "R2_20", "part": 2, "questions": [{"n": 20, "q": "Neither of the two answers ___ correct.", "options": {"A": "is", "B": "be", "C": "are", "D": "being"}, "answer": "A", "feedback": {"A": "Bonne réponse. « Neither of the two answers is correct » = aucune des deux réponses n'est correcte. « Neither », comme « each » et « none », se conjugue au singulier.", "B": "Mauvaise réponse. « Be » est la base verbale, pas une forme conjuguée. Il faut « is ». Réponse A.", "C": "Mauvaise réponse. « Neither » (aucun des deux) est singulier, même suivi de « of the two answers ». Singulier → « is ». Réponse A.", "D": "Mauvaise réponse. « Being » tout seul ne peut pas être le verbe principal de la phrase. Réponse A, « is »."}}]}, {"id": "R2_21", "part": 2, "questions": [{"n": 21, "q": "If Maria had studied harder, she ___ the exam.", "options": {"A": "would have passed", "B": "would pass", "C": "had passed", "D": "passes"}, "answer": "A", "feedback": {"A": "Bonne réponse. 3e conditionnel : « If + had + participe passé, … would have + participe passé ». Si Maria avait travaillé plus, elle aurait réussi l'examen.", "B": "Mauvaise réponse. « Would pass » irait avec « If Maria studied harder » (situation imaginaire au présent). Ici « had studied » est au plus-que-parfait, donc il faut « would have passed ». Réponse A.", "C": "Mauvaise réponse. « Had passed » est la forme de la partie « if », pas de la conséquence. Réponse A, « would have passed ».", "D": "Mauvaise réponse. « Passes » est un présent simple ; il ne va pas avec « If she had studied ». Réponse A, « would have passed »."}}]}, {"id": "R2_22", "part": 2, "questions": [{"n": 22, "q": "The news ___ at six o'clock every evening.", "options": {"A": "start", "B": "starting", "C": "are starting", "D": "starts"}, "answer": "D", "feedback": {"A": "Mauvaise réponse. « The news » (les informations) est un nom singulier en anglais, malgré le -s. Donc le verbe prend un -s : « starts ». Réponse D.", "B": "Mauvaise réponse. « Starting » seul n'est pas conjugué ; la phrase n'aurait pas de verbe. Réponse D, « starts ».", "C": "Mauvaise réponse. « Are starting » est au pluriel et au présent continu. « The news » est singulier et « every evening » indique une habitude → présent simple « starts ». Réponse D.", "D": "Bonne réponse. « The news starts at six » = les infos commencent à six heures. « News » est singulier (comme « mathematics », « physics ») et « every evening » appelle le présent simple."}}]}, {"id": "R2_23", "part": 2, "questions": [{"n": 23, "q": "Tom enjoys ___ basketball with his cousins after school.", "options": {"A": "play", "B": "played", "C": "to play", "D": "playing"}, "answer": "D", "feedback": {"A": "Mauvaise réponse. Après « enjoy », on ne met pas la base verbale. « Enjoy » est suivi d'un verbe en -ing : « enjoys playing ». Réponse D.", "B": "Mauvaise réponse. « Enjoys played » n'est pas une construction possible. Réponse D, « playing ».", "C": "Mauvaise réponse. « Enjoy » n'est jamais suivi de « to + verbe ». On dit « enjoy doing something ». Réponse D, « playing ».", "D": "Bonne réponse. « Enjoy » + verbe en -ing : « Tom enjoys playing basketball » = Tom aime jouer au basket. Autres verbes du même type : miss, suggest, avoid, finish, keep, mind."}}]}, {"id": "R2_24", "part": 3, "passage": ["Daniel's alarm went off at five-thirty, a full hour before it usually did. For a moment he lay still, listening. The house was silent, and the streetlight outside his window threw a pale glow across the ceiling. Then he remembered: the snow.", "He pulled on two pairs of socks, his heaviest sweater, and the coat with the broken zipper that he had to hold closed with one hand. Downstairs, his grandmother had already left a note on the counter: \"Shovel first, then breakfast. Gloves are on the radiator.\" The gloves were warm when he put them on, but by the time he opened the front door, the warmth was gone. His breath hung in the air in front of him. The snow had stopped falling, but it lay in a thick, smooth blanket over the steps, the walkway, and the sidewalk beyond, untouched except for a single line of cat prints.", "The shovel scraped against the concrete with a sound that seemed too loud for such a quiet street. Daniel worked in a rhythm: push, lift, throw. After ten minutes his arms ached and his nose had gone numb, but the walkway was clear. He moved on to the sidewalk, counting the squares of concrete as he uncovered them. Across the street, the porch light at Mr. Alvarez's house flicked on, and Daniel saw the old man's face at the window. Mr. Alvarez raised his coffee cup. Daniel raised his shovel.", "When the last square was clear, he leaned on the handle and looked back at his work. The path was straight and clean. The school bus would be able to stop at the corner, and his grandmother would not have to walk through the drifts to reach the mailbox. He stamped the snow off his boots, pushed open the door, and smelled pancakes. His fingers were stiff and his cheeks burned, but he found that he was smiling."], "questions": [{"n": 24, "q": "What is the main idea of this story?", "options": {"A": "A boy wakes up early to clear the snow for his family.", "B": "A boy misses the school bus because of a snowstorm.", "C": "A boy helps his neighbor make breakfast.", "D": "A boy loses his gloves in the snow."}, "answer": "A", "feedback": {"A": "Bonne réponse. Toute l'histoire suit Daniel qui se lève une heure plus tôt (« a full hour before it usually did ») pour déneiger les marches, l'allée et le trottoir, pour que le bus puisse s'arrêter et que sa grand-mère n'ait pas à marcher dans la neige.", "B": "Mauvaise réponse. Il ne rate rien : il déneige justement pour que « the school bus would be able to stop at the corner ». Réponse A.", "C": "Mauvaise réponse. Le voisin, Mr. Alvarez, lève seulement sa tasse de café depuis sa fenêtre. Et le petit-déjeuner (les pancakes) est préparé par la grand-mère. Réponse A.", "D": "Mauvaise réponse. Les gants sont sur le radiateur et il les met ; il ne les perd jamais. Réponse A."}}, {"n": 25, "q": "How does the reader know that it was very cold outside?", "options": {"A": "because the alarm went off at five-thirty", "B": "because the shovel made a loud sound", "C": "because Daniel's breath hung in the air in front of him", "D": "because Mr. Alvarez was drinking coffee"}, "answer": "C", "feedback": {"A": "Mauvaise réponse. L'heure du réveil ne dit rien de la température. Le froid est montré par des détails physiques : la buée de sa respiration, son nez engourdi, la chaleur des gants qui disparaît. Réponse C.", "B": "Mauvaise réponse. Le bruit de la pelle montre que la rue est silencieuse, pas qu'il fait froid. Réponse C : la buée de sa respiration.", "C": "Bonne réponse. « His breath hung in the air in front of him » : quand on voit sa respiration former de la buée, c'est qu'il fait très froid. Le texte le confirme : « his nose had gone numb », « the warmth was gone ».", "D": "Mauvaise réponse. On peut boire du café par n'importe quel temps. Le détail qui prouve le froid, c'est « his breath hung in the air ». Réponse C."}}, {"n": 26, "q": "How does Daniel feel when he finishes shoveling?", "options": {"A": "worried about being late for school", "B": "satisfied with what he has done", "C": "angry that his grandmother made him work", "D": "embarrassed that Mr. Alvarez saw him"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. Il n'est pas question de retard. Au contraire, il a tout fini avant le petit-déjeuner, et le bus pourra s'arrêter. Réponse B.", "B": "Bonne réponse. « He leaned on the handle and looked back at his work. The path was straight and clean. » Puis la dernière phrase : malgré les doigts raides et les joues qui brûlent, « he found that he was smiling ». Il est

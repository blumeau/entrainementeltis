<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Entraînement ELTiS Hodos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>:root{box-sizing:border-box}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: one column, 680px, exam-sheet feel; a locked step-by-step path (part 1 → 4), the audio control is the one object that stands out. */
:root{
  --bg:#f6f7fb; --card:#ffffff; --fg:#17203a; --muted:#5d6782; --line:#dde2ee;
  --accent:#1f4fd8; --accent-fg:#ffffff; --accent-soft:#e8eefc;
  --ok:#1a8f5a; --ok-soft:#e3f5ec; --bad:#c7362f; --bad-soft:#fbe9e7; --warn-soft:#fff4dc; --lock:#eef0f6;
  --display:"Outfit",system-ui,sans-serif; --body:"Nunito Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1526; --card:#182038; --fg:#eef1fa; --muted:#a3acc6; --line:#2a3452;
  --accent:#7ea0ff; --accent-fg:#0f1526; --accent-soft:#1f2c52;
  --ok:#4fd292; --ok-soft:#163626; --bad:#ff8a80; --bad-soft:#3d1f1d; --warn-soft:#3b3116; --lock:#131a2e; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1526; --card:#182038; --fg:#eef1fa; --muted:#a3acc6; --line:#2a3452;
  --accent:#7ea0ff; --accent-fg:#0f1526; --accent-soft:#1f2c52;
  --ok:#4fd292; --ok-soft:#163626; --bad:#ff8a80; --bad-soft:#3d1f1d; --warn-soft:#3b3116; --lock:#131a2e; color-scheme:dark }
*{box-sizing:border-box} [hidden]{display:none !important}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--body);padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:680px;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 10px;border-bottom:1px solid var(--line);margin-bottom:22px}
.brand{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.2px}
.brand small{display:block;font:600 11px/1.2 var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:26px;font-weight:700} h2{font-size:19px;font-weight:600} h3{font-size:16px;font-weight:600}
p{margin:0}
.eyebrow{font:600 12px/1.2 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stack{display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
/* path */
.path{display:grid;gap:0;position:relative}
.step{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;position:relative}
.step + .step{margin-top:10px}
.step:hover{border-color:var(--accent)}
.step.locked{background:var(--lock);cursor:not-allowed;color:var(--muted)}
.step.locked:hover{border-color:var(--line)}
.step.done{border-color:var(--ok)}
.badge{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;background:var(--accent-soft);color:var(--accent)}
.step.done .badge{background:var(--ok);color:#fff}
.step.locked .badge{background:var(--line);color:var(--muted)}
.badge svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.step .st{font:600 13px/1.2 var(--body);color:var(--muted);white-space:nowrap;text-align:right}
.step.done .st{color:var(--ok)}
.step.current .st{color:var(--accent)}
.sub{color:var(--muted);font-size:14px}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok)}
.btn{font:600 15px/1 var(--body);border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:12px 18px;cursor:pointer}
.btn:hover{border-color:var(--accent)} .btn:focus-visible,.opt:focus-visible,.step:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.instr{background:var(--warn-soft);border-radius:10px;padding:14px 16px;font-size:15px}
.player{display:grid;gap:12px;background:var(--accent-soft);border-radius:14px;padding:18px}
.player .big{display:flex;align-items:center;gap:14px}
.playbtn{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-fg);border:0;cursor:pointer;display:grid;place-items:center;flex:none}
.playbtn svg{width:26px;height:26px;fill:currentColor}
.playbtn:disabled{opacity:.35;cursor:default}
.ptxt{font-family:var(--display);font-weight:600;font-size:17px}
.ptxt small{display:block;font:400 13px/1.3 var(--body);color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s linear}
.time{font:600 12px/1 var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.q{display:grid;gap:10px}
.q .qt{font-weight:700}
.q .num{display:inline-block;min-width:28px;color:var(--accent);font-family:var(--display)}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font:inherit;color:inherit}
.opt b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-family:var(--display)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.ok b{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)} .opt.bad b{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.opt.math span{font-family:var(--display);font-size:18px;letter-spacing:.02em}
.fb{border-left:4px solid var(--line);padding:12px 14px;border-radius:0 10px 10px 0;background:var(--card);font-size:15px;line-height:1.6}
.fb.ok{border-color:var(--ok);background:var(--ok-soft)} .fb.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb .lab{font:700 12px/1.2 var(--body);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.fb.ok .lab{color:var(--ok)} .fb.bad .lab{color:var(--bad)}
.imgbox{aspect-ratio:4/3;max-width:100%;border:1.5px dashed var(--line);border-radius:12px;display:grid;place-items:center;text-align:center;padding:16px;color:var(--muted);font-size:14px;background:var(--card)}
.imgbox img{max-width:100%;max-height:100%;border-radius:8px}
.score{display:flex;align-items:baseline;gap:10px}
.score .n{font-family:var(--display);font-size:44px;font-weight:700;line-height:1}
.score .d{color:var(--muted)}
details{border-top:1px solid var(--line);padding-top:12px} summary{cursor:pointer;font-weight:600;color:var(--muted)}
.tr{font-size:14px;color:var(--muted);display:grid;gap:6px;margin-top:10px}
.exlist{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:600 13px/1 var(--body);padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted)}
.chip.done{border-color:var(--ok);color:var(--ok)} .chip.now{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.passage{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;max-height:380px;overflow:auto;font-size:16px;line-height:1.65}
.passage p{text-indent:1.5em;margin:0 0 .5em}
.passage .quote{margin:.6em 0 1em 2em;font-style:italic;line-height:1.5}
.passage u,.q .qt u{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}
.secttl{margin-top:8px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

<script id="data" type="application/json">{"tests": [{"id": "tb1", "label": "Test blanc 1", "desc": "Le premier test complet : 27 questions, 5 parties.", "parts": [{"part": 1, "title": "Follow classroom directions", "questions": "1-4"}, {"part": 2, "title": "Comprehend mathematical language", "questions": "5-7"}, {"part": 3, "title": "Understand short conversations", "questions": "8-10"}, {"part": 4, "title": "Understand classroom dialogue", "questions": "11-19"}, {"part": 5, "title": "Listen and respond to academic lectures", "questions": "20-27"}], "exercises": [{"id": "P1_1", "part": 1, "audio": "audio/P1_item_1.mp3", "instruction": "Look at the picture. You will hear a teacher give three different directions. Choose the direction (A, B, or C) that the students in the picture have followed. Press play when you are ready: you can listen only once.", "questions": [{"n": 1, "q": "Which direction did the students in the picture follow?", "options": {"A": "Direction A", "B": "Direction B", "C": "Direction C"}, "answer": "A", "feedback": {"A": "Bonne réponse. Sur l'image, les élèves portent leurs lunettes de protection et attendent debout près de l'évier, sans rien faire d'autre. C'est exactement ce que demande la consigne A : « Take out your lab goggles, put them on, and wait by the sink for your lab partner ».", "B": "Mauvaise réponse. La consigne B parle aussi de lunettes et de lavabo (« goggles », « wash your hands »), c'est ce qui a pu te tromper. Mais elle dit l'inverse de l'image : ranger les lunettes (« put your goggles away ») et retourner s'asseoir (« go back to your seat »). Sur l'image, les élèves portent leurs lunettes et sont debout. La bonne réponse est A : ils attendent près de l'évier, lunettes sur le nez.", "C": "Mauvaise réponse. La consigne C décrit une manipulation : verser la solution dans le bécher (« pour the solution into the beaker ») et noter ce qu'on observe (« write down what you observe »). Sur l'image, personne ne verse quoi que ce soit et personne n'écrit : les béchers sont encore vides sur les paillasses. La bonne réponse est A : les élèves ont mis leurs lunettes et attendent près de l'évier."}}], "transcript": ["Narrator: Number 1.", "Narrator: A.", "Teacher: Take out your lab goggles, put them on, and wait by the sink for your lab partner.", "Narrator: B.", "Teacher: Put your goggles away, wash your hands, and go back to your seat.", "Narrator: C.", "Teacher: Pour the solution into the beaker and write down what you observe."], "image": "img/p1_1.jpg"}, {"id": "P1_2", "part": 1, "audio": "audio/P1_item_2.mp3", "instruction": "Look at the picture. You will hear a teacher give three different directions. Choose the direction (A, B, or C) that the students in the picture have followed. Press play when you are ready: you can listen only once.", "questions": [{"n": 2, "q": "Which direction did the students in the picture follow?", "options": {"A": "Direction A", "B": "Direction B", "C": "Direction C"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. La consigne A parle bien de livres, comme l'image, mais l'action n'est pas la même : rendre les livres au comptoir (« return your books to the front desk ») et faire la queue près de la porte (« line up by the door »). Sur l'image, personne ne fait la queue et le comptoir est vide. Les élèves sont assis à des tables en train de lire : c'est la consigne B.", "B": "Bonne réponse. Les élèves sont assis à des tables, chacun avec un livre ouvert, en silence : « Find a book, sit at a table, and read silently until the bell rings ». Les deux autres consignes décrivent des actions qu'on ne voit pas sur l'image (faire la queue, utiliser un ordinateur).", "C": "Mauvaise réponse. La consigne C demande de se connecter à un ordinateur (« log on to a computer ») pour chercher dans le catalogue (« search the catalog »). Sur l'image, les ordinateurs le long du mur sont éteints et personne n'est devant. Les élèves sont assis à des tables avec un livre : c'est la consigne B."}}], "transcript": ["Narrator: Number 2.", "Narrator: A.", "Teacher: Return your books to the front desk and line up by the door.", "Narrator: B.", "Teacher: Find a book, sit at a table, and read silently until the bell rings.", "Narrator: C.", "Teacher: Log on to a computer and search the catalog for your topic."], "image": "img/p1_2.jpg"}, {"id": "P1_3", "part": 1, "audio": "audio/P1_item_3.mp3", "instruction": "Look at the picture. You will hear a teacher give three different directions. Choose the direction (A, B, or C) that the students in the picture have followed. Press play when you are ready: you can listen only once.", "questions": [{"n": 3, "q": "Which direction did the students in the picture follow?", "options": {"A": "Direction A", "B": "Direction B", "C": "Direction C"}, "answer": "C", "feedback": {"A": "Mauvaise réponse. On est en cours de musique, donc le mot « instruments » paraît logique, c'est le piège. Mais la consigne A demande de ranger les instruments dans leur étui et d'empiler les chaises contre le mur (« stack the chairs along the wall ») : c'est une fin de cours. Sur l'image, rien n'est rangé, les élèves sont debout en rangs avec une partition. C'est la consigne C.", "B": "Mauvaise réponse. La consigne B demande de s'asseoir (« sit down ») et de recopier les notes du tableau dans son cahier (« copy the notes from the board into your notebook »). Sur l'image, les élèves sont debout, pas assis, et ils tiennent une partition, pas un cahier. C'est la consigne C : debout en rangs, partition levée, les yeux sur la prof.", "C": "Bonne réponse. Les élèves sont debout en rangs sur les gradins, partition levée, et regardent tous la prof au piano qui lève la main pour donner le départ : « Stand in your rows, hold up your sheet music, and watch me for the cue ». « Cue » = le signal de départ."}}], "transcript": ["Narrator: Number 3.", "Narrator: A.", "Teacher: Put your instruments in their cases and stack the chairs along the wall.", "Narrator: B.", "Teacher: Sit down and copy the notes from the board into your notebook.", "Narrator: C.", "Teacher: Stand in your rows, hold up your sheet music, and watch me for the cue."], "image": "img/p1_3.jpg"}, {"id": "P1_4", "part": 1, "audio": "audio/P1_item_4.mp3", "instruction": "Look at the picture. You will hear a teacher give three different directions. Choose the direction (A, B, or C) that the students in the picture have followed. Press play when you are ready: you can listen only once.", "questions": [{"n": 4, "q": "Which direction did the students in the picture follow?", "options": {"A": "Direction A", "B": "Direction B", "C": "Direction C"}, "answer": "A", "feedback": {"A": "Bonne réponse. On voit un élève accrocher son manteau, un autre ranger son sac dans le casier, un troisième partir avec un seul livre à la main : « Hang up your coats, put your backpacks in your lockers, and bring only your textbook to class ».", "B": "Mauvaise réponse. La consigne B dit de tout garder avec soi (« keep everything with you ») et d'aller directement au gymnase (« go straight to the gym for the assembly »). Sur l'image, c'est l'inverse : les sacs sont rangés dans les casiers et les élèves partent les mains presque vides, vers une salle de classe. C'est la consigne A.", "C": "Mauvaise réponse. « Backpacks » et « line up single file » sont des mots qu'on s'attend à entendre dans un couloir, c'est le piège. Mais la consigne C parle d'un exercice d'évacuation incendie (« fire drill ») : sacs laissés par terre et élèves en file indienne. Sur l'image, les sacs sont dans les casiers, pas par terre, et personne ne fait la queue. C'est la consigne A."}}], "transcript": ["Narrator: Number 4.", "Narrator: A.", "Teacher: Hang up your coats, put your backpacks in your lockers, and bring only your textbook to class.", "Narrator: B.", "Teacher: Keep everything with you and go straight to the gym for the assembly.", "Narrator: C.", "Teacher: Leave your backpacks on the floor and line up single file for the fire drill."], "image": "img/p1_4.jpg"}, {"id": "P2_5", "part": 2, "audio": "audio/P2_probleme_5.mp3", "instruction": "You will hear a math word problem, read two times. Choose the expression (A, B, or C) that matches the problem. Press play when you are ready: you can listen only once.", "questions": [{"n": 5, "q": "Which expression should you use?", "options": {"A": "240 ÷ 3/4", "B": "240 × 3/4", "C": "240 − 3/4"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. Tu as bien entendu 240 et « three-fourths » (trois quarts), mais l'opération annoncée n'est pas une division. Le texte dit : « you need to multiply 240 by three-fourths ». « Multiply » = multiplier, donc 240 × 3/4 : réponse B. Retiens que le verbe de l'opération (« multiply », « divide », « add », « subtract ») est toujours le mot clé de ces problèmes.", "B": "Bonne réponse. Le texte annonce l'opération : « you need to multiply 240 by three-fourths ». Multiplier 240 par trois quarts s'écrit 240 × 3/4. C'est logique : trois quarts des 240 repas sont des pizzas.", "C": "Mauvaise réponse. Le texte ne contient aucune soustraction : le mot « subtract » n'est jamais prononcé. L'opération annoncée est « multiply 240 by three-fourths », donc 240 × 3/4 : réponse B. Soustraire 3/4 à 240 n'aurait d'ailleurs aucun sens ici : on cherche une partie des 240 repas, pas 240 moins un petit nombre."}}], "transcript": ["The school cafeteria sells 240 lunches a day. Three-fourths of the students who buy lunch choose pizza on Fridays. To figure out how many pizza lunches the cafeteria needs on a Friday, you need to multiply 240 by three-fourths. Which expression should you use?"]}, {"id": "P2_6", "part": 2, "audio": "audio/P2_probleme_6.mp3", "instruction": "You will hear a math word problem, read two times. Choose the expression (A, B, or C) that matches the problem. Press play when you are ready: you can listen only once.", "questions": [{"n": 6, "q": "Which expression should you use?", "options": {"A": "180 ÷ 45", "B": "180 × 45", "C": "180 − 45"}, "answer": "A", "feedback": {"A": "Bonne réponse. Le texte dit : « you divide 180 by 45 ». Diviser 180 par 45 s'écrit 180 ÷ 45. C'est logique : 180 élèves répartis par bus de 45 donne le nombre de bus nécessaires.", "B": "Mauvaise réponse. Les nombres sont les bons (180 et 45) mais l'opération ne l'est pas. Le texte dit « divide 180 by 45 », pas « multiply ». Multiplier 180 élèves par 45 n'aurait pas de sens : on cherche combien de bus il faut, donc on partage les élèves en groupes de 45. C'est 180 ÷ 45 : réponse A.", "C": "Mauvaise réponse. Il n'y a aucune soustraction dans le texte. L'opération annoncée est « divide 180 by 45 », donc 180 ÷ 45 : réponse A. Attention au sens de « divide X by Y » : c'est toujours X ÷ Y, le premier nombre est celui qu'on partage."}}], "transcript": ["A school is taking 180 students on a field trip. Each bus holds 45 students. To figure out how many buses the school needs, you divide 180 by 45. Which expression should you use?"]}, {"id": "P2_7", "part": 2, "audio": "audio/P2_probleme_7.mp3", "instruction": "You will hear a math word problem, read two times. Choose the expression (A, B, or C) that matches the problem. Press play when you are ready: you can listen only once.", "questions": [{"n": 7, "q": "Which expression should you use?", "options": {"A": "(6 + 4) × 12", "B": "6 + 4 × 12", "C": "(6 × 4) + 12"}, "answer": "A", "feedback": {"A": "Bonne réponse. Le texte donne deux étapes dans l'ordre : « first add 6 and 4 » (on additionne d'abord les heures), « then multiply the result by 12 » (on multiplie le total par le salaire horaire). Les parenthèses montrent que l'addition se fait avant la multiplication : (6 + 4) × 12 = 120 dollars.", "B": "Mauvaise réponse. C'est le piège classique de cette question : les bons nombres, les bons signes, mais pas de parenthèses. En maths, sans parenthèses, la multiplication passe avant l'addition : en B, c'est 4 × 12 qui se calcule en premier, puis on ajoute 6. Or le texte dit « first add 6 and 4 » : l'addition d'abord. Il fallait les parenthèses : (6 + 4) × 12, réponse A.", "C": "Mauvaise réponse. Le texte dit « add 6 and 4 », pas « multiply 6 by 4 ». Maya a travaillé 6 heures puis 4 heures : on additionne ses heures (6 + 4 = 10), on ne les multiplie pas entre elles. Ensuite seulement on multiplie le total par 12 dollars. C'est (6 + 4) × 12 : réponse A."}}], "transcript": ["Maya earns 12 dollars an hour at her weekend job. She worked 6 hours on Saturday and 4 hours on Sunday. To figure out how much money she earned in total, you first add 6 and 4, and then multiply the result by 12. Which expression should you use?"]}, {"id": "P3_8", "part": 3, "audio": "audio/P3_conversation1_Q8.mp3", "instruction": "You will hear a short conversation, read two times. The question is read before the conversation and shown on the screen. Choose the best answer (A, B, or C). Press play when you are ready: you can listen only once.", "intro": "Look at the question. What are the teacher and student discussing? Listen to the conversation.", "questions": [{"n": 8, "q": "What are the teacher and student discussing?", "options": {"A": "When the essay is due.", "B": "How the essay will be graded.", "C": "Why the student missed class."}, "answer": "B", "feedback": {"A": "Mauvaise réponse. Le jeudi est mentionné à la toute fin (« I'll bring you a draft on Thursday »), mais c'est l'élève qui propose d'apporter un brouillon, pas une date limite donnée par la prof. Toute la conversation porte sur la grille de notation (« the rubric ») : comment les points sont répartis entre thèse, preuves, organisation et grammaire. Réponse B.", "B": "Bonne réponse. La prof renvoie l'élève à la grille (« the rubric… tells you exactly how the points are divided ») et précise même le barème : « Ten out of forty » pour la thèse. Ils parlent de la façon dont la rédaction sera notée.", "C": "Mauvaise réponse. Il n'est jamais question d'une absence. L'élève est là, il s'apprête à commencer sa rédaction, et la prof lui explique le barème : thèse, preuves, organisation, grammaire. Réponse B."}}], "transcript": ["Teacher: Marcus, before you start the essay, I want you to look at the rubric on the back of the assignment sheet. It tells you exactly how the points are divided: thesis, evidence, organization, and grammar.", "Student: So if I don't have a clear thesis, I lose a lot of points?", "Teacher: Ten out of forty. That's why I always say: write your thesis first, then build the rest around it.", "Student: Got it. I'll bring you a draft on Thursday.", "Narrator: Listen again. (the conversation is read a second time)"]}, {"id": "P3_9", "part": 3, "audio": "audio/P3_conversation2_Q9.mp3", "instruction": "You will hear a short conversation, read two times. The question is read before the conversation and shown on the screen. Choose the best answer (A, B, or C). Press play when you are ready: you can listen only once.", "intro": "Look at the question. What does the girl need to do? Listen to the conversation.", "questions": [{"n": 9, "q": "What does the girl need to do?", "options": {"A": "Turn in a medical form.", "B": "Post the tryout list.", "C": "Sign up for football."}, "answer": "A", "feedback": {"A": "Bonne réponse. Le garçon lui dit : « you also have to turn in the physical form before Friday, or they won't let you try out ». « The physical form », c'est le formulaire médical (« the form from the doctor »). Elle doit le rendre avant vendredi, et elle va chercher un exemplaire vierge au secrétariat après le déjeuner.", "B": "Mauvaise réponse. La liste des sélections est déjà affichée, par le coach (« it's on the door of the gym »). Ce n'est pas la fille qui doit l'afficher. Ce qu'elle doit faire, c'est rendre le formulaire médical avant vendredi. Réponse A.", "C": "Mauvaise réponse. Le football n'est cité que parce que la fille croyait que le formulaire ne concernait que ce sport (« I thought that was only for football »). Le garçon la corrige : « it's for every sport ». Elle ne s'inscrit pas au football ; elle doit rendre son formulaire médical. Réponse A."}}], "transcript": ["Girl: Hey, do you know if Coach Rivera already posted the tryout list?", "Boy: Yeah, it's on the door of the gym. But you also have to turn in the physical form before Friday, or they won't let you try out.", "Girl: The form from the doctor? I thought that was only for football.", "Boy: No, it's for every sport. Mine is already signed. You should ask the office for a blank one today.", "Girl: Okay, I'll go right after lunch.", "Narrator: Listen again. (the conversation is read a second time)"]}, {"id": "P3_10", "part": 3, "audio": "audio/P3_conversation3_Q10.mp3", "instruction": "You will hear a short conversation, read two times. The question is read before the conversation and shown on the screen. Choose the best answer (A, B, or C). Press play when you are ready: you can listen only once.", "intro": "Look at the question. What does the teacher tell the student to do? Listen to the conversation.", "questions": [{"n": 10, "q": "What does the teacher tell the student to do?", "options": {"A": "Skip number six and move on.", "B": "Copy the example on page forty.", "C": "Convert both times to hours and redo the division."}, "answer": "C", "feedback": {"A": "Mauvaise réponse. Le prof ne dit pas de passer à autre chose : il trouve l'erreur et explique comment la corriger. « Go back and change both to hours, then redo the division. » Réponse C.", "B": "Mauvaise réponse. L'exemple de la page 40 sert à vérifier (« check your answer against the example »), pas à copier. L'instruction principale, c'est de convertir les deux durées en heures et de refaire la division. Réponse C.", "C": "Bonne réponse. « Go back and change both to hours, then redo the division. » L'élève avait converti une seule des deux durées ; le prof lui dit de convertir les deux, puis de refaire le calcul et de comparer avec l'exemple de la page 40."}}], "transcript": ["Student: Mr. Okafor, I finished the worksheet, but I'm not sure about number six. The answer seems way too big.", "Teacher: Let me see. Ah, you converted the minutes to hours, which is right, but you forgot to do the same for the second part. Go back and change both to hours, then redo the division.", "Student: Both of them? Okay.", "Teacher: And check your answer against the example on page forty. If it looks reasonable, you're done.", "Narrator: Listen again. (the conversation is read a second time)"]}, {"id": "P4_11-13", "part": 4, "audio": "audio/P4_dialogue1_Q11-13.mp3", "instruction": "You will hear a conversation in a classroom, followed by three questions. The questions and answer choices are shown on the screen while they are read. Press play when you are ready: you can listen only once.", "intro": "Listen to this conversation. You will hear a teacher and a student talking in a science classroom. Listen carefully.", "questions": [{"n": 11, "q": "What is the discussion mainly about?", "options": {"A": "Why the sun moves closer to the Earth at sunset.", "B": "Why the sky changes color at sunset.", "C": "Why forest fires produce smoke."}, "answer": "B", "feedback": {"A": "Mauvaise réponse. C'est l'idée que l'élève propose au tout début (« Isn't it just the sun getting closer to the ground? »), et c'est le piège : la prof la corrige immédiatement, « the sun doesn't move closer at all ». Tout le reste de la conversation explique le vrai mécanisme : la lumière traverse plus d'air au coucher du soleil et le bleu est dispersé. Le sujet, c'est donc pourquoi le ciel change de couleur : réponse B.", "B": "Bonne réponse. La question de l'élève (« why does the sky turn red at sunset? ») lance toute la conversation, et chaque réplique de la prof y répond : distance parcourue par la lumière, dispersion du bleu, ce qui reste est rouge et orange. Les feux de forêt ne sont qu'un exemple final.", "C": "Mauvaise réponse. Les feux de forêt n'apparaissent que dans la toute dernière réplique, comme exemple pour illustrer l'effet de la fumée (« sunsets after a forest fire can look so dramatic »). Ce n'est pas le sujet de la discussion, qui est lancée par la question de l'élève : pourquoi le ciel devient rouge au coucher du soleil. Réponse B."}}, {"n": 12, "q": "According to the teacher, what happens to blue light in the atmosphere?", "options": {"A": "It is scattered easily.", "B": "It travels in a straight line.", "C": "It is absorbed by dust."}, "answer": "A", "feedback": {"A": "Bonne réponse. La prof dit mot pour mot : « Blue light gets scattered away very easily ». « Scattered » = dispersé. C'est la lumière rouge et orange qui, elle, continue en ligne droite.", "B": "Mauvaise réponse. Tu as inversé les couleurs. Ce sont le rouge et l'orange qui « keep going in a straight line » (continuent en ligne droite) parce qu'ils ne sont pas dispersés. La lumière bleue, au contraire, « gets scattered away very easily » : elle est dispersée facilement. Réponse A.", "C": "Mauvaise réponse. La prof parle de dispersion (« scatter ») du début à la fin, jamais d'absorption. La poussière et la fumée dispersent encore plus de bleu (« scatter even more of the blue light away »), elles ne l'absorbent pas. Réponse A : la lumière bleue est dispersée facilement."}}, {"n": 13, "q": "Why can sunsets look redder after a forest fire?", "options": {"A": "Because the sun is lower in the sky.", "B": "Because the fire heats the air.", "C": "Because smoke scatters more blue light."}, "answer": "C", "feedback": {"A": "Mauvaise réponse. La hauteur du soleil sur l'horizon explique pourquoi les couchers de soleil sont rouges en général (la lumière traverse plus d'air), mais pas pourquoi ils sont plus rouges après un incendie. Pour ça, la prof donne une raison précise dans sa dernière réplique : « Dust and smoke scatter even more of the blue light away ». Réponse C.", "B": "Mauvaise réponse. La chaleur du feu n'est jamais mentionnée dans le dialogue. Ce qui change après un incendie, c'est la fumée dans l'air : « Dust and smoke scatter even more of the blue light away ». Plus de bleu dispersé, donc plus de rouge qui arrive jusqu'à nos yeux. Réponse C.", "C": "Bonne réponse. Dernière réplique de la prof : « Dust and smoke scatter even more of the blue light away. That's why sunsets after a forest fire can look so dramatic ». La fumée disperse encore plus de lumière bleue, et il reste encore plus de rouge."}}], "transcript": ["Student: Ms. Alvarez, why does the sky turn red at sunset? Isn't it just the sun getting closer to the ground?", "Teacher: Well, that's what it looks like, but the sun doesn't move closer at all. It's really about how far the sunlight has to travel through the air. During the day, the sun is high in the sky, so its light only passes through a thin layer of atmosphere. At sunset, the sun is low on the horizon, so the light has to travel a much longer distance through the air to reach your eyes.", "Student: Okay, but why does a longer distance make it red?", "Teacher: Because the air scatters the colors differently. Blue light gets scattered away very easily. That's actually why the sky looks blue in the daytime. Red and orange light are not scattered as much, so they keep going in a straight line. By the time the light has crossed all that extra air at sunset, most of the blue has been scattered out, and what's left is red and orange.", "Student: So on a day with a lot of dust in the air, the sunset would be even redder?", "Teacher: Exactly. Dust and smoke scatter even more of the blue light away. That's why sunsets after a forest fire can look so dramatic."]}, {"id": "P4_14-16", "part": 4, "audio": "audio/P4_dialogue2_Q14-16.mp3", "instruction": "You will hear a conversation in a classroom, followed by three questions. The questions and answer choices are shown on the screen while they are read. Press play when you are ready: you can listen only once.", "intro": "Listen to this conversation. You will hear a teacher and a student talking in a social studies classroom. Listen carefully.", "questions": [{"n": 14, "q": "What is the discussion mainly about?", "options": {"A": "How the telegraph was invented.", "B": "A mail service that lasted a short time.", "C": "The history of California."}, "answer": "B", "feedback": {"A": "Mauvaise réponse. Le télégraphe n'arrive qu'à la toute fin, comme cause de la fermeture du Pony Express. On ne parle pas de son invention. Tout le dialogue porte sur le Pony Express lui-même : comment il fonctionnait, combien de temps mettait une lettre, pourquoi il s'est arrêté. Et le prof insiste deux fois sur sa courte durée : « only for a very short time », « it lasted only eighteen months ». Réponse B.", "B": "Bonne réponse. Tout le dialogue tourne autour du Pony Express, un service de courrier à cheval, et le prof insiste sur sa brièveté : « It was, but only for a very short time » et, à la fin, « It lasted only eighteen months ».", "C": "Mauvaise réponse. La Californie n'est citée que comme destination des cavaliers (« from Missouri all the way to California ») et comme lieu où arrivent les messages. On ne parle jamais de son histoire. Le sujet, c'est le Pony Express, un service de courrier qui n'a duré que dix-huit mois : réponse B."}}, {"n": 15, "q": "Why did riders change horses at the stations?", "options": {"A": "So the horses could carry more mail.", "B": "So they could keep going at full speed.", "C": "Because the stations were far apart."}, "answer": "B", "feedback": {"A": "Mauvaise réponse. Rien dans le dialogue ne parle de la quantité de courrier transportée. Le prof explique pourquoi on changeait de cheval : « jump onto a fresh horse, and keep going at full speed ». Un cheval reposé (« fresh ») permet de continuer à pleine vitesse. Réponse B.", "B": "Bonne réponse. « A rider would gallop to the next station, jump onto a fresh horse, and keep going at full speed ». Un cheval fatigué ralentit ; en changeant de cheval à chaque station, le cavalier garde la vitesse maximale.", "C": "Mauvaise réponse. Le prof dit qu'il y avait environ 150 stations, mais il ne donne pas la distance entre elles comme raison du changement de cheval. La raison donnée est la vitesse : « keep going at full speed ». Un cheval frais permet de ne pas ralentir. Réponse B."}}, {"n": 16, "q": "What caused the Pony Express to close?", "options": {"A": "The telegraph line was completed.", "B": "The riders refused to work.", "C": "Ships became faster."}, "answer": "A", "feedback": {"A": "Bonne réponse. « The telegraph. In October 1861, the telegraph line across the country was finished, and a message could reach California in minutes. The Pony Express closed two days later. » Un message en quelques minutes contre dix jours à cheval : le Pony Express n'avait plus de raison d'exister.", "B": "Mauvaise réponse. Les cavaliers (« riders ») sont décrits comme galopant de station en station, mais il n'est jamais question d'un refus de travailler. La cause de la fermeture est donnée clairement par le prof : « The telegraph ». Deux jours après l'achèvement de la ligne télégraphique, le service a fermé. Réponse A.", "C": "Mauvaise réponse. Les bateaux sont bien cités, mais comme le moyen lent d'avant (« mail going around by ship could take months »), pas comme un concurrent plus rapide. Ce qui a tué le Pony Express, c'est le télégraphe : un message « could reach California in minutes ». Réponse A."}}], "transcript": ["Student: Mr. Greer, I saw a poster in the hallway about the Pony Express. Was that like a mail service?", "Teacher: It was, but only for a very short time. The Pony Express started in April 1860. Riders on horseback carried mail from Missouri all the way to California, about two thousand miles.", "Student: On one horse? That would take forever.", "Teacher: Well, no. That's the clever part. There were about 150 stations along the route. A rider would gallop to the next station, jump onto a fresh horse, and keep going at full speed. After about 75 miles, a new rider would take over.", "Student: So how long did a letter take?", "Teacher: About ten days. Before that, mail going around by ship could take months. Ten days was incredible.", "Student: Then why did it stop?", "Teacher: The telegraph. In October 1861, the telegraph line across the country was finished, and a message could reach California in minutes. The Pony Express closed two days later. It lasted only eighteen months."]}, {"id": "P4_17-19", "part": 4, "audio": "audio/P4_dialogue3_Q17-19.mp3", "instruction": "You will hear a conversation in a classroom, followed by three questions. The questions and answer choices are shown on the screen while they are read. Press play when you are ready: you can listen only once.", "intro": "Listen to this conversation. You will hear two students talking in an English classroom. Listen carefully.", "questions": [{"n": 17, "q": "What is the discussion mainly about?", "options": {"A": "How to memorize a vocabulary list.", "B": "The difference between two figures of speech.", "C": "A novel the students read in class."}, "answer": "B", "feedback": {"A": "Mauvaise réponse. La liste de vocabulaire apparaît bien, mais seulement dans les deux dernières répliques (« Now I just need to memorize the vocabulary list », « There are forty words »). C'est le piège de la fin de dialogue. Tout le reste porte sur la différence entre métaphore et comparaison, la question posée dès la première réplique. Réponse B.", "B": "Bonne réponse. Le garçon pose la question dès le début : « I still don't get the difference between a metaphor and a simile ». Tout le dialogue explique ces deux figures de style avec des exemples (« her voice was like music », « her voice was music », « the classroom was a zoo »).", "C": "Mauvaise réponse. Aucun roman n'est mentionné dans le dialogue. Ils révisent pour un contrôle d'anglais, mais sur des figures de style (« a metaphor and a simile »), pas sur une lecture. Réponse B."}}, {"n": 18, "q": "According to the girl, which sentence is a simile?", "options": {"A": "Her voice was music.", "B": "The classroom was a zoo.", "C": "Her voice was like music."}, "answer": "C", "feedback": {"A": "Mauvaise réponse. « Her voice was music » est justement l'exemple que la fille donne pour la métaphore : « A metaphor says one thing is another thing. No like, no as. Her voice was music ». Pas de « like », pas de « as », donc pas une simile. La simile, c'est la version avec « like » : « her voice was like music ». Réponse C.", "B": "Mauvaise réponse. « The classroom was a zoo » est une métaphore, et la fille le confirme elle-même quand le garçon demande « That's a metaphor, right? » : « Right ». Il n'y a ni « like » ni « as ». La simile, c'est la phrase qui compare avec « like » : « her voice was like music ». Réponse C.", "C": "Bonne réponse. La fille définit la simile dès sa première réplique : « A simile compares two things using like or as. For example, her voice was like music ». Le mot « like » est la marque de la comparaison."}}, {"n": 19, "q": "According to Ms. Porter, why do writers use metaphors?", "options": {"A": "To make the reader feel something quickly.", "B": "To make their sentences longer.", "C": "To avoid using adjectives."}, "answer": "A", "feedback": {"A": "Bonne réponse. La fille rapporte les mots de Ms. Porter : « a metaphor is more direct, so it hits harder. Writers use it when they want the reader to feel something quickly ». La métaphore frappe plus fort et plus vite.", "B": "Mauvaise réponse. La longueur des phrases n'est jamais évoquée. Au contraire, la métaphore est décrite comme plus directe (« more direct »), donc plutôt plus courte. La raison donnée par Ms. Porter est l'effet sur le lecteur : « when they want the reader to feel something quickly ». Réponse A.", "C": "Mauvaise réponse. Les adjectifs ne sont jamais mentionnés dans le dialogue. Ms. Porter explique que la métaphore « hits harder » et que les écrivains l'utilisent « when they want the reader to feel something quickly » : pour faire ressentir quelque chose rapidement. Réponse A."}}], "transcript": ["Boy: Did you finish the study guide for the English test? I still don't get the difference between a metaphor and a simile.", "Girl: It's actually easy once you see it. A simile compares two things using like or as. For example, her voice was like music.", "Boy: Okay. And a metaphor?", "Girl: A metaphor says one thing is another thing. No like, no as. Her voice was music.", "Boy: So it's basically the same idea, just stronger?", "Girl: Kind of. Ms. Porter said a metaphor is more direct, so it hits harder. Writers use it when they want the reader to feel something quickly.", "Boy: What about the classroom was a zoo? That's a metaphor, right?", "Girl: Right. Nobody thinks there were actual lions in the room. It just means it was loud and out of control.", "Boy: Got it. I think I'll be fine with that part. Now I just need to memorize the vocabulary list.", "Girl: Good luck with that. There are forty words."]}, {"id": "P5_20-23", "part": 5, "audio": "audio/P5_expose1_Q20-23.mp3", "instruction": "You will hear a teacher talking to a class, followed by four questions. The questions and answer choices are shown on the screen while they are read. Press play when you are ready: you can listen only once.", "intro": "Listen to this passage. You will hear a social studies teacher talking. Listen carefully.", "questions": [{"n": 20, "q": "What is the talk mainly about?", "options": {"A": "The life of Governor Clinton.", "B": "How a canal changed the economy.", "C": "Why farmers moved to Ohio."}, "answer": "B", "feedback": {"A": "Mauvaise réponse. Le gouverneur Clinton n'est cité qu'une seule fois, pour expliquer le surnom « Clinton's Ditch ». On ne raconte rien de sa vie. Le prof annonce le sujet dès sa première phrase : « why a ditch full of water changed the whole economy of the United States », et il termine sur la même idée : « what happens when moving things gets cheap ». Réponse B.", "B": "Bonne réponse. Le sujet est annoncé dès le début (« why a ditch full of water changed the whole economy of the United States ») et repris à la fin (« Think about what happens when moving things gets cheap »). Tout l'exposé montre comment le canal a fait baisser les coûts de transport et transformé l'économie.", "C": "Mauvaise réponse. Le fermier de l'Ohio n'est qu'un exemple, au début, pour faire comprendre le problème : vendre son blé à New York coûtait plus cher que le blé lui-même. Le prof ne dit jamais que des fermiers ont déménagé en Ohio. Le sujet de l'exposé, c'est comment le canal a changé l'économie : réponse B."}}, {"n": 21, "q": "Why was the canal called Clinton's Ditch?", "options": {"A": "Many people thought it was a bad idea.", "B": "Governor Clinton dug it himself.", "C": "It was very narrow."}, "answer": "A", "feedback": {"A": "Bonne réponse. « People called it Clinton's Ditch, after the governor, because, well, a lot of them thought it was a crazy idea ». Le surnom était une moquerie : un simple fossé (« ditch ») et une idée folle.", "B": "Mauvaise réponse. Le canal porte le nom du gouverneur (« after the governor »), mais rien ne dit qu'il l'a creusé lui-même : c'est l'État de New York qui a lancé les travaux, et ils ont duré huit ans. Le surnom vient des gens qui se moquaient du projet : « a lot of them thought it was a crazy idea ». Réponse A.", "C": "Mauvaise réponse. La largeur du canal n'est jamais mentionnée ; on connaît seulement sa longueur, 363 miles. Le mot « ditch » (fossé) est ici une moquerie, pas une description technique : les gens trouvaient le projet ridicule, « a crazy idea ». Réponse A."}}, {"n": 22, "q": "What does the teacher say about shipping costs after 1825?", "options": {"A": "They stayed about the same.", "B": "They went up because of the tolls.", "C": "They dropped to about a tenth."}, "answer": "C", "feedback": {"A": "Mauvaise réponse. C'est l'inverse : le prof insiste sur une baisse énorme du coût. « The cost of shipping a ton of goods from Buffalo to New York City dropped from about one hundred dollars to about ten dollars », et il répète « Ten dollars » pour marquer le coup. De 100 à 10, c'est divisé par dix, soit un dixième : réponse C.", "B": "Mauvaise réponse. Les péages (« tolls ») ne sont jamais mentionnés, et le coût a baissé, pas augmenté : « dropped from about one hundred dollars to about ten dollars ». « Dropped » = a chuté. De 100 dollars à 10 dollars, le prix est divisé par dix : réponse C.", "C": "Bonne réponse. « Dropped from about one hundred dollars to about ten dollars. Ten dollars. » Passer de 100 à 10, c'est tomber à un dixième (« a tenth ») du prix. Le prof répète le chiffre pour insister sur l'ampleur de la baisse."}}, {"n": 23, "q": "What does the teacher want students to remember about the canal?", "options": {"A": "The kinds of boats that used it.", "B": "The effect of cheap transportation.", "C": "The number of years it took to build."}, "answer": "B", "feedback": {"A": "Mauvaise réponse. Le prof dit exactement le contraire dans sa conclusion : « don't just think about boats ». Il écarte lui-même les bateaux pour attirer l'attention sur l'idée importante : « Think about what happens when moving things gets cheap ». C'est l'effet du transport bon marché qu'il veut qu'on retienne. Réponse B.", "B": "Bonne réponse. Conclusion de l'exposé : « So when you think about the canal, don't just think about boats. Think about what happens when moving things gets cheap ». Le message à retenir, c'est l'effet d'un transport devenu bon marché sur toute l'économie.", "C": "Mauvaise réponse. Les huit ans de travaux (« It took eight years to build ») sont un détail donné au passage, pas la conclusion. Ce que le prof demande de retenir est dans sa dernière phrase : « Think about what happens when moving things gets cheap ». Réponse B."}}], "transcript": ["Alright, today we're going to talk about the Erie Canal, and why a ditch full of water changed the whole economy of the United States. Now, in the early 1800s, if you were a farmer in Ohio and you wanted to sell your wheat in New York City, you had a problem. There were no railroads yet, and hauling a wagon over the mountains took weeks and cost more than the wheat was worth. So in 1817, the state of New York started digging a canal, 363 miles long, from Lake Erie all the way to the Hudson River. People called it Clinton's Ditch, after the governor, because, well, a lot of them thought it was a crazy idea. It took eight years to build, and it opened in 1825. And believe it or not, the cost of shipping a ton of goods from Buffalo to New York City dropped from about one hundred dollars to about ten dollars. Ten dollars. Suddenly, farmers in the Midwest could sell their crops on the East Coast, and New York City became the busiest port in the country. So when you think about the canal, don't just think about boats. Think about what happens when moving things gets cheap."]}, {"id": "P5_24-27", "part": 5, "audio": "audio/P5_expose2_Q24-27.mp3", "instruction": "You will hear a teacher talking to a class, followed by four questions. The questions and answer choices are shown on the screen while they are read. Press play when you are ready: you can listen only once.", "intro": "Listen to this passage. You will hear a science teacher talking. Listen carefully.", "questions": [{"n": 24, "q": "What is the talk mainly about?", "options": {"A": "How trees make their food.", "B": "Why leaves change color in the fall.", "C": "The difference between maples and other trees."}, "answer": "B", "feedback": {"A": "Mauvaise réponse. La fabrication de la nourriture de l'arbre n'est citée qu'une fois, pour expliquer à quoi sert la chlorophylle (« Chlorophyll is what captures sunlight so the tree can make its food »). Ce n'est pas le sujet. La prof annonce le sujet dès le début : « why leaves change color ». Réponse B.", "B": "Bonne réponse. Le sujet est annoncé dès la première phrase : « let's talk about something you can see right outside the window: why leaves change color ». Tout l'exposé explique d'où viennent le jaune, l'orange et le rouge des feuilles d'automne.", "C": "Mauvaise réponse. Les érables (« maples ») ne sont cités qu'à la fin, comme exemple d'arbre dont le rouge varie d'une année à l'autre. La prof ne compare jamais les érables à d'autres arbres. Le sujet, annoncé dès le début, c'est pourquoi les feuilles changent de couleur : réponse B."}}, {"n": 25, "q": "According to the teacher, where do the yellow and orange colors come from?", "options": {"A": "Pigments that are in the leaf all summer.", "B": "A pigment the tree makes only in the fall.", "C": "The cold nights of autumn."}, "answer": "A", "feedback": {"A": "Bonne réponse. « The yellow and orange colors are in the leaf the whole time. They come from other pigments called carotenoids ». Ces pigments sont présents tout l'été, mais cachés par la chlorophylle (« there's so much chlorophyll that it hides them »). Quand le vert disparaît, ils apparaissent.", "B": "Mauvaise réponse. C'est le piège de la question : il y a bien un pigment fabriqué seulement en automne, l'anthocyanine, mais c'est celui du rouge (« the tree actually makes it fresh in the fall »). Pour le jaune et l'orange, la prof dit l'inverse : « The yellow and orange colors are in the leaf the whole time ». Réponse A.", "C": "Mauvaise réponse. Les nuits froides jouent un rôle pour le rouge (« mostly when the days are sunny and the nights are cold »), pas pour le jaune et l'orange. Ceux-là viennent des caroténoïdes, présents dans la feuille depuis l'été : « in the leaf the whole time ». Réponse A."}}, {"n": 26, "q": "What happens when the days get shorter?", "options": {"A": "The tree makes more chlorophyll.", "B": "The tree stops making chlorophyll.", "C": "The leaves fall off immediately."}, "answer": "B", "feedback": {"A": "Mauvaise réponse. C'est exactement l'inverse de ce que dit la prof : « When the days get shorter in the fall, the tree stops making chlorophyll ». « Stops » = arrête. Et c'est parce que la chlorophylle disparaît que le vert s'efface et que le jaune apparaît. Réponse B.", "B": "Bonne réponse. « When the days get shorter in the fall, the tree stops making chlorophyll, the green fades away, and the yellow and orange finally show through ». Moins de lumière, plus de chlorophylle, et les autres couleurs deviennent visibles.", "C": "Mauvaise réponse. La chute des feuilles n'est jamais évoquée dans l'exposé. Ce qui se passe quand les jours raccourcissent, c'est que l'arbre arrête de produire de la chlorophylle (« the tree stops making chlorophyll »), le vert s'efface et le jaune apparaît. Réponse B."}}, {"n": 27, "q": "Why are maples brighter red in some years than in others?", "options": {"A": "Because of sunny days and cold nights.", "B": "Because they have more chlorophyll.", "C": "Because the trees are older."}, "answer": "A", "feedback": {"A": "Bonne réponse. Le rouge vient de l'anthocyanine, que l'arbre fabrique en automne « mostly when the days are sunny and the nights are cold ». Selon la météo de l'automne, il y en a plus ou moins : « some years the maples are bright red, and other years they look kind of dull ».", "B": "Mauvaise réponse. La chlorophylle donne le vert, pas le rouge, et en automne l'arbre arrête d'en fabriquer. Le rouge vient d'un autre pigment, l'anthocyanine, produit « mostly when the days are sunny and the nights are cold ». C'est donc la météo de l'automne qui fait la différence d'une année à l'autre : réponse A.", "C": "Mauvaise réponse. L'âge des arbres n'est jamais mentionné. La prof explique que le rouge dépend des conditions de l'automne : des journées ensoleillées et des nuits froides (« sunny days and cold nights ») donnent plus d'anthocyanine, donc des érables plus rouges. Réponse A."}}], "transcript": ["Okay, since it's October, let's talk about something you can see right outside the window: why leaves change color. All summer long, leaves are green because they're full of a pigment called chlorophyll. Chlorophyll is what captures sunlight so the tree can make its food. Now, here's the part most people don't know. The yellow and orange colors are in the leaf the whole time. They come from other pigments called carotenoids, the same stuff that makes carrots orange. In summer, there's so much chlorophyll that it hides them. When the days get shorter in the fall, the tree stops making chlorophyll, the green fades away, and the yellow and orange finally show through. The reds are different. Red comes from a pigment called anthocyanin, and the tree actually makes it fresh in the fall, mostly when the days are sunny and the nights are cold. That's why some years the maples are bright red, and other years they look kind of dull. So the next time someone tells you that leaves turn yellow, you can tell them: the yellow was there all along."]}], "mode": "listening"}, {"id": "tb2", "label": "Test blanc 2", "desc": "Partie 1 plus piégeuse, maths un cran au-dessus.", "parts": [{"part": 1, "title": "Follow classroom directions", "questions": "1-4"}, {"part": 2, "title": "Comprehend mathematical language", "questions": "5-7"}, {"part": 3, "title": "Understand short conversations", "questions": "8-10"}, {"part": 4, "title": "Understand classroom dialogue", "questions": "11-19"}, {"part": 5, "title": "Listen and respond to academic lectures", "questions": "20-27"}], "exercises": [{"id": "P1_1", "part": 1, "audio": "audio/tb2/P1_item_1.mp3", "image": "img/tb2/p1_1.jpg", "instruction": "Look at the picture. You will hear a teacher give three different directions. Choose the direction (A, B, or C) that the students in the picture have followed. Press play when you are ready: you can listen only once.", "questions": [{"n": 1, "q": "Which direction did the students in the picture follow?", "options": {"A": "Direction A", "B": "Direction B", "C": "Direction C"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. Les élèves portent bien leur tenue de sport, comme dans la consigne A, mais il n'y a aucune corde à sauter (« jump rope ») sur l'image. Ils sont en train de courir le long du terrain. Deux consignes commencent pareil (« Change into your PE clothes ») : il fallait écouter la suite. La bonne réponse est B : se changer, faire deux tours de gymnase, puis attendre sur la ligne.", "B": "Bonne réponse. Les élèves sont en tenue de sport et courent le long du terrain : ils sont en plein milieu des « two laps around the gym ». La prof attend sur la ligne (« wait on the line »). La consigne A commençait de la même façon mais parlait d'une corde à sauter qu'on ne voit nulle part.", "C": "Mauvaise réponse. La consigne C parle aussi de deux tours de gymnase (« run two laps »), c'est ce qui a pu te tromper. Mais elle dit de se rhabiller ensuite (« change back into your regular clothes »), alors que sur l'image les élèves viennent de se changer en tenue de sport et doivent attendre sur la ligne après avoir couru. L'ordre des actions n'est pas le même. La bonne réponse est B."}}], "transcript": ["Narrator: Number 1.", "Narrator: A.", "Teacher: Change into your PE clothes, grab a jump rope, and wait on the line.", "Narrator: B.", "Teacher: Change into your PE clothes, run two laps around the gym, and then wait on the line.", "Narrator: C.", "Teacher: Run two laps around the gym, then go change back into your regular clothes."]}, {"id": "P1_2", "part": 1, "audio": "audio/tb2/P1_item_2.mp3", "image": "img/tb2/p1_2.jpg", "instruction": "Look at the picture. You will hear a teacher give three different directions. Choose the direction (A, B, or C) that the students in the picture have followed. Press play when you are ready: you can listen only once.", "questions": [{"n": 2, "q": "Which direction did the students in the picture follow?", "options": {"A": "Direction A", "B": "Direction B", "C": "Direction C"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. Les élèves ont bien sorti leurs devoirs, mais ils sont debout, pas assis. « Sit at your desks » et « stand by your desks » ne diffèrent que par un mot, et c'est ce mot qui fait la différence sur l'image. La bonne réponse est B : debout à côté du bureau, devoirs à la main.", "B": "Bonne réponse. Les élèves sont debout à côté de leur bureau (« stand by your desks ») et tiennent leur feuille de devoirs (« take out your homework »). Le panier sur le bureau de la prof est vide : personne n'a encore rendu quoi que ce soit, ce qui élimine la consigne C.", "C": "Mauvaise réponse. La consigne C commence exactement comme la B (« Stand by your desks »), mais elle demande ensuite de déposer les devoirs dans le panier (« put your homework in the basket »). Sur l'image, le panier est vide et chaque élève tient encore sa feuille. Ils ont sorti leurs devoirs, ils ne les ont pas rendus. La bonne réponse est B."}}], "transcript": ["Narrator: Number 2.", "Narrator: A.", "Teacher: Sit at your desks and take out your homework.", "Narrator: B.", "Teacher: Stand by your desks and take out your homework.", "Narrator: C.", "Teacher: Stand by your desks and put your homework in the basket on my desk."]}, {"id": "P1_3", "part": 1, "audio": "audio/tb2/P1_item_3.mp3", "image": "img/tb2/p1_3.jpg", "instruction": "Look at the picture. You will hear a teacher give three different directions. Choose the direction (A, B, or C) that the students in the picture have followed. Press play when you are ready: you can listen only once.", "questions": [{"n": 3, "q": "Which direction did the students in the picture follow?", "options": {"A": "Direction A", "B": "Direction B", "C": "Direction C"}, "answer": "A", "feedback": {"A": "Bonne réponse. On voit les trois actions : des élèves rincent leurs pinceaux à l'évier (« rinse your brushes »), les peintures sont accrochées sur le séchoir (« hang your painting on the drying rack »), et un élève essuie une table (« wipe your table »). Les tables sont vides, ce qui élimine la B.", "B": "Mauvaise réponse. La consigne B est presque identique à la A, sauf un détail : les peintures restent sur les tables pour sécher (« leave your painting on your table »). Or sur l'image, les tables sont vides et les peintures sont suspendues au séchoir. C'est ce détail qui tranche. La bonne réponse est A.", "C": "Mauvaise réponse. Les peintures sont bien sur le séchoir, comme le dit la consigne C, mais personne ne va chercher une nouvelle feuille auprès du prof (« come get a new sheet of paper »), et le prof ne distribue rien. En revanche, on voit des élèves rincer leurs pinceaux et essuyer les tables, ce que la C ne mentionne pas. La bonne réponse est A."}}], "transcript": ["Narrator: Number 3.", "Narrator: A.", "Teacher: Rinse your brushes, hang your painting on the drying rack, and wipe your table.", "Narrator: B.", "Teacher: Rinse your brushes, leave your painting on your table to dry, and wipe your table.", "Narrator: C.", "Teacher: Hang your painting on the drying rack, then come get a new sheet of paper from me."]}, {"id": "P1_4", "part": 1, "audio": "audio/tb2/P1_item_4.mp3", "image": "img/tb2/p1_4.jpg", "instruction": "Look at the picture. You will hear a teacher give three different directions. Choose the direction (A, B, or C) that the students in the picture have followed. Press play when you are ready: you can listen only once.", "questions": [{"n": 4, "q": "Which direction did the students in the picture follow?", "options": {"A": "Direction A", "B": "Direction B", "C": "Direction C"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. Les écrans sont noirs, donc les élèves se sont bien déconnectés (« log off »), mais personne ne fait la queue à la porte (« line up at the door ») : ils sont tous encore assis. La consigne A et la B contiennent toutes les deux « log off » ; la différence, c'est ce qui vient après. La bonne réponse est B : rester assis jusqu'à l'appel de sa rangée.", "B": "Bonne réponse. Les écrans sont éteints (ils ont sauvegardé et se sont déconnectés), tous les élèves sont encore assis, et la prof tient sa liste pour appeler les rangées une par une : « stay seated until I call your row ». Personne n'est à la porte ni à l'imprimante.", "C": "Mauvaise réponse. La consigne C commence comme la B (« Save your work »), mais elle demande ensuite d'aller chercher son impression (« pick up your printout from the printer »). Sur l'image, personne n'est devant l'imprimante et son bac est vide. Les élèves sont tous assis à leur place. La bonne réponse est B."}}], "transcript": ["Narrator: Number 4.", "Narrator: A.", "Teacher: Log off, push in your chair, and line up at the door.", "Narrator: B.", "Teacher: Save your work, log off, and stay seated until I call your row.", "Narrator: C.", "Teacher: Save your work, then come to the front and pick up your printout from the printer."]}, {"id": "P2_5", "part": 2, "audio": "audio/tb2/P2_probleme_5.mp3", "instruction": "You will hear a math word problem, read two times. Choose the expression (A, B, or C) that matches the problem. Press play when you are ready: you can listen only once.", "questions": [{"n": 5, "q": "Which expression should you use?", "options": {"A": "(84 × 1/3) ÷ 3", "B": "84 ÷ 3 × 3", "C": "(84 ÷ 1/3) ÷ 3"}, "answer": "A", "feedback": {"A": "Bonne réponse. Deux étapes dans l'ordre : « first multiply 84 by one-third » (84 × 1/3, les points venant des tirs à trois points), « then divide the result by 3 » (÷ 3, pour passer des points au nombre de tirs). Les parenthèses montrent que la multiplication se fait d'abord : (84 × 1/3) ÷ 3 = 28 ÷ 3… ce qui donne 9 tirs et quelques. L'important ici est l'expression, pas le résultat.", "B": "Mauvaise réponse. Le texte dit « multiply 84 by one-third », donc 84 × 1/3, pas 84 ÷ 3 (même si ces deux calculs donnent le même nombre, l'expression demandée est celle qui suit les mots du problème). Et la deuxième étape est « divide the result by 3 », pas multiplier. L'expression qui suit le texte mot pour mot est (84 × 1/3) ÷ 3 : réponse A.", "C": "Mauvaise réponse. La première opération annoncée est « multiply 84 by one-third », pas « divide ». Diviser 84 par un tiers donnerait 252, un nombre plus grand que le total des points, ce qui n'a pas de sens. L'expression correcte commence par 84 × 1/3, puis divise par 3 : réponse A."}}], "transcript": ["A basketball team scored 84 points in a game. One-third of the points came from three-point shots. To find how many three-point shots the team made, you first multiply 84 by one-third, and then divide the result by 3. Which expression should you use?"]}, {"id": "P2_6", "part": 2, "audio": "audio/tb2/P2_probleme_6.mp3", "instruction": "You will hear a math word problem, read two times. Choose the expression (A, B, or C) that matches the problem. Press play when you are ready: you can listen only once.", "questions": [{"n": 6, "q": "Which expression should you use?", "options": {"A": "−8 + 15", "B": "−8 − 15", "C": "15 − (−8)"}, "answer": "A", "feedback": {"A": "Bonne réponse. « You add negative 8 and 15 » : on additionne −8 et 15, donc −8 + 15 = 7 degrés. La température est montée (« risen »), donc on ajoute.", "B": "Mauvaise réponse. Le texte dit « add » (additionner) et « risen » (monté) : la température augmente, on ne soustrait pas. −8 − 15 donnerait −23, encore plus froid, alors qu'il fait plus chaud à midi. La bonne expression est −8 + 15 : réponse A.", "C": "Mauvaise réponse. Le texte dit « add negative 8 and 15 » : une addition qui part de −8. L'expression 15 − (−8) est une soustraction de deux températures, ce qui servirait à calculer un écart, pas la température à midi. Et le texte ne parle jamais de soustraire. La bonne réponse est A : −8 + 15."}}], "transcript": ["The temperature at 6 a.m. was negative 8 degrees Fahrenheit. By noon, it had risen by 15 degrees. To find the temperature at noon, you add negative 8 and 15. Which expression should you use?"]}, {"id": "P2_7", "part": 2, "audio": "audio/tb2/P2_probleme_7.mp3", "instruction": "You will hear a math word problem, read two times. Choose the expression (A, B, or C) that matches the problem. Press play when you are ready: you can listen only once.", "questions": [{"n": 7, "q": "Which expression should you use?", "options": {"A": "20 − (4 × 2.50)", "B": "(20 − 4) × 2.50", "C": "4 × 2.50 − 20"}, "answer": "A", "feedback": {"A": "Bonne réponse. « First multiply 2.50 by 4 » : le prix total des cahiers, 4 × 2.50, entre parenthèses parce que c'est calculé en premier. « Then subtract that answer from 20 » : on enlève ce total des 20 dollars, donc 20 − (4 × 2.50) = 10 dollars de monnaie.", "B": "Mauvaise réponse. En B, on soustrait d'abord 4 à 20, ce que le texte ne dit jamais : les 4, ce sont des cahiers, pas des dollars. Le texte dit « first multiply 2.50 by 4 » : la multiplication vient en premier. La bonne expression est 20 − (4 × 2.50) : réponse A.", "C": "Mauvaise réponse. Attention au sens de « subtract that answer from 20 » : on enlève le total des cahiers « from 20 », donc 20 moins le total, pas le total moins 20. En C, le résultat serait négatif (10 − 20 = −10), ce qui ne peut pas être une monnaie rendue. La bonne réponse est A : 20 − (4 × 2.50)."}}], "transcript": ["A store sells notebooks for 2 dollars and 50 cents each. Jamal buys 4 notebooks and pays with a 20-dollar bill. To find how much change he gets back, you first multiply 2.50 by 4, and then subtract that answer from 20. Which expression should you use?"]}, {"id": "P3_8", "part": 3, "audio": "audio/tb2/P3_conversation1_Q8.mp3", "instruction": "You will hear a short conversation, read two times. The question is read before the conversation and shown on the screen. Choose the best answer (A, B, or C). Press play when you are ready: you can listen only once.", "intro": "Look at the question. What are the teacher and student discussing? Listen to the conversation.", "questions": [{"n": 8, "q": "What are the teacher and student discussing?", "options": {"A": "A science fair project.", "B": "A trip to a planetarium.", "C": "The student's grade on a test."}, "answer": "A", "feedback": {"A": "Bonne réponse. Dès la première phrase : « your group picked the solar system for the science fair ». Ils discutent du projet pour la foire aux sciences : quel aspect traiter, quel modèle construire, quelle question poser.", "B": "Mauvaise réponse. Le système solaire et les planètes sont le sujet du projet, mais il n'est jamais question d'une sortie ni d'un planétarium. Ils parlent d'un projet à construire pour la « science fair ». Réponse A.", "C": "Mauvaise réponse. Aucune note ni aucun contrôle n'est mentionné. La prof conseille l'élève sur son projet de foire aux sciences : choisir une question précise avant de construire le modèle. Réponse A."}}], "transcript": ["Teacher: Devin, I noticed your group picked the solar system for the science fair. That's a big topic. Have you decided which part you're focusing on?", "Student: We were thinking about why the planets stay in orbit. Maybe build a model with a ball and a string?", "Teacher: That could work, as long as the model actually demonstrates something, not just looks nice. Write down the question you're trying to answer before you build anything.", "Student: Okay, we'll do that first.", "Narrator: Listen again. (the conversation is read a second time)"]}, {"id": "P3_9", "part": 3, "audio": "audio/tb2/P3_conversation2_Q9.mp3", "instruction": "You will hear a short conversation, read two times. The question is read before the conversation and shown on the screen. Choose the best answer (A, B, or C). Press play when you are ready: you can listen only once.", "intro": "Look at the question. What does the boy need to do? Listen to the conversation.", "questions": [{"n": 9, "q": "What does the boy need to do?", "options": {"A": "Go to the dentist.", "B": "Write the sports section alone.", "C": "Sign out a camera from Ms. Tran."}, "answer": "C", "feedback": {"A": "Mauvaise réponse. Le rendez-vous chez le dentiste est déjà passé : c'est la raison pour laquelle il a manqué la réunion (« I had a dentist appointment »). Ce qu'il doit faire maintenant, c'est emprunter un appareil photo en le faisant enregistrer par Ms. Tran. Réponse C.", "B": "Mauvaise réponse. Il n'est pas seul sur la rubrique sport : « You and I have the sports section ». Et il ne s'agit pas d'écrire mais de prendre des photos pour lundi. Pour ça, il lui faut un appareil, à faire enregistrer auprès de Ms. Tran. Réponse C.", "C": "Bonne réponse. « You can borrow one from the media center, but you have to sign it out with her first. She's in room 210 until three. » Il doit aller voir Ms. Tran pour emprunter un appareil photo et livrer les premières photos lundi."}}], "transcript": ["Girl: Noah, Ms. Tran was looking for you after fourth period. You weren't at the yearbook meeting.", "Boy: I had a dentist appointment. Did I miss something important?", "Girl: She assigned the pages. You and I have the sports section, and she wants the first photos by Monday.", "Boy: Monday? I don't even have a camera.", "Girl: You can borrow one from the media center, but you have to sign it out with her first. She's in room 210 until three.", "Narrator: Listen again. (the conversation is read a second time)"]}, {"id": "P3_10", "part": 3, "audio": "audio/tb2/P3_conversation3_Q10.mp3", "instruction": "You will hear a short conversation, read two times. The question is read before the conversation and shown on the screen. Choose the best answer (A, B, or C). Press play when you are ready: you can listen only once.", "intro": "Look at the question. What does the teacher tell the student to do? Listen to the conversation.", "questions": [{"n": 10, "q": "What does the teacher tell the student to do?", "options": {"A": "Write a new introduction with more examples.", "B": "Shorten the speech and time it again.", "C": "Remove the part about the history of the school."}, "answer": "B", "feedback": {"A": "Mauvaise réponse. C'est l'inverse : l'introduction a trois exemples et la prof dit qu'un seul suffit (« one strong example is enough »). Il faut en enlever, pas en ajouter. L'instruction générale, c'est de raccourcir le discours d'un tiers et de se chronométrer à nouveau. Réponse B.", "B": "Bonne réponse. « You'll need to cut about a third of it », puis « time yourself again tonight and bring the new version tomorrow ». Raccourcir, se chronométrer, rapporter la nouvelle version.", "C": "Mauvaise réponse. La prof dit justement de garder cette partie : « Keep it, but shorten it to two sentences ». Elle ne demande pas de la supprimer, mais de la réduire. Réponse B."}}], "transcript": ["Student: Ms. Delgado, I wrote my speech, but it's almost seven minutes long, and the limit is five.", "Teacher: Then you'll need to cut about a third of it. Start with the introduction. You have three examples there, and one strong example is enough.", "Student: What about the part on the history of the school? I really like that part.", "Teacher: Keep it, but shorten it to two sentences. Then time yourself again tonight and bring the new version tomorrow.", "Narrator: Listen again. (the conversation is read a second time)"]}, {"id": "P4_11-13", "part": 4, "audio": "audio/tb2/P4_dialogue1_Q11-13.mp3", "instruction": "You will hear a conversation in a classroom, followed by three questions. The questions and answer choices are shown on the screen while they are read. Press play when you are ready: you can listen only once.", "intro": "Listen to this conversation. You will hear a teacher and a student talking in a science classroom. Listen carefully.", "questions": [{"n": 11, "q": "What is the discussion mainly about?", "options": {"A": "Why steel is used to build ships.", "B": "Why some objects float and others sink.", "C": "How ships are repaired after a leak."}, "answer": "B", "feedback": {"A": "Mauvaise réponse. L'acier est mentionné, mais seulement parce que l'élève compare un boulon en acier et un navire en acier. La prof n'explique jamais pourquoi on construit les bateaux en acier. Toute sa réponse porte sur le principe du déplacement d'eau : pourquoi un objet flotte ou coule. Réponse B.", "B": "Bonne réponse. La question de l'élève (« How can it float when a small steel bolt sinks? ») lance la discussion, et la prof explique le principe général : « If the object pushes aside an amount of water that weighs more than the object itself, the object floats. If it pushes aside less, it sinks. »", "C": "Mauvaise réponse. La fuite (« leak ») n'arrive qu'à la toute fin, comme exemple de ce qui se passe quand un bateau se remplit d'eau. Il n'est jamais question de réparation. Le sujet, c'est pourquoi certains objets flottent et d'autres coulent : réponse B."}}, {"n": 12, "q": "According to the teacher, why does a steel bolt sink?", "options": {"A": "Because it is heavier than a ship.", "B": "Because steel always sinks in water.", "C": "Because it pushes aside very little water."}, "answer": "C", "feedback": {"A": "Mauvaise réponse. Un boulon est évidemment plus léger qu'un navire, pas plus lourd, et la prof dit justement que le poids n'est pas la question : « It's not about how heavy something is ». Ce qui compte, c'est la quantité d'eau déplacée. Le boulon « pushes aside only a tiny bit of water » : réponse C.", "B": "Mauvaise réponse. Si l'acier coulait toujours, le navire en acier coulerait aussi. La prof explique au contraire que c'est la forme qui compte : le boulon est une masse pleine (« a solid lump ») qui déplace très peu d'eau, alors que la coque creuse du navire en déplace énormément. Réponse C.", "C": "Bonne réponse. « A bolt is a solid lump. It pushes aside only a tiny bit of water, much less than its own weight, so it sinks. » Il déplace moins d'eau que son propre poids, donc il coule."}}, {"n": 13, "q": "What happens when a ship springs a leak?", "options": {"A": "The air inside is replaced by water, and the ship sinks.", "B": "The hull becomes heavier than steel.", "C": "The ship pushes aside more water than before."}, "answer": "A", "feedback": {"A": "Bonne réponse. Dernière réplique de la prof : « The air gets replaced by water, the ship stops pushing enough water aside, and down it goes. » Sans l'air dans la coque, le navire ne déplace plus assez d'eau et coule.", "B": "Mauvaise réponse. La coque est en acier, elle ne peut pas devenir « plus lourde que l'acier ». Ce qui change avec une fuite, c'est le contenu de la coque : l'air est remplacé par de l'eau. Réponse A.", "C": "Mauvaise réponse. C'est l'inverse : avec une fuite, le navire « stops pushing enough water aside », il déplace moins d'eau, pas plus, et c'est pour ça qu'il coule. Réponse A."}}], "transcript": ["Student: Ms. Okafor, I don't get it. A steel ship weighs thousands of tons. How can it float when a small steel bolt sinks straight to the bottom?", "Teacher: Good question, and it's the one that confused people for centuries. It's not about how heavy something is. It's about how much water it pushes out of the way. We call that displacement.", "Student: Displacement. So the ship pushes water away?", "Teacher: Exactly. When you put an object in water, it pushes some water aside, and that water pushes back up on the object. If the object pushes aside an amount of water that weighs more than the object itself, the object floats. If it pushes aside less, it sinks.", "Student: But the bolt and the ship are both steel.", "Teacher: Right, but think about the shape. A bolt is a solid lump. It pushes aside only a tiny bit of water, much less than its own weight, so it sinks. A ship is hollow. Its hull is shaped like a huge bowl full of air, so it pushes aside an enormous amount of water. That water weighs more than the ship, and the ship floats.", "Student: So if you filled the ship with water, it would sink?", "Teacher: That's exactly what happens when a ship springs a leak. The air gets replaced by water, the ship stops pushing enough water aside, and down it goes."]}, {"id": "P4_14-16", "part": 4, "audio": "audio/tb2/P4_dialogue2_Q14-16.mp3", "instruction": "You will hear a conversation in a classroom, followed by three questions. The questions and answer choices are shown on the screen while they are read. Press play when you are ready: you can listen only once.", "intro": "Listen to this conversation. You will hear a teacher and a student talking in a social studies classroom. Listen carefully.", "questions": [{"n": 14, "q": "What is the discussion mainly about?", "options": {"A": "How the railroads were built.", "B": "Why the United States adopted time zones.", "C": "How clocks were invented."}, "answer": "B", "feedback": {"A": "Mauvaise réponse. Les chemins de fer sont au centre de l'explication, mais on ne parle jamais de leur construction. Ils apparaissent comme la cause du problème (des horaires impossibles) et de la solution (les quatre zones). Le sujet, c'est la question de l'élève : pourquoi les États-Unis ont des fuseaux horaires. Réponse B.", "B": "Bonne réponse. L'élève demande « why does the United States have four different time zones? », et le prof raconte comment on est passé de l'heure locale de chaque ville aux quatre zones de 1883, puis à la loi de 1918.", "C": "Mauvaise réponse. L'invention des horloges n'est jamais abordée. Le prof parle de l'heure de chaque ville, des horaires de train et de la création des fuseaux horaires, pas de la fabrication des horloges. Réponse B."}}, {"n": 15, "q": "Why was local time a problem for the railroads?", "options": {"A": "Train schedules were hard to print and trains could collide.", "B": "The sun rose at different times in each town.", "C": "Passengers did not own watches."}, "answer": "A", "feedback": {"A": "Bonne réponse. Le prof donne deux conséquences : « Printing a schedule was a nightmare, and worse, two trains could end up on the same track because their crews were using different clocks ». Des horaires impossible

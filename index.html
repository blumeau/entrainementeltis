satisfait de ce qu'il a fait.", "C": "Mauvaise réponse. Aucune colère dans le texte : il regarde son travail (« the path was straight and clean ») et il sourit. Réponse B.", "D": "Mauvaise réponse. Avec Mr. Alvarez, c'est un échange amical : le voisin lève sa tasse, Daniel lève sa pelle. Aucune gêne. Réponse B."}}, {"n": 27, "q": "Why does the author mention the single line of cat prints in the snow?", "options": {"A": "to show that nobody had walked on the snow yet", "B": "to explain why Daniel woke up early", "C": "to tell readers that the snow was still falling", "D": "to show that Daniel has a pet"}, "answer": "A", "feedback": {"A": "Bonne réponse. « Untouched except for a single line of cat prints » : la neige est intacte, sauf une ligne de traces de chat. Ça montre que personne n'a encore marché dessus : Daniel est le premier dehors.", "B": "Mauvaise réponse. Il se réveille tôt parce qu'il a pensé à la neige la veille (« Then he remembered: the snow »), pas à cause d'un chat. Réponse A.", "C": "Mauvaise réponse. Le texte dit le contraire : « The snow had stopped falling ». Les traces montrent que la neige est intacte, pas qu'elle tombe encore. Réponse A.", "D": "Mauvaise réponse. Rien ne dit que le chat est à Daniel. Les traces servent à décrire la neige : « untouched except for a single line of cat prints ». Réponse A."}}]}, {"id": "R2_28", "part": 3, "passage": ["When people watch a violinist perform a difficult piece without a single mistake, they often say the same thing: \"She is so talented.\" The word suggests that the musician was born with a gift that others do not have. Researchers who study expert performers have found something different. Talent may decide where a person starts, but practice decides how far that person goes.", "The key is not simply the number of hours. Two students can sit at a piano for the same amount of time and improve at very different rates. The difference is in what they do with those hours. One student plays the pieces she already knows, enjoying the sound. The other works on the three measures she always gets wrong, slowly, again and again, until her fingers remember them. Researchers call the second kind of work <u>deliberate<\/u> practice, and it is uncomfortable by design. It lives at the edge of what a person can do.", "A piano teacher named Harold Bennett kept a card taped to his piano for his students to read while they waited for their lessons:", {"quote": ["Play what you know,", "and you will stay where you are.", "Play what you cannot,", "and the piano will move."]}, "His students joked that pianos do not move. But the message stayed with them. Comfortable practice feels good and changes little. Difficult practice feels bad and changes everything. The musicians who became professionals were not necessarily the ones with the most natural ability. They were the ones who kept choosing the hard measures."], "questions": [{"n": 28, "q": "What is the main purpose of the passage?", "options": {"A": "to describe how to play the violin", "B": "to show that talented people do not need to practice", "C": "to explain why the kind of practice matters more than talent", "D": "to encourage people to take piano lessons"}, "answer": "C", "feedback": {"A": "Mauvaise réponse. Le violon n'est qu'un exemple dans la première phrase. Le texte ne donne aucune technique de jeu. Réponse C.", "B": "Mauvaise réponse. C'est le contraire du message : « Talent may decide where a person starts, but practice decides how far that person goes ». Réponse C.", "C": "Bonne réponse. Le texte oppose talent et pratique (« practice decides how far that person goes »), puis explique que ce qui compte, c'est le type de pratique : travailler ce qu'on ne sait pas faire. C'est le but de tout le passage.", "D": "Mauvaise réponse. Le piano sert d'exemple, mais l'auteur ne conseille pas de prendre des cours. Il explique comment on progresse. Réponse C."}}, {"n": 29, "q": "In this passage, what does the moving piano symbolize?", "options": {"A": "a student who changes teachers", "B": "the progress that comes from difficult practice", "C": "an instrument that is broken", "D": "a concert in a different city"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. Il n'est jamais question de changer de professeur. Le piano « bouge » quand on joue ce qu'on ne sait pas encore jouer : c'est une image du progrès. Réponse B.", "B": "Bonne réponse. Sur la carte, « play what you know, and you will stay where you are » s'oppose à « play what you cannot, and the piano will move » : rester sur place contre avancer. Le piano qui bouge symbolise le progrès que donne la pratique difficile.", "C": "Mauvaise réponse. Rien n'est cassé. Les élèves plaisantent que les pianos ne bougent pas, mais l'image signifie que l'élève progresse. Réponse B.", "D": "Mauvaise réponse. Aucun concert ni déplacement dans le texte. Le piano qui bouge est une image : « Play what you cannot, and the piano will move » = on avance. Réponse B."}}, {"n": 30, "q": "In the second paragraph, what does the underlined word <u>deliberate<\/u> mean?", "options": {"A": "accidental", "B": "quick and easy", "C": "done on purpose, with a clear goal", "D": "performed in front of an audience"}, "answer": "C", "feedback": {"A": "Mauvaise réponse. « Accidental » = accidentel, c'est le contraire. La pratique « deliberate », c'est celle où l'élève choisit volontairement de travailler les trois mesures qu'elle rate. Réponse C.", "B": "Mauvaise réponse. Le texte dit l'inverse : cette pratique « is uncomfortable by design » (inconfortable par nature). Réponse C.", "C": "Bonne réponse. « Deliberate » = délibéré, fait exprès, avec un but précis. L'exemple le montre : travailler « the three measures she always gets wrong, slowly, again and again ».", "D": "Mauvaise réponse. Il n'est pas question de public ici, mais d'entraînement volontaire et ciblé. Réponse C."}}, {"n": 31, "q": "The author uses Mr. Bennett's card to help explain what happens if ___.", "options": {"A": "you only practice what you already know", "B": "you wait too long for your lesson", "C": "you play the violin instead of the piano", "D": "you practice with a teacher"}, "answer": "A", "feedback": {"A": "Bonne réponse. La carte dit : « Play what you know, and you will stay where you are », et l'auteur l'explique ensuite : « Comfortable practice feels good and changes little ». Si tu ne joues que ce que tu sais déjà, tu ne progresses pas.", "B": "Mauvaise réponse. Les élèves lisent la carte en attendant leur cours, mais la carte ne parle pas de l'attente. Elle parle de ce qu'on choisit de jouer. Réponse A.", "C": "Mauvaise réponse. Le violon n'apparaît qu'au premier paragraphe, sans rapport avec la carte. Réponse A.", "D": "Mauvaise réponse. La carte ne dit rien sur le fait de travailler avec ou sans professeur. Elle oppose jouer ce qu'on sait et jouer ce qu'on ne sait pas. Réponse A."}}]}, {"id": "R2_32", "part": 3, "passage": ["Every day, millions of drivers stop at red lights without thinking about who invented them. One of the people responsible was Garrett Morgan, an inventor who left school after the sixth grade and spent his life solving practical problems. Garrett Morgan was born in 1877 in Paris, Kentucky. His parents had been enslaved before the Civil War, and the family had little money. As a teenager, he moved north to Cincinnati, Ohio, and later to Cleveland, where he found work repairing sewing machines. He was curious about how things worked, and he soon opened his own repair shop. Because he had left school so early, he hired a tutor to help him improve his reading and writing.", "In 1914, Morgan patented a \"safety hood,\" a device that allowed a person to breathe in a room full of smoke or dangerous gases. Two years later, an explosion trapped workers in a tunnel under Lake Erie, far below the surface. Rescuers could not reach them because of the poisonous gases. Morgan and his brother put on the hoods, went into the tunnel, and carried out several of the men. Newspapers reported the rescue, and fire departments across the country ordered the device. However, when some buyers learned that the inventor was Black, they canceled their orders.", "Morgan did not <u>give up<\/u>. After witnessing a serious accident between a car and a horse-drawn carriage at a busy intersection, he designed a traffic signal with a third position that warned drivers to slow down before the light changed. He received a patent in 1923 and later sold the rights to the General Electric Company. His idea of a warning signal is still used in the yellow light today. Morgan continued inventing until his death in 1963. Today he is remembered not only for his inventions, but for the courage he showed on the day he walked into the tunnel."], "questions": [{"n": 32, "q": "What is this text mainly about?", "options": {"A": "the city of Cleveland", "B": "working conditions in tunnels", "C": "the history of traffic lights", "D": "a practical inventor who overcame obstacles"}, "answer": "D", "feedback": {"A": "Mauvaise réponse. Cleveland est seulement la ville où il s'installe. Le texte parle de lui, pas de la ville. Réponse D.", "B": "Mauvaise réponse. Le tunnel sous le lac Érié est l'épisode du sauvetage, pas le sujet du texte. Réponse D.", "C": "Mauvaise réponse. Le feu de circulation n'occupe que le dernier paragraphe. Le texte raconte la vie de Garrett Morgan : ses débuts, sa cagoule de protection, le sauvetage, le feu tricolore. Réponse D.", "D": "Bonne réponse. Le texte suit un inventeur (« an inventor who… spent his life solving practical problems ») qui a quitté l'école tôt, s'est fait aider par un tuteur, a vu des commandes annulées à cause de sa couleur de peau et « did not give up ». C'est le portrait d'un inventeur qui surmonte des obstacles."}}, {"n": 33, "q": "Why did Morgan hire a tutor?", "options": {"A": "He had left school at an early age.", "B": "He wanted to become a teacher.", "C": "He needed help to write his patent.", "D": "His repair shop was losing money."}, "answer": "A", "feedback": {"A": "Bonne réponse. « Because he had left school so early, he hired a tutor to help him improve his reading and writing. » Il avait quitté l'école après la sixième année (« after the sixth grade »).", "B": "Mauvaise réponse. Rien n'indique qu'il voulait enseigner. Le texte dit : « Because he had left school so early, he hired a tutor to help him improve his reading and writing ». Réponse A.", "C": "Mauvaise réponse. Le brevet arrive plus tard dans le texte (1914) et n'est pas lié au tuteur. Réponse A.", "D": "Mauvaise réponse. Le texte ne dit pas que son atelier perdait de l'argent ; au contraire, il l'ouvre avec succès. Le tuteur est lié à sa scolarité écourtée. Réponse A."}}, {"n": 34, "q": "In paragraph 3, what does the underlined phrase <u>give up<\/u> mean?", "options": {"A": "to donate something to others", "B": "to stop trying", "C": "to climb to a higher place", "D": "to sell an invention"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. « Give » seul peut vouloir dire donner, mais « give up » est une expression qui signifie abandonner. Le contexte le montre : après les commandes annulées, il continue et invente le feu de circulation. Réponse B.", "B": "Bonne réponse. « To give up » = abandonner, cesser d'essayer. « Morgan did not give up » : malgré les commandes annulées, il n'a pas abandonné et a inventé autre chose.", "C": "Mauvaise réponse. « Up » ne veut pas dire ici monter. « Give up » est une expression figée : abandonner. Réponse B.", "D": "Mauvaise réponse. La vente à General Electric vient après, mais « give up » ne veut pas dire vendre. Ça veut dire abandonner, ce qu'il n'a pas fait. Réponse B."}}, {"n": 35, "q": "According to the text, what challenge did Morgan face after the rescue?", "options": {"A": "His safety hood stopped working properly.", "B": "Some customers canceled their orders because of his race.", "C": "He could not get a patent for his device.", "D": "Newspapers refused to report the story."}, "answer": "B", "feedback": {"A": "Mauvaise réponse. La cagoule a fonctionné : elle a permis de sortir plusieurs hommes du tunnel. Réponse B.", "B": "Bonne réponse. « However, when some buyers learned that the inventor was Black, they canceled their orders. » Après le sauvetage, certains acheteurs ont annulé leurs commandes en apprenant que l'inventeur était noir.", "C": "Mauvaise réponse. Il avait déjà le brevet de la cagoule (« In 1914, Morgan patented a safety hood ») et il obtient ensuite celui du feu de circulation en 1923. Réponse B.", "D": "Mauvaise réponse. C'est l'inverse : « Newspapers reported the rescue ». Réponse B."}}]}]}, {"id": "tb3r", "mode": "reading", "label": "Test blanc 3 · Reading", "desc": "Compréhension écrite : 35 questions, 3 parties.", "parts": [{"part": 1, "title": "Academic vocabulary", "questions": "1-16"}, {"part": 2, "title": "Grammar and sentence structure", "questions": "17-23"}, {"part": 3, "title": "Reading comprehension", "questions": "24-35"}], "exercises": [{"id": "R3_1", "part": 1, "questions": [{"n": 1, "q": "The nurse ___ the patient's temperature every two hours during the night.", "options": {"A": "cured", "B": "checked", "C": "ignored", "D": "invented"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. « Cured » = a guéri. On ne guérit pas une température. Réponse B, « checked ».", "B": "Bonne réponse. « Checked » = a vérifié, contrôlé. L'infirmière a contrôlé la température du patient toutes les deux heures.", "C": "Mauvaise réponse. « Ignored » = a ignoré. Une infirmière ne ignore pas la température d'un patient « toutes les deux heures ». Réponse B, « checked ».", "D": "Mauvaise réponse. « Invented » = a inventé. On n'invente pas une température. Réponse B, « checked »."}}]}, {"id": "R3_2", "part": 1, "questions": [{"n": 2, "q": "The city council ___ the plan to build a new stadium because it was far too expensive.", "options": {"A": "rejected", "B": "praised", "C": "accepted", "D": "designed"}, "answer": "A", "feedback": {"A": "Bonne réponse. « Rejected » = a rejeté, refusé. Le conseil municipal a rejeté le projet de stade parce qu'il était beaucoup trop cher. La cause (« because… expensive ») donne l'indice.", "B": "Mauvaise réponse. « Praised » = a félicité, a fait l'éloge de. On ne félicite pas un projet trop cher. Réponse A, « rejected ».", "C": "Mauvaise réponse. « Accepted » = a accepté. La raison donnée (« far too expensive ») indique un refus, pas une acceptation. Réponse A, « rejected ».", "D": "Mauvaise réponse. « Designed » = a conçu. On ne conçoit pas un projet « parce qu'il est trop cher ». Réponse A, « rejected »."}}]}, {"id": "R3_3", "part": 1, "questions": [{"n": 3, "q": "The ___ child asked question after question during the museum visit.", "options": {"A": "shy", "B": "curious", "C": "sleepy", "D": "silent"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. « Shy » = timide. Un enfant timide ne pose pas question sur question. Réponse B, « curious ».", "B": "Bonne réponse. « Curious » = curieux. L'enfant curieux a posé question sur question pendant la visite du musée.", "C": "Mauvaise réponse. « Sleepy » = somnolent. Un enfant qui a sommeil ne pose pas de questions. Réponse B, « curious ».", "D": "Mauvaise réponse. « Silent » = silencieux. C'est le contraire d'un enfant qui pose des questions. Réponse B, « curious »."}}]}, {"id": "R3_4", "part": 1, "questions": [{"n": 4, "q": "The ___ of the old bridge took two years and cost several million dollars.", "options": {"A": "collapse", "B": "restoration", "C": "discovery", "D": "election"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. « Collapse » = effondrement. Un effondrement ne dure pas deux ans et ne « coûte » pas des millions au sens d'un chantier. Réponse B, « restoration ».", "B": "Bonne réponse. « Restoration » = restauration, remise en état. La restauration du vieux pont a pris deux ans et coûté plusieurs millions.", "C": "Mauvaise réponse. « Discovery » = découverte. On ne découvre pas un pont pendant deux ans. Réponse B, « restoration ».", "D": "Mauvaise réponse. « Election » = élection. Aucun rapport avec un pont. Réponse B, « restoration »."}}]}, {"id": "R3_5", "part": 1, "questions": [{"n": 5, "q": "In biology, animals that eat only plants are called ___.", "options": {"A": "predators", "B": "mammals", "C": "reptiles", "D": "herbivores"}, "answer": "D", "feedback": {"A": "Mauvaise réponse. « Predators » = prédateurs, des animaux qui chassent d'autres animaux. C'est presque le contraire. Réponse D, « herbivores ».", "B": "Mauvaise réponse. « Mammals » = mammifères. Certains mammifères mangent des plantes, d'autres de la viande ; le mot ne décrit pas le régime alimentaire. Réponse D, « herbivores ».", "C": "Mauvaise réponse. « Reptiles » = reptiles. C'est une classe d'animaux, pas un régime alimentaire. Réponse D, « herbivores ».", "D": "Bonne réponse. « Herbivores » = herbivores, les animaux qui ne mangent que des plantes. Vocabulaire du cours de biologie (herbivore / carnivore / omnivore)."}}]}, {"id": "R3_6", "part": 1, "questions": [{"n": 6, "q": "The team's ___ during the final game impressed even the opposing coach.", "options": {"A": "absence", "B": "defeat", "C": "silence", "D": "effort"}, "answer": "D", "feedback": {"A": "Mauvaise réponse. « Absence » = absence. Une équipe absente ne peut pas impressionner un coach. Réponse D, « effort ».", "B": "Mauvaise réponse. « Defeat » = défaite. Une défaite n'impressionne pas. Réponse D, « effort ».", "C": "Mauvaise réponse. « Silence » = silence. Le silence d'une équipe n'impressionne pas un coach. Réponse D, « effort ».", "D": "Bonne réponse. « Effort » = effort, engagement. L'effort de l'équipe pendant la finale a impressionné même le coach adverse."}}]}, {"id": "R3_7", "part": 1, "questions": [{"n": 7, "q": "After the earthquake, engineers ___ the bridge for cracks before allowing traffic to cross.", "options": {"A": "painted", "B": "avoided", "C": "inspected", "D": "designed"}, "answer": "C", "feedback": {"A": "Mauvaise réponse. « Painted » = ont peint. On ne peint pas un pont « pour chercher des fissures ». Réponse C, « inspected ».", "B": "Mauvaise réponse. « Avoided » = ont évité. Éviter le pont ne permet pas de vérifier s'il est sûr. Réponse C, « inspected ».", "C": "Bonne réponse. « Inspected » = ont inspecté. Après le séisme, les ingénieurs ont inspecté le pont pour chercher des fissures avant de rouvrir la circulation.", "D": "Mauvaise réponse. « Designed » = ont conçu. Le pont existe déjà ; après un séisme, on le vérifie. Réponse C, « inspected »."}}]}, {"id": "R3_8", "part": 1, "questions": [{"n": 8, "q": "He spoke so ___ that the people in the back row could not hear a word.", "options": {"A": "softly", "B": "clearly", "C": "proudly", "D": "angrily"}, "answer": "A", "feedback": {"A": "Bonne réponse. « Softly » = doucement, à voix basse. Il parlait si bas que les gens du dernier rang n'entendaient pas un mot.", "B": "Mauvaise réponse. « Clearly » = clairement. Si on parle clairement, le fond de la salle entend. Réponse A, « softly ».", "C": "Mauvaise réponse. « Proudly » = fièrement. Parler fièrement n'empêche pas d'être entendu. Réponse A, « softly ».", "D": "Mauvaise réponse. « Angrily » = avec colère. Quelqu'un qui parle avec colère est généralement entendu jusqu'au fond. Réponse A, « softly »."}}]}, {"id": "R3_9", "part": 1, "questions": [{"n": 9, "q": "The hikers followed the stream until it ___ into a wide, quiet lake.", "options": {"A": "flowed", "B": "climbed", "C": "vanished", "D": "burned"}, "answer": "A", "feedback": {"A": "Bonne réponse. « Flowed » = coulait, se jetait. Les randonneurs ont suivi le ruisseau jusqu'à ce qu'il se jette dans un grand lac calme.", "B": "Mauvaise réponse. « Climbed » = a grimpé. Un ruisseau ne grimpe pas. Réponse A, « flowed ».", "C": "Mauvaise réponse. « Vanished » = a disparu. S'il avait disparu, il ne se jetterait pas « dans un lac ». Réponse A, « flowed ».", "D": "Mauvaise réponse. « Burned » = a brûlé. De l'eau ne brûle pas. Réponse A, « flowed »."}}]}, {"id": "R3_10", "part": 1, "questions": [{"n": 10, "q": "Her guess about the number of marbles in the jar was ___ by only two.", "options": {"A": "out", "B": "behind", "C": "off", "D": "away"}, "answer": "C", "feedback": {"A": "Mauvaise réponse. « Out by » est britannique ; en anglais américain, on dit « off by ». Réponse C.", "B": "Mauvaise réponse. « Behind by » se dit d'un retard ou d'un score. Pour une erreur d'estimation, c'est « off by ». Réponse C.", "C": "Bonne réponse. « To be off by X » = se tromper de X. Elle s'est trompée de seulement deux billes. Expression courante : « my watch is off by two minutes ».", "D": "Mauvaise réponse. « Away by » n'existe pas dans ce sens. Réponse C, « off by »."}}]}, {"id": "R3_11", "part": 1, "questions": [{"n": 11, "q": "The scientist's ___ was so important that she received an international award.", "options": {"A": "absence", "B": "complaint", "C": "schedule", "D": "discovery"}, "answer": "D", "feedback": {"A": "Mauvaise réponse. « Absence » = absence. On ne reçoit pas un prix pour une absence. Réponse D, « discovery ».", "B": "Mauvaise réponse. « Complaint » = plainte, réclamation. On ne récompense pas une plainte. Réponse D, « discovery ».", "C": "Mauvaise réponse. « Schedule » = emploi du temps. Un emploi du temps ne vaut pas un prix. Réponse D, « discovery ».", "D": "Bonne réponse. « Discovery » = découverte. Sa découverte était si importante qu'elle a reçu un prix international."}}]}, {"id": "R3_12", "part": 1, "questions": [{"n": 12, "q": "A ___ diet includes fruits, vegetables, grains, and protein in the right amounts.", "options": {"A": "heavy", "B": "sweet", "C": "balanced", "D": "expensive"}, "answer": "C", "feedback": {"A": "Mauvaise réponse. « Heavy » = lourd. Un repas lourd n'est pas ce que décrit la phrase. Réponse C, « balanced ».", "B": "Mauvaise réponse. « Sweet » = sucré. Une alimentation sucrée ne contient pas « les bonnes quantités » de légumes et de protéines. Réponse C, « balanced ».", "C": "Bonne réponse. « Balanced » = équilibré. Une alimentation équilibrée comprend fruits, légumes, céréales et protéines dans les bonnes quantités.", "D": "Mauvaise réponse. « Expensive » = cher. Le prix n'a rien à voir avec la liste d'aliments. Réponse C, « balanced »."}}]}, {"id": "R3_13", "part": 1, "questions": [{"n": 13, "q": "The students ___ the classroom with posters and balloons for the open house.", "options": {"A": "abandoned", "B": "measured", "C": "divided", "D": "decorated"}, "answer": "D", "feedback": {"A": "Mauvaise réponse. « Abandoned » = ont abandonné. On n'abandonne pas une salle « avec des affiches et des ballons ». Réponse D, « decorated ».", "B": "Mauvaise réponse. « Measured » = ont mesuré. On ne mesure pas une salle avec des ballons. Réponse D, « decorated ».", "C": "Mauvaise réponse. « Divided » = ont divisé. Des affiches et des ballons ne divisent pas une salle. Réponse D, « decorated ».", "D": "Bonne réponse. « Decorated » = ont décoré. Les élèves ont décoré la salle avec des affiches et des ballons pour la journée portes ouvertes."}}]}, {"id": "R3_14", "part": 1, "questions": [{"n": 14, "q": "The judge praised the young lawyer's ___ in handling such a difficult case.", "options": {"A": "fear", "B": "skill", "C": "luck", "D": "age"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. « Fear » = peur. On ne félicite pas quelqu'un pour sa peur. Réponse B, « skill ».", "B": "Bonne réponse. « Skill » = compétence, habileté. Le juge a salué la compétence du jeune avocat dans une affaire si difficile.", "C": "Mauvaise réponse. « Luck » = chance. On félicite quelqu'un pour son travail, pas pour sa chance. Réponse B, « skill ».", "D": "Mauvaise réponse. « Age » = âge. On ne félicite pas quelqu'un pour son âge. Réponse B, « skill »."}}]}, {"id": "R3_15", "part": 1, "questions": [{"n": 15, "q": "The ___ offices are on the second floor, next to the library.", "options": {"A": "teachers'", "B": "teachers", "C": "teachers's", "D": "teacher"}, "answer": "A", "feedback": {"A": "Bonne réponse. « The teachers' offices » = les bureaux des professeurs. Possessif d'un pluriel régulier : apostrophe après le -s.", "B": "Mauvaise réponse. « The teachers offices » n'est pas correct : il faut l'apostrophe pour dire « les bureaux des professeurs ». Réponse A, « teachers' ».", "C": "Mauvaise réponse. « Teachers's » n'existe pas : pour un pluriel en -s, on ajoute seulement l'apostrophe. Réponse A, « teachers' ».", "D": "Mauvaise réponse. « The teacher offices » n'est pas correct : il manque le possessif. Réponse A, « teachers' »."}}]}, {"id": "R3_16", "part": 1, "questions": [{"n": 16, "q": "This chapter is ___ than the last one, so take your time.", "options": {"A": "most difficult", "B": "the most difficult", "C": "more difficult", "D": "difficulter"}, "answer": "C", "feedback": {"A": "Mauvaise réponse. « Most difficult » est un superlatif ; avec « than », il faut un comparatif : « more difficult ». Réponse C.", "B": "Mauvaise réponse. « The most difficult » est le superlatif (le plus difficile) ; il ne va pas avec « than ». Réponse C, « more difficult ».", "C": "Bonne réponse. « More difficult than » = plus difficile que. Comparatif d'un adjectif long : « more » + adjectif.", "D": "Mauvaise réponse. « Difficulter » n'existe pas : « difficult » est un adjectif long, son comparatif se forme avec « more ». Réponse C."}}]}, {"id": "R3_17", "part": 2, "questions": [{"n": 17, "q": "___ the students finished their projects yet?", "options": {"A": "Did", "B": "Has", "C": "Do", "D": "Have"}, "answer": "D", "feedback": {"A": "Mauvaise réponse. « Did » ne va pas avec « finished » + « yet » : « yet » appelle le present perfect (« Have… finished… yet? »). Réponse D.", "B": "Mauvaise réponse. « Has » va avec un sujet singulier ; « the students » est pluriel → « Have ». Réponse D.", "C": "Mauvaise réponse. « Do the students finished » est impossible : « finished » est un participe passé, il demande l'auxiliaire « have ». Réponse D.", "D": "Bonne réponse. Present perfect avec « yet » : « Have the students finished their projects yet? » = Les élèves ont-ils déjà fini leurs projets ? Sujet pluriel → « have »."}}]}, {"id": "R3_18", "part": 2, "questions": [{"n": 18, "q": "___ far is the stadium from the school?", "options": {"A": "What", "B": "How", "C": "Which", "D": "Where"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. « What far » n'existe pas. Pour une distance, on dit « How far ». Réponse B.", "B": "Bonne réponse. « How far is… from…? » = À quelle distance… ? « How » + adjectif (far, long, old, much) pour demander une quantité.", "C": "Mauvaise réponse. « Which far » n'a pas de sens. Réponse B, « How far ».", "D": "Mauvaise réponse. « Where » = où, mais « where far » n'existe pas. Réponse B, « How far »."}}]}, {"id": "R3_19", "part": 2, "questions": [{"n": 19, "q": "The coach wanted ___ to practice every morning before school.", "options": {"A": "us", "B": "our", "C": "we", "D": "ours"}, "answer": "A", "feedback": {"A": "Bonne réponse. « Want someone to do something » : le pronom est complément → « us ». Le coach voulait que nous nous entraînions tous les matins.", "B": "Mauvaise réponse. « Our » est un possessif, il doit être suivi d'un nom. Réponse A, « us ».", "C": "Mauvaise réponse. « We » est un pronom sujet. Après « wanted », il faut un pronom complément : « wanted us to practice ». Réponse A.", "D": "Mauvaise réponse. « Ours » = le nôtre. « Wanted ours to practice » n'a pas de sens. Réponse A, « us »."}}]}, {"id": "R3_20", "part": 2, "questions": [{"n": 20, "q": "One of the windows ___ broken during the storm last night.", "options": {"A": "were", "B": "are", "C": "was", "D": "being"}, "answer": "C", "feedback": {"A": "Mauvaise réponse. Le sujet est « One » (singulier), pas « the windows ». Singulier + passé → « was ». Réponse C.", "B": "Mauvaise réponse. « Are » est au présent et au pluriel ; la phrase est au passé (« last night ») avec un sujet singulier. Réponse C, « was ».", "C": "Bonne réponse. « One of the windows was broken » : le sujet est « one », donc singulier, et « last night » appelle le passé → « was ». Même piège que « Each of the students has » ou « Neither… is ».", "D": "Mauvaise réponse. « Being » tout seul ne peut pas être le verbe conjugué de la phrase. Réponse C, « was »."}}]}, {"id": "R3_21", "part": 2, "questions": [{"n": 21, "q": "The lecture was so ___ that half the class fell asleep.", "options": {"A": "bored", "B": "bore", "C": "boring", "D": "boredom"}, "answer": "C", "feedback": {"A": "Mauvaise réponse. « Bored » décrit la personne qui s'ennuie (« the students were bored »). Pour décrire la chose qui provoque l'ennui (la conférence), c'est « boring ». Réponse C.", "B": "Mauvaise réponse. « Bore » est un verbe (ennuyer) ou un nom (un raseur) ; après « so », il faut un adjectif. Réponse C, « boring ».", "C": "Bonne réponse. « Boring » = ennuyeux : l'adjectif en -ing décrit ce qui provoque le sentiment. La conférence était si ennuyeuse que la moitié de la classe s'est endormie.", "D": "Mauvaise réponse. « Boredom » est un nom (l'ennui). Après « was so », il faut un adjectif. Réponse C, « boring »."}}]}, {"id": "R3_22", "part": 2, "questions": [{"n": 22, "q": "If it rains tomorrow, the game ___ postponed.", "options": {"A": "will be", "B": "was", "C": "would be", "D": "is being"}, "answer": "A", "feedback": {"A": "Bonne réponse. Conditionnel de type 1 : « If + présent, … will + base verbale ». S'il pleut demain, le match sera reporté.", "B": "Mauvaise réponse. « Was » est au passé ; la phrase parle de demain. Réponse A, « will be ».", "C": "Mauvaise réponse. « Would be » irait avec « If it rained » (situation imaginaire). Ici « If it rains » est au présent : conditionnel de type 1 → « will be ». Réponse A.", "D": "Mauvaise réponse. « Is being postponed » décrit quelque chose en train de se passer maintenant, pas une conséquence future. Réponse A, « will be »."}}]}, {"id": "R3_23", "part": 2, "questions": [{"n": 23, "q": "Maria avoided ___ the question by changing the subject.", "options": {"A": "to answer", "B": "answer", "C": "answering", "D": "answered"}, "answer": "C", "feedback": {"A": "Mauvaise réponse. « Avoid » n'est jamais suivi de « to + verbe ». On dit « avoid doing something ». Réponse C, « answering ».", "B": "Mauvaise réponse. Après « avoid », on ne met pas la base verbale. Il faut la forme en -ing. Réponse C, « answering ».", "C": "Bonne réponse. « Avoid » + verbe en -ing : « avoided answering the question » = a évité de répondre à la question.", "D": "Mauvaise réponse. « Avoided answered » n'est pas une construction possible. Réponse C, « answering »."}}]}, {"id": "R3_24", "part": 3, "passage": ["Jonah stood in the wings with the script rolled so tightly in his fist that the pages had gone soft. On the other side of the heavy black curtain, the auditorium hummed. He could hear chairs creaking, a baby fussing somewhere near the back, and his mother's laugh, which he would have recognized anywhere. The stage lights threw a thin line of gold under the curtain and across the toes of his borrowed shoes.", "He had one line. One. Mr. Patel had given it to him in September, when the rest of the cast already knew their parts, and for eight weeks Jonah had whispered it on the bus, in the shower, and under his breath during math. \"The road to the castle is closed, my lord.\" Nine words. Now, with four minutes to go, he could not find them. His mind was a white room with nothing in it.", "\"Breathe,\" said Keisha, who played the queen and had been in every play since fourth grade. She did not look at him; she was fixing a pin in her crown. \"You'll remember when you walk out. Everybody does.\" Jonah nodded. His mouth was so dry that he was not sure he could speak at all.", "The music changed. The curtain shivered and began to rise, and the gold line became a flood. Jonah walked out into it. He saw nothing but light and the dark shape of the audience beyond it. The king turned toward him and waited. For one terrible second there was only silence. Then the words arrived, all nine of them, in the right order, and his voice was louder than he had ever heard it. Somebody near the back clapped once before remembering not to.", "Backstage afterward, Keisha bumped his shoulder with hers. \"Told you,\" she said. Jonah unrolled the script and looked at his line, and for the first time he thought it was a pretty good line. Next year, he decided, he would ask for two."], "questions": [{"n": 24, "q": "What is the main idea of this story?", "options": {"A": "A boy overcomes his nervousness and delivers his line in the play.", "B": "A boy forgets his line and ruins the school play.", "C": "A girl helps a boy fix his costume before a play.", "D": "A boy decides that he does not like acting."}, "answer": "A", "feedback": {"A": "Bonne réponse. Toute l'histoire suit Jonah de la panique en coulisses (« his mind was a white room ») à sa réplique réussie, puis à sa fierté (« a pretty good line »). Il surmonte son trac.", "B": "Mauvaise réponse. Il a peur d'oublier sa réplique, mais au moment voulu « the words arrived, all nine of them, in the right order ». Il ne rate rien. Réponse A.", "C": "Mauvaise réponse. Keisha arrange sa propre couronne, pas le costume de Jonah, et elle lui dit juste de respirer. Réponse A.", "D": "Mauvaise réponse. C'est l'inverse : à la fin, « next year, he decided, he would ask for two » lines. Il veut continuer. Réponse A."}}, {"n": 25, "q": "How does the reader know that Jonah was very nervous?", "options": {"A": "because his mother was laughing in the audience", "B": "because he had rolled the script so tightly that the pages had gone soft", "C": "because Keisha had been in every play since fourth grade", "D": "because the stage lights were gold"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. Le rire de sa mère est un détail sur le public, pas sur l'état de Jonah. Réponse B.", "B": "Bonne réponse. « The script rolled so tightly in his fist that the pages had gone soft » : il serre le script si fort que les pages sont ramollies. Le texte le confirme avec « his mouth was so dry » et « his mind was a white room ».", "C": "Mauvaise réponse. L'expérience de Keisha explique son calme à elle, pas la nervosité de Jonah. Réponse B.", "D": "Mauvaise réponse. La couleur des lumières décrit le décor, pas les émotions de Jonah. Réponse B."}}, {"n": 26, "q": "How does Jonah feel after the play?", "options": {"A": "relieved and proud of what he did", "B": "angry at Mr. Patel for giving him only one line", "C": "embarrassed because someone clapped at the wrong time", "D": "worried about next year's play"}, "answer": "A", "feedback": {"A": "Bonne réponse. Il relit sa réplique et la trouve bonne, et il décide d'en demander deux l'an prochain : il est soulagé et fier.", "B": "Mauvaise réponse. Aucune colère : à la fin, il trouve même que sa réplique est « a pretty good line ». Réponse A.", "C": "Mauvaise réponse. L'applaudissement isolé est raconté avec humour, et rien n'indique de la gêne chez Jonah. Réponse A.", "D": "Mauvaise réponse. Il n'est pas inquiet pour l'an prochain, au contraire : il veut deux répliques. Réponse A."}}, {"n": 27, "q": "Why does the author mention the thin line of gold under the curtain?", "options": {"A": "to show that the curtain was old and torn", "B": "to show how close Jonah was to going on stage", "C": "to explain why Jonah forgot his line", "D": "to tell readers that the play took place in the morning"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. Rien ne dit que le rideau est abîmé : la lumière passe simplement dessous. Réponse B.", "B": "Bonne réponse. La ligne de lumière sous le rideau, qui touche « the toes of his borrowed shoes », montre qu'il est à quelques centimètres de la scène. Plus tard, « the gold line became a flood » quand le rideau se lève.", "C": "Mauvaise réponse. Il oublie sa réplique à cause du trac, pas à cause de la lumière. Réponse B.", "D": "Mauvaise réponse. Ce sont les projecteurs de scène (« the stage lights »), pas le soleil ; l'heure n'est pas indiquée. Réponse B."}}]}, {"id": "R3_28", "part": 3, "passage": ["Many people believe that the best readers are the fastest ones. Speed-reading courses promise to double or triple the number of words a person can absorb in a minute. Yet teachers who work with strong readers notice something surprising: the students who understand the most are often the ones who slow down, stop, and go back.", "Consider a student reading a difficult chapter in a history textbook. One reader moves steadily from the first line to the last and closes the book with a feeling of accomplishment. Another reader stops at the end of the second paragraph, realizes that she has not understood why the treaty failed, and reads the paragraph again. The second reader finishes later, but she is the one who can explain the chapter the next day. Researchers call this habit <u>monitoring<\/u>: paying attention to your own understanding while you read.", "Ms. Okoro, a school librarian, kept a small card taped to the front desk for her students:", {"quote": ["A page read once", "is a door you walked past.", "A page read twice", "is a door you opened."]}, "Students sometimes complained that the card made reading sound like work. In a way, it does. Reading a page twice takes twice as long. But the first reading only tells you that the door exists; the second reading shows you what is behind it. The students who improved the most in her library were not the fastest readers. They were the ones who were willing to turn back a page."], "questions": [{"n": 28, "q": "What is the main purpose of the passage?", "options": {"A": "to describe the job of a school librarian", "B": "to advertise speed-reading courses", "C": "to explain why slowing down and rereading helps readers understand more", "D": "to compare history textbooks with novels"}, "answer": "C", "feedback": {"A": "Mauvaise réponse. La bibliothécaire n'apparaît qu'au troisième paragraphe, comme exemple. Le texte ne décrit pas son métier. Réponse C.", "B": "Mauvaise réponse. Les cours de lecture rapide sont cités au début pour être contredits : « the students who understand the most are often the ones who slow down ». Réponse C.", "C": "Bonne réponse. Du premier paragraphe (« slow down, stop, and go back ») à la conclusion (« willing to turn back a page »), le texte explique pourquoi relire et ralentir améliore la compréhension.", "D": "Mauvaise réponse. Le manuel d'histoire est un exemple ; aucun roman n'est mentionné. Réponse C."}}, {"n": 29, "q": "In this passage, what does a door symbolize?", "options": {"A": "the entrance to the library", "B": "a page that a student has skipped", "C": "the understanding that a reader can gain from a page", "D": "the end of a chapter"}, "answer": "C", "feedback": {"A": "Mauvaise réponse. La carte est sur le bureau de la bibliothèque, mais la porte est une image : la page lue une fois est une porte devant laquelle on passe, lue deux fois une porte qu'on ouvre. Réponse C.", "B": "Mauvaise réponse. Même une page lue une fois est « a door you walked past » ; la porte représente la page et ce qu'elle contient, pas une page sautée. Réponse C.", "C": "Bonne réponse. « The first reading only tells you that the door exists; the second reading shows you what is behind it » : la porte représente ce qu'on peut comprendre d'une page si on l'ouvre, c'est-à-dire si on la relit.", "D": "Mauvaise réponse. Rien ne lie la porte à la fin d'un chapitre. Réponse C."}}, {"n": 30, "q": "In the second paragraph, what does the underlined word <u>monitoring<\/u> mean?", "options": {"A": "reading as fast as possible", "B": "watching a screen", "C": "copying notes from a textbook", "D": "checking your own understanding"}, "answer": "D", "feedback": {"A": "Mauvaise réponse. C'est l'inverse : la lectrice qui « monitors » s'arrête et relit. Réponse D.", "B": "Mauvaise réponse. « Monitor » peut vouloir dire écran, mais ici c'est le verbe : surveiller sa compréhension. Réponse D.", "C": "Mauvaise réponse. Aucune prise de notes dans le texte. « Monitoring », c'est se demander si on a compris. Réponse D.", "D": "Bonne réponse. Le texte le définit juste après : « paying attention to your own understanding while you read » = surveiller sa propre compréhension."}}, {"n": 31, "q": "The author uses Ms. Okoro's card to help explain what happens if ___.", "options": {"A": "you read in a library", "B": "you borrow too many books", "C": "you complain about reading", "D": "you read a page only once"}, "answer": "D", "feedback": {"A": "Mauvaise réponse. Le lieu n'a pas d'importance ; la carte oppose lire une fois et lire deux fois. Réponse D.", "B": "Mauvaise réponse. La carte ne parle pas du nombre de livres, mais du nombre de lectures d'une même page. Réponse D.", "C": "Mauvaise réponse. Les plaintes des élèves viennent après la carte ; la carte elle-même parle de la lecture unique contre la relecture. Réponse D.", "D": "Bonne réponse. « A page read once is a door you walked past » : si on lit une page une seule fois, on sait que la porte existe mais on ne voit pas ce qu'il y a derrière."}}]}, {"id": "R3_32", "part": 3, "passage": ["Today, planting trees is one of the most common ways that communities fight soil erosion and climate change. Few people know that one of the first large tree-planting movements was started by a Kenyan scientist who paid village women a few cents for every seedling that survived. Wangari Maathai was born in 1940 in a farming village in the central highlands of Kenya. At that time, few girls in her region went to school, but her older brother asked their parents why she stayed home, and they agreed to send her. She was an excellent student, and in 1960 she won a scholarship to study biology in the United States.", "After earning two degrees in America, Maathai returned to Kenya and continued her studies. In 1971, she became the first woman in East Africa to receive a doctorate. As a professor at the University of Nairobi, she traveled to rural areas and noticed that the forests of her childhood were disappearing. Streams had dried up, the soil was washing away, and women had to walk farther every year to find firewood. In 1977, she founded the Green Belt Movement, which encouraged women to grow seedlings and plant them around their villages. The idea <u>took root<\/u> quickly, and within a few decades the movement had planted tens of millions of trees.", "The government did not welcome her work. When Maathai protested against plans to build a skyscraper in a public park in Nairobi, she was called a troublemaker, and she was arrested several times for organizing demonstrations. She refused to stop. In 2004, she became the first African woman to receive the Nobel Peace Prize, for showing that protecting the environment and defending democracy are connected. She died in 2011, but the Green Belt Movement continues, and the trees she helped plant still stand."], "questions": [{"n": 32, "q": "What is this text mainly about?", "options": {"A": "the causes of soil erosion in Kenya", "B": "a scientist who started a tree-planting movement", "C": "the history of the Nobel Peace Prize", "D": "the education of girls in Africa"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. L'érosion est l'un des problèmes qu'elle a observés, pas le sujet du texte. Le texte raconte sa vie et son mouvement. Réponse B.", "B": "Bonne réponse. Le texte suit Wangari Maathai : ses études, son doctorat, la création du Green Belt Movement, son opposition au gouvernement et son prix Nobel. C'est le portrait d'une scientifique qui a lancé un mouvement de plantation d'arbres.", "C": "Mauvaise réponse. Le prix Nobel est mentionné une fois, à la fin. Ce n'est pas le sujet. Réponse B.", "D": "Mauvaise réponse. La scolarisation des filles apparaît seulement au premier paragraphe, pour expliquer ses débuts. Réponse B."}}, {"n": 33, "q": "Why did Maathai's parents send her to school?", "options": {"A": "She won a scholarship to the United States.", "B": "Her brother asked why she stayed at home.", "C": "The government required all girls to attend.", "D": "She wanted to become a teacher."}, "answer": "B", "feedback": {"A": "Mauvaise réponse. La bourse vient plus tard, en 1960, après qu'elle est devenue une excellente élève. Réponse B.", "B": "Bonne réponse. « Her older brother asked their parents why she stayed home, and they agreed to send her. » C'est la question de son frère qui a décidé ses parents.", "C": "Mauvaise réponse. Au contraire, « few girls in her region went to school » : il n'y avait pas d'obligation. Réponse B.", "D": "Mauvaise réponse. Le texte ne dit rien d'un désir de devenir enseignante à cette époque. Réponse B."}}, {"n": 34, "q": "In paragraph 2, what does the underlined phrase <u>took root<\/u> mean?", "options": {"A": "was planted in the ground", "B": "required a lot of water", "C": "was rejected by the villagers", "D": "became established and began to grow"}, "answer": "D", "feedback": {"A": "Mauvaise réponse. Ce sont les arbres qui sont plantés, pas l'idée. « The idea took root » est une image : l'idée s'est implantée et a grandi. Réponse D.", "B": "Mauvaise réponse. L'expression est une image qui parle de l'idée, pas de l'arrosage des arbres. Réponse D.", "C": "Mauvaise réponse. C'est l'inverse : le mouvement a grandi rapidement. Réponse D.", "D": "Bonne réponse. « To take root » = s'enraciner, s'implanter. L'idée s'est vite installée et s'est développée, ce que confirme la suite : « within a few decades the movement had planted tens of millions of trees »."}}, {"n": 35, "q": "According to the text, what challenge did Maathai face because of her work?", "options": {"A": "She was arrested several times.", "B": "She could not find enough seedlings.", "C": "She lost her job at the university.", "D": "Women refused to plant trees."}, "answer": "A", "feedback": {"A": "Bonne réponse. « She was called a troublemaker, and she was arrested several times for organizing demonstrations. » Le gouvernement s'est opposé à elle.", "B": "Mauvaise réponse. Le texte ne mentionne aucun manque de plants ; au contraire, des dizaines de millions d'arbres ont été plantés. Réponse A.", "C": "Mauvaise réponse. Le texte ne dit pas qu'elle a perdu son poste. Réponse A.", "D": "Mauvaise réponse. C'est l'inverse : les femmes ont fait grandir le mouvement. Réponse A."}}]}]}, {"id": "tb4r", "mode": "reading", "label": "Test blanc 4 · Reading", "desc": "Compréhension écrite : 35 questions, 3 parties.", "parts": [{"part": 1, "title": "Academic vocabulary", "questions": "1-16"}, {"part": 2, "title": "Grammar and sentence structure", "questions": "17-23"}, {"part": 3, "title": "Reading comprehension", "questions": "24-35"}], "exercises": [{"id": "R4_1", "part": 1, "questions": [{"n": 1, "q": "Remember to ___ all of your sources at the end of the research paper.", "options": {"A": "recite", "B": "cite", "C": "incite", "D": "excite"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. « Recite » = réciter. On ne récite pas ses sources à la fin d'un devoir. Réponse B, « cite ».", "B": "Bonne réponse. « Cite » = citer (ses sources). Consigne classique pour un « research paper » au lycée américain : indiquer d'où viennent les informations.", "C": "Mauvaise réponse. « Incite » = inciter, pousser (à la violence, par exemple). Rien à voir avec des sources. Réponse B, « cite ».", "D": "Mauvaise réponse. « Excite » = exciter, enthousiasmer. On n'enthousiasme pas des sources. Réponse B, « cite »."}}]}, {"id": "R4_2", "part": 1, "questions": [{"n": 2, "q": "Because of the snow, the school decided to ___ the start of classes by two hours.", "options": {"A": "propose", "B": "possess", "C": "postpone", "D": "preserve"}, "answer": "C", "feedback": {"A": "Mauvaise réponse. « Propose » = proposer. On ne propose pas le début des cours « de deux heures ». Réponse C, « postpone ».", "B": "Mauvaise réponse. « Possess » = posséder. Aucun sens ici. Réponse C, « postpone ».", "C": "Bonne réponse. « Postpone » = reporter, retarder. À cause de la neige, l'école a retardé le début des cours de deux heures.", "D": "Mauvaise réponse. « Preserve » = préserver. On ne préserve pas un horaire « de deux heures ». Réponse C, « postpone »."}}]}, {"id": "R4_3", "part": 1, "questions": [{"n": 3, "q": "After three warnings, the referee finally ___ the player from the game.", "options": {"A": "elected", "B": "expected", "C": "removed", "D": "invited"}, "answer": "C", "feedback": {"A": "Mauvaise réponse. « Elected » = a élu. Un arbitre n'élit pas un joueur. Réponse C, « removed ».", "B": "Mauvaise réponse. « Expected » = attendait, s'attendait à. « Expected the player from the game » n'a pas de sens. Réponse C, « removed ».", "C": "Bonne réponse. « Removed » = a retiré, exclu. Après trois avertissements, l'arbitre a exclu le joueur du match.", "D": "Mauvaise réponse. « Invited » = a invité. On n'invite pas un joueur « hors du match » après des avertissements. Réponse C, « removed »."}}]}, {"id": "R4_4", "part": 1, "questions": [{"n": 4, "q": "The map was so ___ that we could not even find the main road.", "options": {"A": "inactive", "B": "inaccurate", "C": "inevitable", "D": "indifferent"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. « Inactive » = inactif. Une carte n'est pas inactive. Réponse B, « inaccurate ».", "B": "Bonne réponse. « Inaccurate » = inexact, faux. La carte était si inexacte qu'on n'a même pas trouvé la route principale.", "C": "Mauvaise réponse. « Inevitable » = inévitable. Une carte inévitable n'empêche pas de trouver une route. Réponse B, « inaccurate ».", "D": "Mauvaise réponse. « Indifferent » = indifférent. Une carte ne peut pas être indifférente. Réponse B, « inaccurate »."}}]}, {"id": "R4_5", "part": 1, "questions": [{"n": 5, "q": "In physics, ___ is the force that pulls objects toward the center of the earth.", "options": {"A": "gravity", "B": "gratitude", "C": "granite", "D": "gravel"}, "answer": "A", "feedback": {"A": "Bonne réponse. « Gravity » = la gravité, la force qui attire les objets vers le centre de la Terre. Vocabulaire du cours de physique.", "B": "Mauvaise réponse. « Gratitude » = gratitude. Rien à voir avec la physique. Réponse A, « gravity ».", "C": "Mauvaise réponse. « Granite » = granit, une roche. Ce n'est pas une force. Réponse A, « gravity ».", "D": "Mauvaise réponse. « Gravel » = gravier. Ce n'est pas une force. Réponse A, « gravity »."}}]}, {"id": "R4_6", "part": 1, "questions": [{"n": 6, "q": "The manager praised the staff for how ___ they handled the emergency.", "options": {"A": "efficiently", "B": "nervously", "C": "rarely", "D": "lazily"}, "answer": "A", "feedback": {"A": "Bonne réponse. « Efficiently » = efficacement. Le responsable a félicité le personnel pour l'efficacité avec laquelle il a géré l'urgence.", "B": "Mauvaise réponse. « Nervously » = nerveusement. On ne félicite pas quelqu'un d'avoir géré une urgence nerveusement. Réponse A, « efficiently ».", "C": "Mauvaise réponse. « Rarely » = rarement. Ça ne décrit pas une manière de gérer une urgence. Réponse A, « efficiently ».", "D": "Mauvaise réponse. « Lazily » = paresseusement. C'est le contraire d'un compliment. Réponse A, « efficiently »."}}]}, {"id": "R4_7", "part": 1, "questions": [{"n": 7, "q": "The company ___ its employees for their long hours with an extra week of vacation.", "options": {"A": "blamed", "B": "replaced", "C": "ignored", "D": "rewarded"}, "answer": "D", "feedback": {"A": "Mauvaise réponse. « Blamed » = a blâmé, reproché. On ne reproche pas des heures de travail en offrant des vacances. Réponse D, « rewarded ».", "B": "Mauvaise réponse. « Replaced » = a remplacé. On ne remplace pas des employés « avec une semaine de vacances ». Réponse D, « rewarded ».", "C": "Mauvaise réponse. « Ignored » = a ignoré. Offrir des vacances, ce n'est pas ignorer. Réponse D, « rewarded ».", "D": "Bonne réponse. « Rewarded » = a récompensé. L'entreprise a récompensé ses employés pour leurs longues heures avec une semaine de vacances en plus."}}]}, {"id": "R4_8", "part": 1, "questions": [{"n": 8, "q": "The old sailor described the storm so ___ that we felt we had lived through it ourselves.", "options": {"A": "vaguely", "B": "rigidly", "C": "vividly", "D": "rapidly"}, "answer": "C", "feedback": {"A": "Mauvaise réponse. « Vaguely » = vaguement. Une description vague ne donne pas l'impression d'y être. Réponse C, « vividly ».", "B": "Mauvaise réponse. « Rigidly » = rigidement. Ça ne décrit pas une manière de raconter. Réponse C, « vividly ».", "C": "Bonne réponse. « Vividly » = de façon vivante, saisissante. Le vieux marin a décrit la tempête si vivement que nous avions l'impression de l'avoir vécue.", "D": "Mauvaise réponse. « Rapidly » = rapidement. Raconter vite ne donne pas l'impression d'y être. Réponse C, « vividly »."}}]}, {"id": "R4_9", "part": 1, "questions": [{"n": 9, "q": "At Pittsburgh, two rivers ___ to form the Ohio River.", "options": {"A": "separate", "B": "disappear", "C": "freeze", "D": "merge"}, "answer": "D", "feedback": {"A": "Mauvaise réponse. « Separate » = se séparent. C'est le contraire : deux rivières qui en forment une seule se rejoignent. Réponse D, « merge ».", "B": "Mauvaise réponse. « Disappear » = disparaissent. Si elles disparaissaient, elles ne formeraient rien. Réponse D, « merge ».", "C": "Mauvaise réponse. « Freeze » = gèlent. Geler ne forme pas une nouvelle rivière. Réponse D, « merge ».", "D": "Bonne réponse. « Merge » = fusionner, se rejoindre. À Pittsburgh, deux rivières se rejoignent pour former l'Ohio."}}]}, {"id": "R4_10", "part": 1, "questions": [{"n": 10, "q": "The weather forecast was ___ by nearly ten degrees yesterday.", "options": {"A": "over", "B": "away", "C": "out", "D": "off"}, "answer": "D", "feedback": {"A": "Mauvaise réponse. « Over by » voudrait dire « au-dessus de », mais la phrase ne précise pas dans quel sens l'erreur a eu lieu : on dit simplement « off by » (faux de). Réponse D.", "B": "Mauvaise réponse. « Away by » n'existe pas dans ce sens. Réponse D, « off by ».", "C": "Mauvaise réponse. « Out by » est britannique ; en anglais américain, on dit « off by ». Réponse D.", "D": "Bonne réponse. « To be off by X » = se tromper de X. La météo s'est trompée de presque dix degrés."}}]}, {"id": "R4_11", "part": 1, "questions": [{"n": 11, "q": "The lawyer pointed out several ___ in the witness's story, and the jury began to doubt him.", "options": {"A": "compliments", "B": "inconsistencies", "C": "traditions", "D": "instructions"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. « Compliments » = compliments. Des compliments ne font pas douter un jury. Réponse B, « inconsistencies ».", "B": "Bonne réponse. « Inconsistencies » = incohérences, contradictions. L'avocat a relevé plusieurs incohérences dans le récit du témoin, et le jury a commencé à douter de lui. La fin de la phrase (« began to doubt ») donne l'indice.", "C": "Mauvaise réponse. « Traditions » = traditions. Aucun rapport avec un témoignage. Réponse B, « inconsistencies ».", "D": "Mauvaise réponse. « Instructions » = instructions. Un récit de témoin ne contient pas d'instructions. Réponse B, « inconsistencies »."}}]}, {"id": "R4_12", "part": 1, "questions": [{"n": 12, "q": "His ___ remarks about the food offended the family who had cooked all day.", "options": {"A": "timeless", "B": "tireless", "C": "tactless", "D": "toothless"}, "answer": "C", "feedback": {"A": "Mauvaise réponse. « Timeless » = intemporel. Une remarque intemporelle n'offense personne. Réponse C, « tactless ».", "B": "Mauvaise réponse. « Tireless » = infatigable. Ça décrit une personne qui ne se fatigue jamais, pas une remarque blessante. Réponse C, « tactless ».", "C": "Bonne réponse. « Tactless » = sans tact, maladroit. Ses remarques sans tact sur la nourriture ont vexé la famille qui avait cuisiné toute la journée. (« Tact » = le tact ; « -less » = sans.)", "D": "Mauvaise réponse. « Toothless » = édenté, ou sans effet. Ce n'est pas ce qui vexe une famille. Réponse C, « tactless »."}}]}, {"id": "R4_13", "part": 1, "questions": [{"n": 13, "q": "After the flood, volunteers ___ food and blankets to the families who had lost their homes.", "options": {"A": "distributed", "B": "abandoned", "C": "collected", "D": "purchased"}, "answer": "A", "feedback": {"A": "Bonne réponse. « Distributed » = ont distribué. Les bénévoles ont distribué nourriture et couvertures aux familles sinistrées.", "B": "Mauvaise réponse. « Abandoned » = ont abandonné. On n'abandonne pas des couvertures « aux familles ». Réponse A, « distributed ».", "C": "Mauvaise réponse. « Collected » = ont collecté. On collecte des dons auprès des gens (« from »), on ne collecte pas « aux familles » (« to »). Ici, les bénévoles donnent : « distributed ». Réponse A.", "D": "Mauvaise réponse. « Purchased » = ont acheté. On n'achète pas quelque chose « aux familles » au sens de « pour leur donner » avec « to ». Réponse A, « distributed »."}}]}, {"id": "R4_14", "part": 1, "questions": [{"n": 14, "q": "Her ___ to detail made her an excellent editor.", "options": {"A": "attraction", "B": "attendance", "C": "attempt", "D": "attention"}, "answer": "D", "feedback": {"A": "Mauvaise réponse. « Attraction » = attirance. On ne dit pas « attraction to detail ». Réponse D, « attention ».", "B": "Mauvaise réponse. « Attendance » = présence, assiduité. Rien à voir avec les détails. Réponse D, « attention ».", "C": "Mauvaise réponse. « Attempt » = tentative. « Attempt to detail » n'a pas de sens. Réponse D, « attention ».", "D": "Bonne réponse. « Attention to detail » = le souci du détail. C'est ce qui fait une excellente relectrice."}}]}, {"id": "R4_15", "part": 1, "questions": [{"n": 15, "q": "Both ___ cars were badly damaged in the accident.", "options": {"A": "drivers'", "B": "driver's", "C": "drivers", "D": "driver"}, "answer": "A", "feedback": {"A": "Bonne réponse. « Both drivers' cars » = les voitures des deux conducteurs. Possessif d'un pluriel régulier : apostrophe après le -s.", "B": "Mauvaise réponse. « Driver's » est le possessif d'un seul conducteur ; « both » indique qu'il y en a deux. Réponse A, « drivers' ».", "C": "Mauvaise réponse. « Both drivers cars » n'est pas correct : il manque l'apostrophe du possessif. Réponse A, « drivers' ».", "D": "Mauvaise réponse. « Both driver cars » n'est pas correct : il manque le pluriel et le possessif. Réponse A, « drivers' »."}}]}, {"id": "R4_16", "part": 1, "questions": [{"n": 16, "q": "Today's quiz was ___ than I expected.", "options": {"A": "easiest", "B": "more easy", "C": "easier", "D": "the easiest"}, "answer": "C", "feedback": {"A": "Mauvaise réponse. « Easiest » est un superlatif ; avec « than », il faut le comparatif « easier ». Réponse C.", "B": "Mauvaise réponse. « More easy » n'existe pas : « easy » est un adjectif court, son comparatif est « easier ». Réponse C.", "C": "Bonne réponse. « Easier than » = plus facile que. Comparatif d'un adjectif court en -y : on remplace le -y par -ier.", "D": "Mauvaise réponse. « The easiest » est le superlatif (le plus facile), incompatible avec « than ». Réponse C, « easier »."}}]}, {"id": "R4_17", "part": 2, "questions": [{"n": 17, "q": "___ your brother play on the soccer team this year?", "options": {"A": "Do", "B": "Is", "C": "Are", "D": "Does"}, "answer": "D", "feedback": {"A": "Mauvaise réponse. « Do » va avec I / you / we / they. Avec « your brother » (il), c'est « Does ». Réponse D.", "B": "Mauvaise réponse. « Is your brother play » est impossible : avec un verbe à la base verbale (« play »), il faut l'auxiliaire « do / does ». Réponse D.", "C": "Mauvaise réponse. « Are » est au pluriel et ne s'emploie pas avec « play » à la base verbale. Réponse D, « Does ».", "D": "Bonne réponse. Question au présent simple avec un sujet à la 3e personne du singulier : « Does your brother play…? »"}}]}, {"id": "R4_18", "part": 2, "questions": [{"n": 18, "q": "___ of these two jackets do you prefer?", "options": {"A": "What", "B": "Which", "C": "Whose", "D": "Who"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. « What » sert quand le choix est ouvert ; quand on choisit parmi un petit nombre d'éléments précis (« these two jackets »), on utilise « Which ». Réponse B.", "B": "Bonne réponse. « Which of these two jackets…? » = Laquelle de ces deux vestes… ? « Which » pour un choix entre des éléments définis.", "C": "Mauvaise réponse. « Whose » = à qui (possession). On ne demande pas à qui sont les vestes, mais laquelle on préfère. Réponse B, « Which ».", "D": "Mauvaise réponse. « Who » = qui, pour une personne. Une veste n'est pas une personne. Réponse B, « Which »."}}]}, {"id": "R4_19", "part": 2, "questions": [{"n": 19, "q": "Between you and ___, I think the test was unfair.", "options": {"A": "I", "B": "mine", "C": "me", "D": "my"}, "answer": "C", "feedback": {"A": "Mauvaise réponse. Après une préposition (« between »), on utilise un pronom complément : « between you and me ». « Between you and I » est une erreur très fréquente, même chez les Américains. Réponse C.", "B": "Mauvaise réponse. « Mine » = le mien. « Between you and mine » n'a pas de sens. Réponse C, « me ».", "C": "Bonne réponse. « Between you and me » = entre toi et moi. Après une préposition, pronom complément → « me ».", "D": "Mauvaise réponse. « My » est un possessif, il doit être suivi d'un nom. Réponse C, « me »."}}]}, {"id": "R4_20", "part": 2, "questions": [{"n": 20, "q": "The list of names ___ posted outside the gym every Monday.", "options": {"A": "are", "B": "is", "C": "be", "D": "being"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. Le sujet est « the list » (singulier), pas « names ». Singulier → « is ». Réponse B.", "B": "Bonne réponse. « The list of names is posted » : le sujet est « list », singulier, même s'il est suivi d'un pluriel. Même piège que « Each of the students has ».", "C": "Mauvaise réponse. « Be » n'est pas conjugué. Réponse B, « is ».", "D": "Mauvaise réponse. « Being » tout seul ne peut pas être le verbe principal. Réponse B, « is »."}}]}, {"id": "R4_21", "part": 2, "questions": [{"n": 21, "q": "We were very ___ to hear that the trip had been canceled.", "options": {"A": "disappointed", "B": "disappointing", "C": "disappoint", "D": "disappointment"}, "answer": "A", "feedback": {"A": "Bonne réponse. « Disappointed » = déçus : l'adjectif en -ed décrit le sentiment de la personne. Nous étions très déçus d'apprendre que le voyage était annulé.", "B": "Mauvaise réponse. « Disappointing » décrit la chose qui déçoit (« the news was disappointing »). Pour décrire ce que ressentent les personnes, c'est « disappointed ». Réponse A.", "C": "Mauvaise réponse. « Disappoint » est un verbe ; après « were very », il faut un adjectif. Réponse A, « disappointed ».", "D": "Mauvaise réponse. « Disappointment » est un nom (la déception). Après « were very », il faut un adjectif. Réponse A, « disappointed »."}}]}, {"id": "R4_22", "part": 2, "questions": [{"n": 22, "q": "By the time the bus finally arrived, we ___ for almost an hour.", "options": {"A": "wait", "B": "are waiting", "C": "had been waiting", "D": "have waited"}, "answer": "C", "feedback": {"A": "Mauvaise réponse. « Wait » est un présent simple ; la phrase est au passé (« arrived »). Réponse C, « had been waiting ».", "B": "Mauvaise réponse. « Are waiting » est au présent ; il faut un temps du passé antérieur à « arrived ». Réponse C.", "C": "Bonne réponse. « By the time + passé simple, … had been + -ing » : l'attente avait commencé avant l'arrivée du bus et durait encore. Quand le bus est enfin arrivé, nous attendions depuis presque une heure.", "D": "Mauvaise réponse. « Have waited » (present perfect) ne va pas avec une action passée terminée (« arrived »). Il faut le plus-que-parfait. Réponse C."}}]}, {"id": "R4_23", "part": 2, "questions": [{"n": 23, "q": "The coach made us ___ three extra laps after practice.", "options": {"A": "running", "B": "run", "C": "ran", "D": "to run"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. « Made us running » n'est pas possible. Après « make + personne », base verbale. Réponse B, « run ».", "B": "Bonne réponse. « Make someone do something » = obliger quelqu'un à faire quelque chose, base verbale sans « to ». Le coach nous a fait courir trois tours de plus.", "C": "Mauvaise réponse. « Ran » est un passé ; après « made us », le verbe reste à la base verbale. Réponse B, « run ».", "D": "Mauvaise réponse. Après « make someone », on met la base verbale sans « to » : « made us run ». (Avec « force », on dirait « forced us to run ».) Réponse B."}}]}, {"id": "R4_24", "part": 3, "passage": ["The cafeteria at Lincoln High was louder than any room Marcus had ever been in. Three hundred students, maybe more, were shouting over each other, scraping chairs, slamming trays. He stood just inside the double doors holding his own tray, with its square of pizza and carton of milk, and tried to look like someone who knew where he was going.", "At his old school, in a town so small that the middle and high schools shared a building, he had eaten lunch at the same table with the same four friends for three years. Here he did not know a single face. Every table seemed full, and the ones that were not full seemed to belong to somebody. He noticed a girl in a green hoodie glance at him and then look away, and his neck grew hot.", "He walked. It was better than standing still. He passed the table of athletes in matching jackets, a table of students bent over a card game, a long table where a teacher sat grading papers. At the far end, under a window, a boy with headphones around his neck was eating alone and reading a thick paperback with a dragon on the cover. Marcus had read that book twice.", "He stopped. The boy looked up, and for a moment neither of them said anything. Then Marcus pointed at the cover with his milk carton. \"The ending is unfair,\" he said. The boy's face changed. \"Right?\" he said. \"I've been saying that for a week.\" He pushed his backpack off the chair beside him. Marcus sat down. The pizza was cold, and the noise had not gotten any quieter, but by the time the bell rang, he had learned that the boy's name was Theo, that he was also new, and that there was a sequel."], "questions": [{"n": 24, "q": "What is the main idea of this story?", "options": {"A": "A boy makes a friend on his first day at a new school.", "B": "A boy complains about the food at his new school.", "C": "A boy gets lost in a large cafeteria.", "D": "A girl ignores a new student at lunch."}, "answer": "A", "feedback": {"A": "Bonne réponse. Marcus arrive dans une cantine inconnue, ne connaît personne, puis engage la conversation avec Theo grâce à un livre, et ils déjeunent ensemble. C'est l'histoire d'une première amitié.", "B": "Mauvaise réponse. La pizza froide est un détail de la dernière phrase, et il n'en fait pas une histoire. Réponse A.", "C": "Mauvaise réponse. Il traverse la cantine volontairement (« He walked. It was better than standing still »), il ne se perd pas. Réponse A.", "D": "Mauvaise réponse. La fille au sweat vert est un détail d'une phrase ; l'histoire est celle de Marcus et Theo. Réponse A."}}, {"n": 25, "q": "How does the reader know that Marcus felt uncomfortable when he entered the cafeteria?", "options": {"A": "because the pizza was cold", "B": "because a teacher was grading papers", "C": "because he tried to look like someone who knew where he was going", "D": "because the boy was wearing headphones"}, "answer": "C", "feedback": {"A": "Mauvaise réponse. La pizza froide arrive à la fin, quand il est déjà installé avec Theo. Réponse C.", "B": "Mauvaise réponse. Le prof qui corrige des copies fait partie du décor qu'il traverse. Réponse C.", "C": "Bonne réponse. « Tried to look like someone who knew where he was going » : il fait semblant d'être à l'aise, ce qui montre qu'il ne l'est pas. Le texte le confirme : « his neck grew hot ».", "D": "Mauvaise réponse. Le casque décrit Theo, pas Marcus. Réponse C."}}, {"n": 26, "q": "How does Marcus feel at the end of the story?", "options": {"A": "more at ease because he has found someone to talk to", "B": "disappointed that the sequel is not in the library", "C": "angry about the noise in the cafeteria", "D": "embarrassed that he spoke to a stranger"}, "answer": "A", "feedback": {"A": "Bonne réponse. Le bruit n'a pas baissé et la pizza est froide, « but » il a appris le nom de Theo, qu'il est nouveau aussi, et qu'il existe une suite : il est plus à l'aise, il a trouvé quelqu'un.", "B": "Mauvaise réponse. Il apprend qu'il existe une suite ; rien ne dit qu'elle est introuvable. Réponse A.", "C": "Mauvaise réponse. Le bruit est mentionné, mais la phrase dit justement que ça n'a plus d'importance. Réponse A.", "D": "Mauvaise réponse. Parler à Theo a bien fonctionné : « The boy's face changed » et il lui fait une place. Aucune gêne. Réponse A."}}, {"n": 27, "q": "Why does the author mention that Marcus had read the book twice?", "options": {"A": "to show that Marcus does not like sports", "B": "to explain why Marcus has a reason to speak to the boy", "C": "to show that Marcus's old school had a good library", "D": "to tell readers that the book is very long"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. Le texte ne dit rien de ce que Marcus pense du sport. Réponse B.", "B": "Bonne réponse. Comme il a lu le livre deux fois, il peut dire quelque chose dessus (« The ending is unfair ») : c'est ce qui lui donne le courage et le prétexte d'aborder Theo.", "C": "Mauvaise réponse. Aucune bibliothèque n'est mentionnée. Réponse B.", "D": "Mauvaise réponse. « Thick paperback » dit que le livre est épais ; « read that book twice » dit que Marcus le connaît bien. Réponse B."}}]}, {"id": "R4_28", "part": 3, "passage": ["In most classrooms, the student who raises a hand to answer a question is admired. The student who raises a hand to ask one is sometimes seen as slow, as if a question were a confession that something had not been understood. Many students learn early to keep their questions to themselves. Research on learning suggests that this is exactly backward.", "Consider two students in a chemistry class. The teacher explains why ice floats on water. The first student nods, writes down the explanation, and moves on. The second student is <u>puzzled<\/u>: if ice is made of water, why is it lighter than water? She asks. The teacher draws the shape of a water molecule on the board, and suddenly the whole class understands something that the textbook had only stated. The student who asked did not know less than the others. She noticed more.", "Mr. Alvarado, a science teacher, hung a sign above his whiteboard that students read every day for a year:", {"quote": ["The answer you were given", "stays on the page.", "The answer you asked for", "goes home with you."]}, "His students teased him about the sign, and a few of them copied it onto their notebooks as a joke. But the pattern in his classroom was hard to miss. The students who asked the most questions were not the weakest. They were the ones who, at the end of the year, could explain the material to someone else. An answer you receive without asking is easy to forget. An answer you went looking for belongs to you."], "questions": [{"n": 28, "q": "What is the main purpose of the passage?", "options": {"A": "to explain why ice floats on water", "B": "to describe a science teacher's career", "C": "to criticize students who answer too quickly", "D": "to explain why asking questions helps students learn"}, "answer": "D", "feedback": {"A": "Mauvaise réponse. L'exemple de la glace sert à illustrer l'idée ; le texte ne l'explique pas vraiment. Réponse D.", "B": "Mauvaise réponse. Mr. Alvarado n'apparaît qu'au troisième paragraphe, comme exemple. Réponse D.", "C": "Mauvaise réponse. Le texte ne critique pas ceux qui répondent ; il réhabilite ceux qui demandent. Réponse D.", "D": "Bonne réponse. Du premier paragraphe (« this is exactly backward ») à la conclusion (« an answer you went looking for belongs to you »), le texte défend l'idée que poser des questions fait apprendre."}}, {"n": 29, "q": "In this passage, what does an answer that \"goes home with you\" symbolize?", "options": {"A": "homework that must be finished at home", "B": "knowledge that a student truly keeps", "C": "a note sent to a student's parents", "D": "a question that the teacher could not answer"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. Il ne s'agit pas de devoirs ; « goes home with you » est une image : la réponse vous accompagne, vous la gardez. Réponse B.", "B": "Bonne réponse. La carte oppose la réponse donnée, qui « reste sur la page », et la réponse demandée, qui « rentre à la maison avec vous » : c'est le savoir qu'on garde vraiment. Le dernier paragraphe le confirme : « belongs to you ».", "C": "Mauvaise réponse. Aucun mot aux parents dans le texte. Réponse B.", "D": "Mauvaise réponse. Dans l'exemple, le prof répond très bien à la question. Réponse B."}}, {"n": 30, "q": "In the second paragraph, what does the underlined word <u>puzzled<\/u> mean?", "options": {"A": "angry", "B": "bored", "C": "confused and curious", "D": "satisfied"}, "answer": "C", "feedback": {"A": "Mauvaise réponse. « Angry » = en colère. Rien n'indique de la colère ; elle est intriguée. Réponse C.", "B": "Mauvaise réponse. « Bored » = ennuyé. L'élève n'est pas ennuyée, elle se pose une question. Réponse C.", "C": "Bonne réponse. « Puzzled » = perplexe, intrigué. La suite le montre : « if ice is made of water, why is it lighter than water? She asks. »", "D": "Mauvaise réponse. « Satisfied » = satisfait. C'est le premier élève qui est satisfait et « moves on » ; la seconde, elle, se pose une question. Réponse C."}}, {"n": 31, "q": "The author uses Mr. Alvarado's sign to help explain what happens if ___.", "options": {"A": "you copy a sign into your notebook", "B": "you study chemistry", "C": "you tease your teacher", "D": "you receive an answer without asking for it"}, "answer": "D", "feedback": {"A": "Mauvaise réponse. Les élèves qui recopient la carte, c'est une anecdote ; la carte elle-même parle des réponses données et des réponses demandées. Réponse D.", "B": "Mauvaise réponse. La chimie est juste la matière de l'exemple. Réponse D.", "C": "Mauvaise réponse. Les moqueries sont un détail ; la carte ne parle pas de ça. Réponse D.", "D": "Bonne réponse. « The answer you were given stays on the page » : une réponse reçue sans l'avoir demandée reste sur la page, on l'oublie. Le dernier paragraphe le reformule : « An answer you receive without asking is easy to forget. »"}}]}, {"id": "R4_32", "part": 3, "passage": ["Every almanac, every eclipse prediction, and every map of a new city depends on careful mathematics. In the eighteenth century, one of the most skilled mathematicians in the American colonies had almost no formal education and learned most of what he knew from borrowed books. Benjamin Banneker was born in 1731 on a farm in Maryland. Unlike most Black people in the colonies at that time, his family was free, and his grandmother, who had come from England, taught him to read. He attended a small Quaker school for a few winters, but after that he worked on the family farm and studied on his own.", "Banneker was curious about how things worked. In his early twenties, after examining a borrowed pocket watch, he carved a working clock entirely out of wood. It struck every hour and kept running for more than forty years. Later, a neighbor lent him books and instruments on astronomy, and Banneker taught himself to calculate the positions of the stars and planets. In 1789, he correctly predicted a solar eclipse, <u>contradicting<\/u> the calculations of two well-known experts.", "His reputation grew. In 1791, he was asked to help survey the land for the new capital city of the United States, which would become Washington, D.C. For several months, he spent his nights observing the stars to fix the exact position of the boundary lines. Between 1792 and 1797, he published a series of almanacs containing his own astronomical calculations, weather predictions, and essays. He sent the first one to Thomas Jefferson with a letter arguing that Black people were just as capable as anyone else and that slavery was wrong. Banneker died in 1806. Today, schools, parks, and a Washington neighborhood carry his name."], "questions": [{"n": 32, "q": "What is this text mainly about?", "options": {"A": "how the city of Washington, D.C. was planned", "B": "a self-taught mathematician and astronomer", "C": "the history of wooden clocks", "D": "farming in colonial Maryland"}, "answer": "B", "feedback": {"A": "Mauvaise réponse. Le relevé du terrain de la future capitale est un épisode de sa vie, pas le sujet du texte. Réponse B.", "B": "Bonne réponse. Le texte suit Benjamin Banneker : son éducation très limitée, l'horloge en bois, l'astronomie apprise seul, l'éclipse, le relevé de Washington, les almanachs. C'est le portrait d'un savant autodidacte.", "C": "Mauvaise réponse. L'horloge en bois est un exemple de sa curiosité, pas le sujet du texte. Réponse B.", "D": "Mauvaise réponse. La ferme est seulement le lieu où il a grandi et travaillé. Réponse B."}}, {"n": 33, "q": "How did Banneker learn astronomy?", "options": {"A": "He studied at a university in England.", "B": "He learned it at the Quaker school.", "C": "His grandmother taught him.", "D": "A neighbor lent him books and instruments."}, "answer": "D", "feedback": {"A": "Mauvaise réponse. Il n'est jamais allé en Angleterre ; c'est sa grand-mère qui en venait. Réponse D.", "B": "Mauvaise réponse. L'école quaker ne lui a donné que quelques hivers d'instruction de base ; l'astronomie, il l'a apprise seul plus tard. Réponse D.", "C": "Mauvaise réponse. Sa grand-mère lui a appris à lire, pas l'astronomie. Réponse D.", "D": "Bonne réponse. « A neighbor lent him books and instruments on astronomy, and Banneker taught himself to calculate the positions of the stars and planets. »"}}, {"n": 34, "q": "In paragraph 2, what does the underlined word <u>contradicting<\/u> mean?", "options": {"A": "disagreeing with", "B": "copying", "C": "confirming", "D": "explaining"}, "answer": "A", "feedback": {"A": "Bonne réponse. « Contradicting » = contredisant. Sa prédiction contredisait les calculs de deux experts connus, et il avait raison.", "B": "Mauvaise réponse. « Copying » = copier. S'il avait copié les experts, il n'aurait pas eu un résultat différent. Réponse A.", "C": "Mauvaise réponse. « Confirming » = confirmer, c'est le contraire. Sa prédiction était différente de celle des experts, et c'est lui qui avait raison. Réponse A.", "D": "Mauvaise réponse. « Explaining » = expliquer. Il ne les expliquait pas, il arrivait à un résultat opposé. Réponse A."}}, {"n": 35, "q": "According to the text, why did Banneker write to Thomas Jefferson?", "options": {"A": "to argue that Black people were as capable as anyone and that slavery was wrong", "B": "to sell him a wooden clock", "C": "to ask for a job surveying the capital", "D": "to ask for help predicting an eclipse"}, "answer": "A", "feedback": {"A": "Bonne réponse. « He sent the first one to Thomas Jefferson with a letter arguing that Black people were just as capable as anyone else and that slavery was wrong. »", "B": "Mauvaise réponse. L'horloge n'a rien à voir avec la lettre, qui accompagnait un almanach. Réponse A.", "C": "Mauvaise réponse. Le relevé de la capitale a eu lieu en 1791, et ce n'est pas l'objet de la lettre. Réponse A.", "D": "Mauvaise réponse. Il avait prédit l'éclipse seul, deux ans plus tôt, sans aide. Réponse A."}}]}]}]}</script>
<script>
const ALL = JSON.parse(document.getElementById('data').textContent);
let DATA = null, TEST = null;

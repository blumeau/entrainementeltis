const app = document.getElementById('app');
const PART_FR_L = {1:'Suivre des consignes de classe', 2:'Comprendre le langage mathématique', 3:'Comprendre une conversation courte', 4:'Comprendre un dialogue en classe', 5:'Comprendre un exposé'};
const PART_FR_R = {1:'Vocabulaire académique', 2:'Grammaire et structure de la phrase', 3:'Comprendre des textes'};
const isReading = t => (t || TEST) && (t || TEST).mode === 'reading';
const partName = p => (isReading() ? PART_FR_R : PART_FR_L)[p];
const nQuestions = t => t.exercises.reduce((s,e) => s + e.questions.length, 0);
const READ_INSTR = {1:'Choose the word or phrase that best completes the sentence.', 2:'Choose the word or phrase that correctly completes the sentence.', 3:'Read the passage, then answer the questions. You can scroll inside the text.'};
/* ---------- Configuration Hodos (à adapter) ---------- */
const CONFIG = {
  webhook: '',          // URL du webhook Make qui reçoit les résultats (vide = aucun envoi)
  lockKey: 'a32dbc8f20bf635f66648c3c',  // clé partagée avec Softr : la page exige ?key=<lockKey>
  requireStudent: true  // true = la page refuse de s'ouvrir sans ?student=<email> (ouverture depuis Softr uniquement)
};
const PARAMS = new URLSearchParams(location.search);
const STUDENT = { email: (PARAMS.get('student') || '').trim().toLowerCase(), name: (PARAMS.get('name') || '').trim(), key: PARAMS.get('key') || '' };
const NS = STUDENT.email ? 'eltis-' + STUDENT.email + '-' : 'eltis-';
const store = {
  get(id){ try { return JSON.parse(localStorage.getItem(NS + id) || '{}'); } catch(e){ return {}; } },
  set(id, v){ try { localStorage.setItem(NS + id, JSON.stringify(v)); } catch(e){} }
};
function report(ex, entry){
  if (!CONFIG.webhook) return;
  const s = testStats(TEST);
  const payload = {
    student: STUDENT.email, name: STUDENT.name,
    test: TEST.id, testLabel: TEST.label, mode: TEST.mode || 'listening',
    part: ex.part, partTitle: (TEST.parts.find(p => p.part === ex.part) || {}).title || '',
    exercise: ex.id, score: entry.score, total: entry.total, answers: entry.answers,
    testDone: s.done === s.n, testScore: s.score, testTotal: s.total,
    at: new Date().toISOString()
  };
  const body = JSON.stringify(payload);
  fetch(CONFIG.webhook, {method:'POST', headers:{'Content-Type':'application/json'}, body})
    .catch(() => fetch(CONFIG.webhook, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body}).catch(()=>{}));
}
let results = {};
function selectTest(t){ TEST = t; DATA = t; results = store.get(t.id); try { localStorage.setItem(NS + 'last', t.id); } catch(e){} }
function testStats(t){
  const r = store.get(t.id);
  const done = t.exercises.filter(e => r[e.id]).length;
  const score = t.exercises.reduce((s,e) => s + (r[e.id]?.score || 0), 0);
  const total = t.exercises.reduce((s,e) => s + e.questions.length, 0);
  return { done, score, total, n: t.exercises.length };
}

/* ---------- Tests: choose a mock test ---------- */
function renderTests(){
  stopAudio(); current = null; DATA = null; TEST = null;
  const list = tests => h('div', {class:'path'}, ...tests.map((t, i) => {
    const s = testStats(t); const done = s.done === s.n;
    const badge = h('div', {class:'badge', html: done ? CHECK : String(i + 1)});
    return h('div', {class:'step' + (done ? ' done' : '') + (!done && s.done ? ' current' : ''), tabindex:'0', role:'button',
        onclick:()=>{ selectTest(t); renderHome(); }, onkeydown:ev=>{ if (ev.key==='Enter'||ev.key===' '){ selectTest(t); renderHome(); } }},
      badge,
      h('div', {}, h('p', {class:'eyebrow'}, `${nQuestions(t)} questions · ${t.parts.length} parties`), h('h2', {}, t.label), h('p', {class:'sub'}, t.desc || '')),
      h('span', {class:'st'}, done ? `${s.score}/${s.total}` : s.done ? `${s.done}/${s.n} faits` : 'Commencer')
    );
  }));
  app.replaceChildren(
    h('div', {class:'stack', style:'gap:8px'},
      h('p', {class:'eyebrow'}, 'ELTiS · tests blancs'),
      h('h1', {}, 'Choisis un test blanc'),
      h('p', {}, 'Chaque test suit le format officiel. Listening : 27 questions, 5 parties, une seule écoute par exercice. Reading : 35 questions, 3 parties, sans audio. Après chaque exercice, la correction en français.')
    ),
    h('h2', {class:'secttl'}, 'Compréhension orale · Listening'),
    list(ALL.tests.filter(t => t.mode !== 'reading')),
    h('h2', {class:'secttl'}, 'Compréhension écrite · Reading'),
    list(ALL.tests.filter(t => t.mode === 'reading'))
  );
}
function diagBox_unused(){
  const box = h('p', {class:'sub', id:'diag', style:'font-size:12px;word-break:break-all;opacity:.7'}, 'Diagnostic : ');
  const add = t => { box.appendChild(document.createTextNode(t + ' · ')); };
  add('href=' + location.href); add('base=' + document.baseURI);
  fetch('audio/P1_item_1.mp3', {headers:{Range:'bytes=0-99'}}).then(r => add('fetch audio ' + r.status + ' ' + (r.headers.get('content-type')||''))).catch(e => add('fetch audio ERR ' + e.message));
  const a = new Audio('audio/P1_item_1.mp3'); a.preload = 'metadata';
  a.addEventListener('loadedmetadata', () => add('audio meta OK ' + Math.round(a.duration) + 's'));
  a.addEventListener('error', () => add('audio ERR code ' + (a.error && a.error.code) + ' src=' + a.currentSrc));
  add('canPlay mp3=' + a.canPlayType('audio/mpeg'));
  return box;
}
let current = null, audioEl = null;

function h(tag, attrs = {}, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (k === 'class') el.className = v; else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}
function stopAudio(){ if (audioEl){ audioEl.pause(); audioEl.src = ''; audioEl = null; } }
const exOf = part => DATA.exercises.filter(e => e.part === part);
const partDone = part => exOf(part).every(e => results[e.id]);
const partUnlocked = part => part === 1 || partDone(part - 1);
const CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>';
const LOCK = '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';

/* ---------- Home: the path ---------- */
function renderHome(){
  stopAudio(); current = null;
  app.replaceChildren();
  const doneEx = DATA.exercises.filter(e => results[e.id]).length;
  const score = DATA.exercises.reduce((s,e) => s + (results[e.id]?.score || 0), 0);
  const total = DATA.exercises.reduce((s,e) => s + e.questions.length, 0);
  const allDone = doneEx === DATA.exercises.length;
  app.append(
    h('div', {class:'stack', style:'gap:8px'},
      h('p', {class:'eyebrow'}, TEST.label),
      h('h1', {}, isReading() ? 'Compréhension écrite' : 'Compréhension orale'),
      h('p', {}, isReading() ? '35 questions en 3 parties, dans l’ordre du vrai test : vocabulaire, grammaire, puis trois textes avec quatre questions chacun. Chaque partie se débloque quand la précédente est terminée. Tu valides question par question et tu lis la correction en français.'
                            : '27 questions en 5 parties, dans l’ordre du vrai test. Chaque partie se débloque quand la précédente est terminée. Une seule écoute par exercice, puis la correction en français.'),
      h('div', {class:'progress'}, h('i', {style:`width:${100*doneEx/DATA.exercises.length}%`}))
    ),
    allDone ? h('div', {class:'card'}, h('div', {class:'score'}, h('span', {class:'n'}, String(score)), h('span', {class:'d'}, `/ ${total} bonnes réponses sur le test complet`))) : null,
    h('div', {class:'path'}, ...DATA.parts.map(p => {
      const exs = exOf(p.part), d = exs.filter(e => results[e.id]).length;
      const done = d === exs.length, unlocked = partUnlocked(p.part), cur = unlocked && !done;
      const sc = exs.reduce((s,e)=>s+(results[e.id]?.score||0),0), tot = exs.reduce((s,e)=>s+e.questions.length,0);
      const badge = h('div', {class:'badge', html: done ? CHECK : (!unlocked ? LOCK : String(p.part))});
      return h('div', {class:'step' + (done?' done':'') + (!unlocked?' locked':'') + (cur?' current':''), tabindex: unlocked ? '0' : '-1', role:'button', 'aria-disabled': !unlocked,
          onclick:()=>{ if (unlocked) openPart(p.part); }, onkeydown:ev=>{ if (unlocked && (ev.key==='Enter'||ev.key===' ')) openPart(p.part); }},
        badge,
        h('div', {}, h('p', {class:'eyebrow'}, `Partie ${p.part} · questions ${p.questions}`), h('h2', {}, partName(p.part)), h('p', {class:'sub'}, p.title)),
        h('span', {class:'st'}, done ? `${sc}/${tot}` : !unlocked ? 'Verrouillé' : d ? `${d}/${exs.length} faits` : (p.part===1 ? 'Commencer' : 'À faire'))
      );
    })),
    h('div', {class:'row'},
      h('button', {class:'btn', type:'button', onclick:renderTests}, 'Changer de test'),
      doneEx ? h('button', {class:'btn', type:'button', onclick:()=>{ if (confirmReset()) { results = {}; store.set(TEST.id, results); renderHome(); } }}, 'Recommencer le test') : null)
  );
}
let resetArmed = false;
function confirmReset(){ if (resetArmed){ resetArmed=false; return true; } resetArmed = true; setTimeout(()=>resetArmed=false, 4000); app.append(h('p', {class:'eyebrow', style:'color:var(--bad)'}, 'Clique encore une fois pour effacer tes résultats.')); return false; }

function openPart(part){
  const exs = exOf(part);
  const first = exs.find(e => !results[e.id]) || exs[0];
  current = DATA.exercises.indexOf(first);
  renderExercise();
}

/* ---------- Exercise ---------- */
function renderExercise(){
  stopAudio();
  const ex = DATA.exercises[current];
  const prev = results[ex.id];
  const picks = prev ? {...prev.answers} : {};
  const reading = isReading();
  const state = { listened: !!prev || reading, playing:false, validated: !!prev };
  app.replaceChildren();

  const exs = exOf(ex.part);
  const chips = h('div', {class:'exlist'}, ...exs.map((e,i) => h('span', {class:'chip' + (results[e.id] ? ' done' : '') + (e.id===ex.id ? ' now' : '')}, e.questions.length === 1 ? `Q${e.questions[0].n}` : `Q${e.questions[0].n}–${e.questions[e.questions.length-1].n}`)));
  const total = nQuestions(DATA);
  const head = h('div', {class:'stack', style:'gap:8px'},
    h('p', {class:'eyebrow'}, `Partie ${ex.part} · ${partName(ex.part)}`),
    h('h1', {}, ex.questions.length === 1 ? `Question ${ex.questions[0].n} out of ${total}` : `Questions ${ex.questions[0].n}–${ex.questions[ex.questions.length-1].n} out of ${total}`),
    chips
  );
  const instr = h('div', {class:'instr'}, ex.instruction || (reading ? READ_INSTR[ex.part] : ''));

  const bar = h('i'); const time = h('span', {class:'time'}, '0:00');
  const ptxt = h('div', {class:'ptxt'}, state.validated ? 'Exercise completed' : 'Press play when you are ready', h('small', {}, state.validated ? 'Tu peux réécouter pour revoir la correction.' : 'One listening only. No pause, no rewind.'));
  const playBtn = h('button', {class:'playbtn', type:'button', 'aria-label':'Play', onclick: play}, h('span', {html:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'}));
  const player = h('div', {class:'player'}, h('div', {class:'big'}, playBtn, ptxt), h('div', {class:'bar'}, bar), h('div', {class:'row between'}, h('span', {class:'time'}, 'Listening'), time));
  function fmt(s){ s = Math.max(0, Math.round(s)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
  function play(){
    if (state.playing || (state.listened && !state.validated)) return;
    audioEl = new Audio(ex.audio); audioEl.preload = 'auto';
    state.playing = true; state.listened = true; playBtn.disabled = true;
    ptxt.firstChild.textContent = 'Listening…'; ptxt.lastChild.textContent = 'You can answer while you listen, and submit as soon as you have answered everything.';
    audioEl.addEventListener('timeupdate', () => { if (audioEl.duration){ bar.style.width = (100*audioEl.currentTime/audioEl.duration)+'%'; time.textContent = fmt(audioEl.currentTime) + ' / ' + fmt(audioEl.duration); } });
    audioEl.addEventListener('ended', () => { state.playing = false; bar.style.width='100%'; if (!state.validated){ ptxt.firstChild.textContent = 'Listening finished'; ptxt.lastChild.textContent = 'Check your answers, then submit.'; refreshValidate(); } });
    audioEl.addEventListener('error', () => {
      if (!audioEl.dataset.retried){ audioEl.dataset.retried='1';
        fetch(ex.audio).then(r => { if (!r.ok) throw 0; return r.blob(); }).then(b => { audioEl.src = URL.createObjectURL(b); return audioEl.play(); })
          .catch(() => { state.playing=false; ptxt.firstChild.textContent = 'The audio file did not load'; ptxt.lastChild.textContent = 'Check your connection and reload the page.'; });
        return; }
      state.playing=false; ptxt.firstChild.textContent = 'The audio file did not load'; ptxt.lastChild.textContent = 'Check your connection and reload the page.'; });
    audioEl.play().catch(()=>{ state.playing=false; state.listened=false; playBtn.disabled=false; ptxt.firstChild.textContent = 'Could not start the audio'; });
    refreshValidate();
  }

  let stimulus = null;
  if (!reading && ex.part === 1) stimulus = h('div', {class:'imgbox', id:'img-'+ex.id, style:'border-style:solid;padding:0;overflow:hidden;aspect-ratio:3/2'}, h('img', {src: ex.image || ('img/p1_' + ex.questions[0].n + '.jpg'), alt:'Picture ' + ex.questions[0].n, style:'width:100%;height:100%;object-fit:cover;border-radius:12px'}));
  if (!reading && ex.part >= 3 && ex.intro) stimulus = h('p', {style:'color:var(--muted);font-style:italic'}, ex.intro);
  if (reading && ex.passage) stimulus = h('div', {class:'passage', tabindex:'0', 'aria-label':'Reading passage'}, ...ex.passage.map(p => typeof p === 'string' ? h('p', {html:p}) : h('div', {class:'quote'}, ...p.quote.map(l => h('div', {}, l)))));

  const letters = reading ? ['A','B','C','D'] : ['A','B','C'];
  const qBlocks = ex.questions.map(q => {
    const optEls = {};
    const opts = h('div', {class:'opts'}, ...letters.map(L => {
      const b = h('button', {class:'opt' + (!reading && ex.part===2 ? ' math' : ''), type:'button', onclick:()=>{ if (state.validated) return; picks[q.n] = L; Object.values(optEls).forEach(o=>o.classList.remove('sel')); b.classList.add('sel'); refreshValidate(); }},
        h('b', {}, L), h('span', {}, q.options[L]));
      if (picks[q.n]===L) b.classList.add('sel');
      optEls[L] = b; return b;
    }));
    const fbEl = h('div', {class:'fb', hidden:true});
    const qt = h('p', {class:'qt'}, h('span', {class:'num'}, q.n + '.')); qt.append(reading ? h('span', {html:q.q}) : q.q);
    const block = h('div', {class:'card q'}, qt, opts, fbEl);
    block._grade = () => {
      const pick = picks[q.n]; const ok = pick === q.answer;
      Object.entries(optEls).forEach(([L,o]) => { o.disabled = true; o.classList.remove('sel'); if (L===q.answer) o.classList.add('ok'); else if (L===pick) o.classList.add('bad'); });
      fbEl.hidden = false; fbEl.className = 'fb ' + (ok ? 'ok' : 'bad');
      fbEl.replaceChildren(h('div', {class:'lab'}, ok ? 'Bonne réponse' : (pick ? `Mauvaise réponse · tu as choisi ${pick}, la bonne réponse était ${q.answer}` : 'Pas de réponse')), h('div', {}, pick ? q.feedback[pick] : q.feedback[q.answer]));
      return ok;
    };
    return block;
  });

  const validate = h('button', {class:'btn primary', type:'button', disabled:true, onclick:doValidate}, 'Submit my answers');
  const hint = h('p', {class:'eyebrow'}, '');
  function refreshValidate(){
    if (state.validated) return;
    const answered = ex.questions.every(q => picks[q.n]);
    validate.disabled = !(state.listened && answered);
    hint.textContent = !state.listened ? 'Press play to start.' : !answered ? (reading ? 'Choose an answer to go on.' : 'Answer every question to submit.') : state.playing ? 'You can submit now: the audio will stop.' : '';
  }
  const idx = DATA.exercises.indexOf(ex);
  const nextInPart = exs[exs.indexOf(ex) + 1];
  const prevInPart = exs[exs.indexOf(ex) - 1];
  const nav = h('div', {class:'row between'},
    h('div', {class:'row'},
      h('button', {class:'btn', type:'button', onclick:renderHome}, 'Retour au parcours'),
      reading && prevInPart ? h('button', {class:'btn', type:'button', onclick:()=>{ current = DATA.exercises.indexOf(prevInPart); renderExercise(); }}, 'Back') : null),
    nextInPart ? h('button', {class:'btn primary', type:'button', onclick:()=>{ current = DATA.exercises.indexOf(nextInPart); renderExercise(); }}, reading ? 'Go On' : 'Exercice suivant')
               : h('button', {class:'btn primary', type:'button', onclick:renderHome}, ex.part < DATA.parts.length ? `Partie ${ex.part} terminée · voir le parcours` : 'Voir mon score final')
  );
  nav.hidden = !state.validated;
  const transcript = reading ? null : h('details', {}, h('summary', {}, 'Voir le texte de l’audio'), h('div', {class:'tr'}, ...(ex.transcript || []).map(t => h('p', {}, t))));
  if (transcript) transcript.hidden = !state.validated;
  if (reading) validate.textContent = ex.questions.length === 1 ? 'Check my answer' : 'Check my answers';

  function doValidate(){
    state.validated = true; state.playing = false; stopAudio(); playBtn.disabled = false; bar.style.width = '100%';
    let score = 0; qBlocks.forEach(b => { if (b._grade()) score++; });
    results[ex.id] = { answers: picks, score, total: ex.questions.length, at: Date.now() };
    store.set(TEST.id, results);
    report(ex, results[ex.id]);
    validate.hidden = true; hint.hidden = true; nav.hidden = false; if (transcript) transcript.hidden = false;
    ptxt.firstChild.textContent = `${score}/${ex.questions.length} · exercise completed`; ptxt.lastChild.textContent = 'Tu peux réécouter pour revoir la correction.';
    if (ex.questions.length > 1) validate.after(h('div', {class:'card'}, h('div', {class:'score'}, h('span', {class:'n'}, String(score)), h('span', {class:'d'}, `/ ${ex.questions.length} à cet exercice`))));
    window.scrollTo({top: qBlocks[0].offsetTop - 20, behavior:'smooth'});
  }

  app.append(...[head, instr, reading ? null : player, stimulus, ...qBlocks, validate, hint, nav, transcript].filter(Boolean));
  if (state.validated){ qBlocks.forEach(b => b._grade()); validate.hidden = true; hint.hidden = true; }
  else refreshValidate();
  window.scrollTo(0,0);
}

document.getElementById('homeBtn').addEventListener('click', () => { if (TEST) renderHome(); else renderTests(); });
(function(){
  const locked = (CONFIG.requireStudent && !STUDENT.email) || (CONFIG.lockKey && STUDENT.key !== CONFIG.lockKey);
  if (locked){
    app.replaceChildren(h('div', {class:'card stack'},
      h('p', {class:'eyebrow'}, 'Accès réservé'),
      h('h1', {}, 'Ouvre cette page depuis ton espace Hodos'),
      h('p', {}, "L'entraînement ELTiS est accessible uniquement depuis ton espace élève, pour que tes résultats soient enregistrés sur ton compte.")));
    return;
  }
  if (STUDENT.name || STUDENT.email){ const b = document.querySelector('.brand small'); if (b) b.textContent = STUDENT.name || STUDENT.email; }
  let last = null; try { last = localStorage.getItem(NS + 'last'); } catch(e){}
  const t = ALL.tests.find(x => x.id === last);
  if (t){ selectTest(t); renderHome(); } else renderTests();
})();
</script>

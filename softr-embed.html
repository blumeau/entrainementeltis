<!-- Bloc « Custom code » Softr : espace élève, page Entraînement ELTiS. -->
<div id="eltis-wrap" style="width:100%;height:calc(100vh - 120px);min-height:640px"></div>
<script>
(function(){
  var u = window.logged_in_user || {};
  var email = u.softr_user_email || '';
  var name  = u.softr_user_full_name || '';
  var src = 'https://blumeau.github.io/entrainementeltis/'
          + '?student=' + encodeURIComponent(email)
          + '&name='    + encodeURIComponent(name)
          + '&key=a32dbc8f20bf635f66648c3c';
  var f = document.createElement('iframe');
  f.src = src; f.title = 'Entraînement ELTiS';
  f.style.cssText = 'width:100%;height:100%;border:0;border-radius:12px';
  f.setAttribute('allow', 'autoplay');
  document.getElementById('eltis-wrap').appendChild(f);
})();
</script>
